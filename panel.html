<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>04agri.com — Yönetim Paneli</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#fff; --ink:#17150f; --ink-soft:#6a655a;
    --line:#e3ded3; --accent:#44BD32; --pin:#E84142;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }

  /* GİRİŞ EKRANI */
  .login-wrap {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
  }
  .login-box {
    background: var(--card);
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    width: 100%; max-width: 380px;
  }
  .login-box h1 { font-size: 22px; margin: 0 0 24px; }
  .login-box input {
    width: 100%; padding: 12px 14px; margin-bottom: 12px;
    border: 1px solid var(--line); border-radius: 10px; font-size: 15px;
  }
  .login-box button {
    width: 100%; padding: 13px; background: var(--ink); color: #fff;
    border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .msg { margin-top: 14px; font-size: 14px; color: #444; text-align: center; }
  .err { color: var(--pin); }

  /* PANEL İSKELETİ */
  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; background: var(--card); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10;
  }
  .panel-header .brand { font-weight: 800; font-size: 18px; }
  .panel-header .who { font-size: 13px; color: var(--ink-soft); }
  .logout-btn {
    background: var(--bg); border: 1px solid var(--line); padding: 8px 16px;
    border-radius: 100px; font-weight: 700; font-size: 13px; cursor: pointer;
  }

  .tabs {
    display: flex; gap: 8px; padding: 16px 24px 0; flex-wrap: wrap;
  }
  .tab-btn {
    padding: 10px 18px; border-radius: 100px; border: 1px solid var(--line);
    background: var(--card); font-weight: 700; font-size: 14px; cursor: pointer;
    color: var(--ink-soft);
  }
  .tab-btn.active { background: var(--ink); color: #fff; border-color: transparent; }

  .tab-content {
    padding: 24px; max-width: 1100px; margin: 0 auto;
  }
  .placeholder-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 40px; text-align: center; color: var(--ink-soft); font-size: 15px;
  }

  .hidden { display: none; }
</style>
</head>
<body>

<!-- GİRİŞ EKRANI -->
<div id="loginScreen" class="login-wrap">
  <div class="login-box">
    <h1>04agri.com Yönetim Paneli</h1>
    <input type="email" id="email" placeholder="E-posta" />
    <input type="password" id="password" placeholder="Şifre" />
    <button onclick="girisYap()">Giriş Yap</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<!-- PANEL EKRANI (giriş sonrası) -->
<div id="panelScreen" class="hidden">
  <div class="panel-header">
    <div>
      <div class="brand">04agri.com Panel</div>
      <div class="who" id="whoText"></div>
    </div>
    <button class="logout-btn" onclick="cikisYap()">Çıkış Yap</button>
  </div>

  <!-- İŞLETME SEKMELERİ -->
  <div id="businessTabs" class="tabs hidden">
    <button class="tab-btn active" data-tab="appointments">Randevularım</button>
    <button class="tab-btn" data-tab="hours">Çalışma Saatleri</button>
    <button class="tab-btn" data-tab="blog">Blog</button>
    <button class="tab-btn" data-tab="profile">Profil Ayarları</button>
  </div>

  <!-- ADMIN SEKMELERİ -->
  <div id="adminTabs" class="tabs hidden">
    <button class="tab-btn active" data-tab="businesses">İşletmeler</button>
    <button class="tab-btn" data-tab="allAppointments">Tüm Randevular</button>
    <button class="tab-btn" data-tab="allBlog">Blog Onayları</button>
    <button class="tab-btn" data-tab="adminProfile">Profilim</button>
  </div>

  <div class="tab-content">
    <div class="placeholder-card" id="tabContentBox">
      Yükleniyor...
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const supabaseClient = supabase.createClient(
    'https://ckxqfasgddhgbpnxaaja.supabase.co',
    'sb_publishable_gEX1rPpXyfxdY0WPhK0KNw_vZSQAj7Z'
  );

  let currentRole = null;

  async function girisYap() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const msg = document.getElementById('msg');
    msg.textContent = 'Giriş yapılıyor...';
    msg.className = 'msg';

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      msg.textContent = 'Hata: ' + error.message;
      msg.className = 'msg err';
      return;
    }

    await girisSonrasiYukle();
  }

  async function girisSonrasiYukle() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) return;

    const { data: profile, error: profileError } = await supabaseClient
      .from('profiles')
      .select('role')
      .eq('id', user.id)
      .single();

    if (profileError || !profile) {
      document.getElementById('msg').textContent = 'Rol bilgisi bulunamadı.';
      document.getElementById('msg').className = 'msg err';
      return;
    }

    currentRole = profile.role;

    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('panelScreen').classList.remove('hidden');
    document.getElementById('whoText').textContent = user.email + ' — ' + (currentRole === 'admin' ? 'Yönetici' : 'İşletme');

    if (currentRole === 'admin') {
      document.getElementById('adminTabs').classList.remove('hidden');
      setupTabs('adminTabs');
      renderTab('businesses');
    } else {
      document.getElementById('businessTabs').classList.remove('hidden');
      setupTabs('businessTabs');
      renderTab('appointments');
    }
  }

  function setupTabs(containerId) {
    const container = document.getElementById(containerId);
    const buttons = container.querySelectorAll('.tab-btn');
    buttons.forEach(btn => {
      btn.onclick = () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderTab(btn.dataset.tab);
      };
    });
  }

  function renderTab(tabName) {
    const box = document.getElementById('tabContentBox');
    const names = {
      appointments: 'Randevularım',
      hours: 'Çalışma Saatleri',
      blog: 'Blog',
      profile: 'Profil Ayarları',
      businesses: 'İşletmeler',
      allAppointments: 'Tüm Randevular',
      allBlog: 'Blog Onayları',
      adminProfile: 'Profilim'
    };
    box.textContent = (names[tabName] || tabName) + ' — bu bölüm bir sonraki adımda eklenecek.';
  }

  async function cikisYap() {
    await supabaseClient.auth.signOut();
    document.getElementById('panelScreen').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('email').value = '';
    document.getElementById('password').value = '';
    document.getElementById('msg').textContent = '';
  }

  // Sayfa yenilendiğinde oturum hâlâ açıksa otomatik panel göster
  (async function checkSession() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      await girisSonrasiYukle();
    }
  })();
</script>

</body>
</html>
