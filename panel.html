<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İşletme Paneli - 04agri.com</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />

<style>
  :root{
    --bg:#f6f4ef; --bg2:#efece4; --ink:#17150f; --ink-soft:#6a655a; --line:#e3ded3;
    --card:#fff; --accent:#44BD32; --red:#E84142; --yellow:#FBC531; --r:16px;
  }
  *{box-sizing:border-box;}
  body{font-family:"Plus Jakarta Sans",sans-serif;background:var(--bg);color:var(--ink);margin:0;min-height:100vh;}
  .center-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{background:#fff;padding:40px 30px;border-radius:24px;box-shadow:0 20px 40px rgba(20,18,12,.12);width:100%;max-width:400px;text-align:center;}
  h2{margin-top:0;font-weight:800;}
  input,select,textarea{width:100%;padding:13px 14px;margin:8px 0;border:1px solid var(--line);border-radius:12px;font-family:inherit;font-size:15px;outline:none;box-sizing:border-box;}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  button{cursor:pointer;font-family:inherit;border:none;}
  .btn-main{background:var(--ink);color:#fff;padding:14px;width:100%;border-radius:100px;font-weight:800;font-size:15px;margin-top:8px;}
  .btn-main:hover{opacity:.9;}
  .btn-outline{background:var(--bg2);color:var(--ink);padding:10px 18px;border-radius:100px;font-weight:700;font-size:13px;}
  .err{color:var(--red);font-size:13px;font-weight:600;margin-top:10px;min-height:16px;}
  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:44px;}
  .pw-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;font-size:16px;color:var(--ink-soft);cursor:pointer;padding:4px;}

  /* DASHBOARD */
  .app{display:none;min-height:100vh;}
  .app.show{display:flex;}
  .sidebar{width:230px;background:#fff;border-right:1px solid var(--line);padding:24px 16px;flex-shrink:0;display:flex;flex-direction:column;gap:4px;}
  .brand{font-weight:800;font-size:20px;margin-bottom:20px;padding:0 8px;}
  .brand span{color:var(--accent);}
  .nav-btn{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;font-weight:700;font-size:14.5px;color:var(--ink-soft);text-align:left;background:none;width:100%;}
  .nav-btn:hover{background:var(--bg2);}
  .nav-btn.active{background:var(--ink);color:#fff;}
  .nav-btn.logout{margin-top:auto;color:var(--red);}
  .main{flex:1;padding:32px;overflow-y:auto;max-height:100vh;}
  .main h1{font-size:24px;margin:0 0 20px;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
  .toolbar select{width:auto;margin:0;}

  .appt-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px;}
  .appt-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .appt-name{font-weight:800;font-size:16px;}
  .appt-meta{font-size:13.5px;color:var(--ink-soft);margin-top:6px;line-height:1.6;}
  .badge{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:100px;white-space:nowrap;}
  .b-bekliyor{background:var(--yellow);color:var(--ink);}
  .b-onaylandi{background:var(--accent);color:#fff;}
  .b-reddedildi{background:var(--red);color:#fff;}
  .b-iptal{background:var(--bg2);color:var(--ink-soft);}
  .appt-actions{display:flex;gap:8px;margin-top:14px;}
  .btn-ok{background:var(--accent);color:#fff;padding:9px 16px;border-radius:100px;font-weight:800;font-size:13px;}
  .btn-no{background:var(--red);color:#fff;padding:9px 16px;border-radius:100px;font-weight:800;font-size:13px;}

  .day-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .day-row .dname{width:90px;font-weight:800;}
  .day-row input[type=time]{width:120px;margin:0;}
  .switch{width:44px;height:24px;border-radius:100px;background:var(--bg2);position:relative;cursor:pointer;flex-shrink:0;}
  .switch.on{background:var(--accent);}
  .switch::after{content:"";width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:.2s;}
  .switch.on::after{left:23px;}
  .slot-chip{display:inline-block;padding:6px 12px;border-radius:100px;font-size:12.5px;font-weight:700;margin:3px;cursor:pointer;border:1px solid var(--line);}
  .slot-chip.open{background:#fff;color:var(--ink);}
  .slot-chip.blocked{background:var(--red);color:#fff;border-color:var(--red);}

  .blog-post{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px;}
  .blog-post h3{margin:0 0 6px;font-size:17px;}
  .blog-post .bmeta{font-size:12.5px;color:var(--ink-soft);margin-bottom:8px;}
  .blog-post p{font-size:14px;color:var(--ink-soft);white-space:pre-wrap;}
  .del-btn{background:none;color:var(--red);font-weight:700;font-size:13px;margin-top:8px;}

  .form-block{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;max-width:560px;}
  .form-block label{display:block;font-size:13px;font-weight:800;color:var(--ink-soft);margin:14px 0 4px;}
  .form-block label:first-child{margin-top:0;}
  .save-msg{font-size:13px;font-weight:700;color:var(--accent);margin-top:10px;min-height:16px;}
  .empty{color:var(--ink-soft);font-size:14.5px;padding:30px 0;text-align:center;}
</style>
</head>
<body>

<!-- GİRİŞ EKRANI -->
<div class="center-wrap" id="login-screen">
  <div class="card">
    <h2>İşletme Girişi</h2>
    <p style="font-size:14px;color:var(--ink-soft);margin-bottom:10px;">04agri.com paneline hoş geldiniz.</p>
    <input type="email" id="login-email" placeholder="E-posta adresiniz" />
    <div class="pw-wrap">
      <input type="password" id="login-pass" placeholder="Şifreniz" />
      <button type="button" class="pw-eye" onclick="togglePw('login-pass',this)">👁</button>
    </div>
    <button class="btn-main" onclick="girisYap()">Giriş Yap</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<!-- PANEL -->
<div class="app" id="app">
  <div class="sidebar">
    <div class="brand">04<span>agri</span></div>
    <button class="nav-btn active" data-tab="randevular" onclick="showTab('randevular')">📅 Randevularım</button>
    <button class="nav-btn" data-tab="saatler" onclick="showTab('saatler')">🕐 Çalışma Saatlerim</button>
    <button class="nav-btn" data-tab="blog" onclick="showTab('blog')">✍️ Blog</button>
    <button class="nav-btn" data-tab="profil" onclick="showTab('profil')">⚙️ Profil Ayarları</button>
    <button class="nav-btn logout" onclick="cikisYap()">Çıkış Yap</button>
  </div>

  <div class="main">
    <!-- RANDEVULAR -->
    <section id="tab-randevular">
      <h1>Randevularım</h1>
      <div class="toolbar">
        <select id="appt-filter" onchange="renderAppointments()">
          <option value="hepsi">Tümü</option>
          <option value="bekliyor">Onay Bekleyenler</option>
          <option value="onaylandi">Onaylananlar</option>
          <option value="reddedildi">Reddedilenler</option>
          <option value="iptal">İptal Edilenler</option>
        </select>
        <button class="btn-outline" onclick="exportApptPdf('hepsi')">📄 Tümünü PDF indir</button>
        <button class="btn-outline" onclick="exportApptPdf('onaylandi')">📄 Sadece Onaylananlar</button>
        <button class="btn-outline" onclick="exportApptPdf('reddedildi')">📄 Sadece Reddedilenler</button>
      </div>
      <div id="appt-list"></div>
    </section>

    <!-- ÇALIŞMA SAATLERİ -->
    <section id="tab-saatler" style="display:none;">
      <h1>Çalışma Saatlerim</h1>
      <div class="form-block">
        <label>Randevu Süresi (her randevu kaç dakika sürer)</label>
        <select id="slot-duration">
          <option value="15">15 dakika</option>
          <option value="30">30 dakika</option>
          <option value="45">45 dakika</option>
          <option value="60">60 dakika</option>
        </select>
        <div id="hours-editor" style="margin-top:16px;"></div>
        <button class="btn-main" onclick="saveHours()">Kaydet</button>
        <div class="save-msg" id="hours-msg"></div>
      </div>

      <h1 style="margin-top:34px;font-size:19px;">Saat Bazlı Doluluk Yönetimi</h1>
      <p style="color:var(--ink-soft);font-size:13.5px;max-width:560px;">Aşağıdaki saatlerden birine tıklayarak o saati her hafta o gün için "dolu/kapalı" gösterebilirsiniz. Kırmızı olanlar kapalıdır.</p>
      <div id="slots-editor"></div>
      <button class="btn-outline" style="margin-top:16px;" onclick="exportHoursPdf()">📄 Çalışma Saatlerini PDF indir</button>
    </section>

    <!-- BLOG -->
    <section id="tab-blog" style="display:none;">
      <h1>Blog</h1>
      <div class="form-block">
        <label>Yazı Başlığı</label>
        <input id="blog-title" placeholder="Başlık girin" />
        <label>Yazı İçeriği</label>
        <textarea id="blog-content" rows="6" placeholder="Yazınızı buraya yazın..."></textarea>
        <button class="btn-main" onclick="submitBlog()">Onaya Gönder</button>
        <div class="save-msg" id="blog-msg"></div>
      </div>
      <h1 style="margin-top:30px;font-size:19px;">Yazılarım</h1>
      <div id="blog-list"></div>
    </section>

    <!-- PROFİL -->
    <section id="tab-profil" style="display:none;">
      <h1>Profil Ayarları</h1>
      <div class="form-block">
        <label>İşletme / Uzman Adı</label>
        <input id="p-name" />
        <label>Telefon</label>
        <input id="p-phone" />
        <label>WhatsApp</label>
        <input id="p-whatsapp" />
        <label>E-posta (görünecek)</label>
        <input id="p-email" />
        <label>Instagram (kullanıcı adı, @ olmadan)</label>
        <input id="p-instagram" />
        <label>Adres</label>
        <input id="p-address" />
        <label>Bölge / İlçe</label>
        <input id="p-area" />
        <label>Hakkında / Bio</label>
        <textarea id="p-bio" rows="4"></textarea>
        <button class="btn-main" onclick="saveProfile()">Profili Kaydet</button>
        <div class="save-msg" id="profile-msg"></div>
      </div>

      <h1 style="margin-top:30px;font-size:19px;">Şifre Değiştir</h1>
      <div class="form-block">
        <label>Yeni Şifre</label>
        <div class="pw-wrap">
          <input type="password" id="p-newpass" placeholder="Yeni şifreniz" />
          <button type="button" class="pw-eye" onclick="togglePw('p-newpass',this)">👁</button>
        </div>
        <button class="btn-main" onclick="changePassword()">Şifreyi Güncelle</button>
        <div class="save-msg" id="pass-msg"></div>
      </div>
    </section>
  </div>
</div>

<script>
const supabaseUrl = 'https://hsrifvlkiazkzlmebdgb.supabase.co';
const supabaseKey = 'sb_publishable_fJ4Z7Hp80QOGUVh9pDrMXA_ZIuTi7rn';
const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

const DAY_NAMES = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];

let business = null;      // businesses tablosundaki kendi satırımız
let appointments = [];
let workingHours = [];    // 7 satır (weekday 0..6)
let blockedSlots = [];
let blogPosts = [];

function togglePw(id, btn){
  const el = document.getElementById(id);
  el.type = el.type === "password" ? "text" : "password";
  btn.textContent = el.type === "password" ? "👁" : "🙈";
}

window.onload = async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) await bootAfterLogin();
};

async function girisYap(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-pass').value;
  const err = document.getElementById('login-err');
  err.textContent = "";
  if(!email || !password){ err.textContent = "E-posta ve şifre giriniz."; return; }

  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ err.textContent = "E-posta veya şifre yanlış."; return; }
  await bootAfterLogin();
}

async function cikisYap(){
  await sb.auth.signOut();
  document.getElementById('app').classList.remove('show');
  document.getElementById('login-screen').style.display = 'flex';
}

async function bootAfterLogin(){
  const { data: { user } } = await sb.auth.getUser();
  if(!user) return;

  const { data: biz, error } = await sb.from('businesses').select('*').eq('auth_user_id', user.id).single();
  if(error || !biz){
    document.getElementById('login-err').textContent = "Bu hesaba bağlı bir işletme profili bulunamadı. Lütfen yönetici ile iletişime geçin.";
    await sb.auth.signOut();
    return;
  }
  business = biz;

  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').classList.add('show');

  await Promise.all([loadAppointments(), loadWorkingHours(), loadBlockedSlots(), loadBlog()]);
  fillProfileForm();
  renderAppointments();
  renderHoursEditor();
  renderBlog();
}

function showTab(tab){
  document.querySelectorAll('.nav-btn[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  ['randevular','saatler','blog','profil'].forEach(t => {
    document.getElementById('tab-'+t).style.display = (t===tab) ? 'block' : 'none';
  });
}

/* ================= RANDEVULAR ================= */
async function loadAppointments(){
  const { data, error } = await sb.from('appointments')
    .select('*')
    .eq('business_id', business.id)
    .order('appointment_date', { ascending: true })
    .order('appointment_time', { ascending: true });
  appointments = error ? [] : data;
}

function renderAppointments(){
  const filter = document.getElementById('appt-filter').value;
  const list = document.getElementById('appt-list');
  const filtered = filter === 'hepsi' ? appointments : appointments.filter(a => a.status === filter);

  if(filtered.length === 0){ list.innerHTML = '<div class="empty">Bu filtreye uygun randevu bulunmuyor.</div>'; return; }

  const statusLabel = { bekliyor:"Onay Bekliyor", onaylandi:"Onaylandı", reddedildi:"Reddedildi", iptal:"İptal Edildi" };

  list.innerHTML = filtered.map(a => `
    <div class="appt-card">
      <div class="appt-top">
        <div>
          <div class="appt-name">👤 ${escapeHtml(a.customer_name)}</div>
          <div class="appt-meta">
            📅 ${a.appointment_date} — ⏰ ${a.appointment_time.slice(0,5)}<br/>
            📞 ${escapeHtml(a.customer_phone)}${a.customer_email ? ' · ✉️ '+escapeHtml(a.customer_email) : ''}<br/>
            ${a.note ? '📝 '+escapeHtml(a.note)+'<br/>' : ''}
            Kod: ${a.confirmation_code}
          </div>
        </div>
        <span class="badge b-${a.status}">${statusLabel[a.status]}</span>
      </div>
      ${a.status === 'bekliyor' ? `
        <div class="appt-actions">
          <button class="btn-ok" onclick="decideAppt('${a.id}','onaylandi')">Onayla</button>
          <button class="btn-no" onclick="decideAppt('${a.id}','reddedildi')">Reddet</button>
        </div>` : ''}
    </div>
  `).join('');
}

async function decideAppt(id, status){
  const { error } = await sb.from('appointments').update({ status, decided_at: new Date().toISOString() }).eq('id', id);
  if(!error){ await loadAppointments(); renderAppointments(); }
  else alert("İşlem başarısız: " + error.message);
}

function exportApptPdf(which){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const data = which === 'hepsi' ? appointments : appointments.filter(a => a.status === which);
  const title = which === 'hepsi' ? 'Tüm Randevular' : which === 'onaylandi' ? 'Onaylanan Randevular' : 'Reddedilen Randevular';

  doc.setFontSize(16); doc.text(`${business.name} — ${title}`, 14, 16);
  doc.setFontSize(10); doc.text(new Date().toLocaleDateString('tr-TR'), 14, 22);

  doc.autoTable({
    startY: 28,
    head: [['Ad Soyad','Telefon','E-posta','Tarih','Saat','Durum']],
    body: data.map(a => [a.customer_name, a.customer_phone, a.customer_email||'-', a.appointment_date, a.appointment_time.slice(0,5), a.status]),
    styles: { fontSize: 9 }
  });
  doc.save(`randevular-${which}.pdf`);
}

/* ================= ÇALIŞMA SAATLERİ ================= */
async function loadWorkingHours(){
  const { data } = await sb.from('working_hours').select('*').eq('business_id', business.id);
  workingHours = [];
  for(let d=0; d<7; d++){
    const found = (data||[]).find(r => r.weekday === d);
    workingHours.push(found || { weekday:d, is_open:false, start_time:'09:00', end_time:'18:00' });
  }
}

async function loadBlockedSlots(){
  const { data } = await sb.from('blocked_slots').select('*').eq('business_id', business.id);
  blockedSlots = data || [];
}

function renderHoursEditor(){
  document.getElementById('slot-duration').value = business.slot_duration_minutes || 30;
  const wrap = document.getElementById('hours-editor');
  wrap.innerHTML = workingHours.map(d => `
    <div class="day-row">
      <div class="switch ${d.is_open?'on':''}" onclick="toggleDay(${d.weekday}, this)"></div>
      <div class="dname">${DAY_NAMES[d.weekday]}</div>
      <input type="time" value="${d.start_time?.slice(0,5)||'09:00'}" onchange="updateDayField(${d.weekday},'start_time',this.value)" />
      <span>—</span>
      <input type="time" value="${d.end_time?.slice(0,5)||'18:00'}" onchange="updateDayField(${d.weekday},'end_time',this.value)" />
    </div>
  `).join('');
  renderSlotsEditor();
}

function toggleDay(weekday, el){
  const d = workingHours.find(x => x.weekday === weekday);
  d.is_open = !d.is_open;
  el.classList.toggle('on', d.is_open);
  renderSlotsEditor();
}
function updateDayField(weekday, field, val){
  const d = workingHours.find(x => x.weekday === weekday);
  d[field] = val;
  renderSlotsEditor();
}

function generateSlotsForDay(d, durationMin){
  if(!d.is_open || !d.start_time || !d.end_time) return [];
  const [sh,sm] = d.start_time.split(':').map(Number);
  const [eh,em] = d.end_time.split(':').map(Number);
  let cur = sh*60+sm, end = eh*60+em;
  const out = [];
  while(cur + durationMin <= end){
    const h = String(Math.floor(cur/60)).padStart(2,'0');
    const m = String(cur%60).padStart(2,'0');
    out.push(`${h}:${m}`);
    cur += durationMin;
  }
  return out;
}

function renderSlotsEditor(){
  const duration = parseInt(document.getElementById('slot-duration').value || business.slot_duration_minutes || 30);
  const wrap = document.getElementById('slots-editor');
  let html = '';
  workingHours.forEach(d => {
    const slots = generateSlotsForDay(d, duration);
    if(slots.length === 0) return;
    html += `<div style="margin-top:14px;"><strong>${DAY_NAMES[d.weekday]}</strong><div>`;
    slots.forEach(s => {
      const isBlocked = blockedSlots.some(b => b.weekday === d.weekday && b.slot_time.slice(0,5) === s);
      html += `<span class="slot-chip ${isBlocked?'blocked':'open'}" onclick="toggleSlotBlock(${d.weekday},'${s}')">${s}</span>`;
    });
    html += `</div></div>`;
  });
  wrap.innerHTML = html || '<p class="empty">Önce açık günler ve saatler seçin.</p>';
}

document.getElementById('slot-duration').addEventListener('change', renderSlotsEditor);

async function toggleSlotBlock(weekday, time){
  const existing = blockedSlots.find(b => b.weekday === weekday && b.slot_time.slice(0,5) === time);
  if(existing){
    await sb.from('blocked_slots').delete().eq('id', existing.id);
  } else {
    await sb.from('blocked_slots').insert({ business_id: business.id, weekday, slot_time: time });
  }
  await loadBlockedSlots();
  renderSlotsEditor();
}

async function saveHours(){
  const duration = parseInt(document.getElementById('slot-duration').value);
  await sb.from('businesses').update({ slot_duration_minutes: duration }).eq('id', business.id);
  business.slot_duration_minutes = duration;

  for(const d of workingHours){
    await sb.from('working_hours').upsert({
      business_id: business.id,
      weekday: d.weekday,
      is_open: d.is_open,
      start_time: d.start_time,
      end_time: d.end_time
    }, { onConflict: 'business_id,weekday' });
  }
  document.getElementById('hours-msg').textContent = "Kaydedildi ✓";
  setTimeout(()=>document.getElementById('hours-msg').textContent='', 2000);
}

function exportHoursPdf(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(16); doc.text(`${business.name} — Çalışma Saatleri`, 14, 16);
  doc.autoTable({
    startY: 24,
    head: [['Gün','Durum','Başlangıç','Bitiş']],
    body: workingHours.map(d => [DAY_NAMES[d.weekday], d.is_open?'Açık':'Kapalı', d.start_time?.slice(0,5)||'-', d.end_time?.slice(0,5)||'-'])
  });
  doc.save('calisma-saatleri.pdf');
}

/* ================= BLOG ================= */
async function loadBlog(){
  const { data } = await sb.from('blog_posts').select('*').eq('business_id', business.id).order('created_at', { ascending:false });
  blogPosts = data || [];
}

function renderBlog(){
  const wrap = document.getElementById('blog-list');
  if(blogPosts.length === 0){ wrap.innerHTML = '<div class="empty">Henüz yazınız yok.</div>'; return; }
  const labels = { bekliyor:['Yönetici Onayı Bekliyor','b-bekliyor'], onaylandi:['Yönetici Onayladı','b-onaylandi'], reddedildi:['Yönetici Reddetti','b-reddedildi'] };
  wrap.innerHTML = blogPosts.map(p => `
    <div class="blog-post">
      <div class="bmeta"><span class="badge ${labels[p.status][1]}">${labels[p.status][0]}</span> · ${new Date(p.created_at).toLocaleDateString('tr-TR')}</div>
      <h3>${escapeHtml(p.title)}</h3>
      <p>${escapeHtml(p.content)}</p>
      ${p.admin_note ? `<p style="color:var(--red);font-weight:700;">Not: ${escapeHtml(p.admin_note)}</p>` : ''}
      <button class="del-btn" onclick="deleteBlog('${p.id}')">Sil</button>
    </div>
  `).join('');
}

async function submitBlog(){
  const title = document.getElementById('blog-title').value.trim();
  const content = document.getElementById('blog-content').value.trim();
  const msg = document.getElementById('blog-msg');
  if(!title || !content){ msg.style.color='var(--red)'; msg.textContent = "Başlık ve içerik zorunludur."; return; }

  const { error } = await sb.from('blog_posts').insert({ business_id: business.id, title, content, status: 'bekliyor' });
  if(error){ msg.style.color='var(--red)'; msg.textContent = "Hata: " + error.message; return; }
  document.getElementById('blog-title').value = '';
  document.getElementById('blog-content').value = '';
  msg.style.color='var(--accent)'; msg.textContent = "Yazınız yönetici onayına gönderildi ✓";
  await loadBlog(); renderBlog();
}

async function deleteBlog(id){
  if(!confirm("Bu yazıyı silmek istediğinize emin misiniz?")) return;
  await sb.from('blog_posts').delete().eq('id', id);
  await loadBlog(); renderBlog();
}

/* ================= PROFİL ================= */
function fillProfileForm(){
  document.getElementById('p-name').value = business.name || '';
  document.getElementById('p-phone').value = business.phone || '';
  document.getElementById('p-whatsapp').value = business.whatsapp || '';
  document.getElementById('p-email').value = business.email || '';
  document.getElementById('p-instagram').value = business.instagram || '';
  document.getElementById('p-address').value = business.address || '';
  document.getElementById('p-area').value = business.area || '';
  document.getElementById('p-bio').value = business.bio || '';
}

async function saveProfile(){
  const updates = {
    name: document.getElementById('p-name').value.trim(),
    phone: document.getElementById('p-phone').value.trim(),
    whatsapp: document.getElementById('p-whatsapp').value.trim(),
    email: document.getElementById('p-email').value.trim(),
    instagram: document.getElementById('p-instagram').value.trim(),
    address: document.getElementById('p-address').value.trim(),
    area: document.getElementById('p-area').value.trim(),
    bio: document.getElementById('p-bio').value.trim(),
    updated_at: new Date().toISOString()
  };
  const { error } = await sb.from('businesses').update(updates).eq('id', business.id);
  const msg = document.getElementById('profile-msg');
  if(error){ msg.style.color='var(--red)'; msg.textContent = "Hata: " + error.message; return; }
  Object.assign(business, updates);
  msg.style.color='var(--accent)'; msg.textContent = "Kaydedildi ✓";
  setTimeout(()=>msg.textContent='', 2000);
}

async function changePassword(){
  const pass = document.getElementById('p-newpass').value;
  const msg = document.getElementById('pass-msg');
  if(!pass || pass.length < 6){ msg.style.color='var(--red)'; msg.textContent = "Şifre en az 6 karakter olmalı."; return; }
  const { error } = await sb.auth.updateUser({ password: pass });
  if(error){ msg.style.color='var(--red)'; msg.textContent = "Hata: " + error.message; return; }
  document.getElementById('p-newpass').value = '';
  msg.style.color='var(--accent)'; msg.textContent = "Şifre güncellendi ✓";
}

function escapeHtml(str){
  if(str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
