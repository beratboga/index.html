<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>04agri.com — Yönetim Paneli</title>
<style>
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: #f6f4ef;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .box {
    background: #fff;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 380px;
  }
  h1 { font-size: 22px; margin: 0 0 24px; }
  input {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 12px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
    box-sizing: border-box;
  }
  button {
    width: 100%;
    padding: 13px;
    background: #17150f;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .msg { margin-top: 14px; font-size: 14px; color: #444; text-align: center; }
  .err { color: #E84142; }
</style>
</head>
<body>

<div class="box">
  <h1>04agri.com Yönetim Paneli</h1>
  <input type="email" id="email" placeholder="E-posta" />
  <input type="password" id="password" placeholder="Şifre" />
  <button onclick="girisYap()">Giriş Yap</button>
  <div class="msg" id="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const supabaseClient = supabase.createClient(
    'https://ckxqfasgddhgbpnxaaja.supabase.co',
    'sb_publishable_gEX1rPpXyfxdY0WPhK0KNw_vZSQAj7Z'
  );

  async function girisYap() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const msg = document.getElementById('msg');
    msg.textContent = 'Giriş yapılıyor...';
    msg.className = 'msg';

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      msg.textContent = 'Hata: ' + error.message;
      msg.className = 'msg err';
      return;
    }

    // Giriş başarılı, şimdi rolünü öğrenelim
    const { data: profile, error: profileError } = await supabaseClient
      .from('profiles')
      .select('role')
      .eq('id', data.user.id)
      .single();

    if (profileError) {
      msg.textContent = 'Giriş yapıldı ama rol bulunamadı: ' + profileError.message;
      msg.className = 'msg err';
      return;
    }

    msg.textContent = 'Giriş başarılı! Rolün: ' + profile.role;
    msg.className = 'msg';
  }
</script>

</body>
</html>
