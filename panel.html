<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İşletme Paneli - 04agri.com</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet" />
  
  <style>
    body { font-family: "Plus Jakarta Sans", sans-serif; background: #f6f4ef; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: #17150f; }
    .card { background: white; padding: 40px 30px; border-radius: 24px; box-shadow: 0 20px 40px rgba(20,18,12,.12); text-align: center; width: 100%; max-width: 400px; }
    h2 { margin-top: 0; font-weight: 800; color: #0c1020; }
    input { width: 90%; padding: 14px; margin: 10px 0; border: 1px solid #e3ded3; border-radius: 12px; font-family: inherit; font-size: 15px; outline: none; box-sizing: border-box; }
    input:focus { border-color: #44BD32; }
    button { background: #17150f; color: #fff; border: none; padding: 16px; width: 100%; border-radius: 100px; cursor: pointer; font-weight: 800; font-size: 15px; transition: transform 0.2s; margin-top: 10px; }
    button:hover { transform: translateY(-2px); }
    button.logout { background: #f6f4ef; color: #E84142; margin-top: 20px; }
    
    /* Randevu Kartları İçin Tasarım */
    .randevu-karti { border: 1px solid #e3ded3; padding: 16px; border-radius: 16px; margin-bottom: 12px; text-align: left; background: #faf9f6; }
    .r-isim { font-weight: 800; font-size: 16px; color: #0c1020; margin-bottom: 4px; }
    .r-tarih { font-size: 14px; color: #6a655a; font-weight: 600; margin-bottom: 8px; }
    .r-durum { font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 100px; display: inline-block; }
    .durum-bekliyor { background: #FBC531; color: #17150f; }
    .durum-onaylandi { background: #44BD32; color: #fff; }
  </style>
</head>
<body>

  <!-- GİRİŞ EKRANI -->
  <div class="card" id="login-section">
    <h2>İşletme Girişi</h2>
    <p style="font-size: 14px; color: #6a655a; margin-bottom: 20px;">04agri.com paneline hoş geldiniz.</p>
    <input type="email" id="email" placeholder="E-posta adresiniz" />
    <input type="password" id="password" placeholder="Şifreniz" />
    <button onclick="girisYap()">Giriş Yap</button>
    <p id="mesaj" style="color: #E84142; font-size: 13px; font-weight: 600; margin-top: 15px;"></p>
  </div>

  <!-- BAŞARILI GİRİŞ EKRANI (DASHBOARD) -->
  <div class="card" id="dashboard-section" style="display: none; max-width: 500px;">
    <h2>Randevularım</h2>
    
    <!-- Randevuların listeleneceği alan -->
    <div id="randevu-listesi" style="margin-top: 20px; max-height: 400px; overflow-y: auto;">
      <p style="color: #6a655a; font-size: 14px;">Randevular yükleniyor...</p>
    </div>

    <button class="logout" onclick="cikisYap()">Sistemden Çıkış Yap</button>
  </div>

  <script>
    // 1. SUPABASE BAĞLANTISI
    const supabaseUrl = 'https://hsrifvlkiazkzlmebdgb.supabase.co';
    const supabaseKey = 'sb_publishable_fJ4Z7Hp80QOGUVh9pDrMXA_ZIuTi7rn';
    const client = window.supabase.createClient(supabaseUrl, supabaseKey);

    // Sayfa açıldığında zaten giriş yapılmış mı kontrol et
    window.onload = async function() {
      const { data: { session } } = await client.auth.getSession();
      if (session) {
        ekraniGoster('dashboard-section');
        randevulariGetir();
      }
    };

    // 2. GİRİŞ YAPMA FONKSİYONU
    async function girisYap() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const mesaj = document.getElementById('mesaj');

      mesaj.innerText = "Bağlanıyor...";

      const { data, error } = await client.auth.signInWithPassword({ email, password });

      if (error) {
        mesaj.innerText = "Hata: E-posta veya şifre yanlış!";
      } else {
        mesaj.innerText = "";
        ekraniGoster('dashboard-section');
        randevulariGetir(); // Giriş yapınca randevuları çek!
      }
    }

    // 3. RANDEVULARI VERİTABANINDAN ÇEKME FONKSİYONU
    async function randevulariGetir() {
      const liste = document.getElementById('randevu-listesi');
      
      // Supabase'den randevular tablosunu iste (RLS sadece sana ait olanları verecek)
      const { data, error } = await client
        .from('randevular')
        .select('*')
        .order('tarih', { ascending: true }); // Tarihe göre sırala

      if (error) {
        liste.innerHTML = '<p style="color:red;">Randevular çekilirken bir hata oluştu.</p>';
        return;
      }

      // Eğer hiç randevu yoksa
      if (data.length === 0) {
        liste.innerHTML = '<p style="color: #6a655a; font-size: 15px;">Şu an bekleyen randevunuz bulunmamaktadır.</p>';
        return;
      }

      // Randevular varsa, ekrana HTML olarak çiz
      liste.innerHTML = '';
      data.forEach(randevu => {
        let durumClass = randevu.durum === 'bekliyor' ? 'durum-bekliyor' : 'durum-onaylandi';
        let durumYazi = randevu.durum === 'bekliyor' ? 'Onay Bekliyor' : 'Onaylandı';

        liste.innerHTML += `
          <div class="randevu-karti">
            <div class="r-isim">👤 ${randevu.musteri_adi}</div>
            <div class="r-tarih">📅 ${randevu.tarih} - ⏰ Saat: ${randevu.saat}</div>
            <div class="r-tarih">📞 ${randevu.musteri_telefon || 'Belirtilmedi'}</div>
            <div class="r-durum ${durumClass}">${durumYazi}</div>
          </div>
        `;
      });
    }

    // 4. ÇIKIŞ YAPMA FONKSİYONU
    async function cikisYap() {
      await client.auth.signOut();
      ekraniGoster('login-section');
    }

    // Ekran değiştirme yardımcısı
    function ekraniGoster(ekranId) {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('dashboard-section').style.display = 'none';
      document.getElementById(ekranId).style.display = 'block';
    }
  </script>
</body>
</html>
