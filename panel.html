<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İşletme Paneli - 04agri.com</title>
  
  <!-- Supabase Kütüphanesi -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Senin sitenin fontlarını kullandık -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet" />
  
  <style>
    body { font-family: "Plus Jakarta Sans", sans-serif; background: #f6f4ef; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #17150f; }
    .card { background: white; padding: 40px 30px; border-radius: 24px; box-shadow: 0 20px 40px rgba(20,18,12,.12); text-align: center; width: 100%; max-width: 320px; }
    h2 { margin-top: 0; font-weight: 800; color: #0c1020; }
    input { width: 90%; padding: 14px; margin: 10px 0; border: 1px solid #e3ded3; border-radius: 12px; font-family: inherit; font-size: 15px; outline: none; }
    input:focus { border-color: #44BD32; }
    button { background: #44BD32; color: #17150f; border: none; padding: 16px; width: 100%; border-radius: 100px; cursor: pointer; font-weight: 800; font-size: 15px; transition: transform 0.2s; margin-top: 10px; }
    button:hover { transform: translateY(-2px); filter: brightness(0.95); }
    button.logout { background: #E84142; color: white; margin-top: 20px; }
  </style>
</head>
<body>

  <!-- GİRİŞ EKRANI -->
  <div class="card" id="login-section">
    <h2>İşletme Girişi</h2>
    <p style="font-size: 14px; color: #6a655a; margin-bottom: 20px;">04agri.com paneline hoş geldiniz.</p>
    <input type="email" id="email" placeholder="E-posta adresiniz" />
    <input type="password" id="password" placeholder="Şifreniz" />
    <button onclick="girisYap()">Giriş Yap</button>
    <p id="mesaj" style="color: #E84142; font-size: 13px; font-weight: 600; margin-top: 15px;"></p>
  </div>

  <!-- BAŞARILI GİRİŞ YAPINCA AÇILACAK EKRAN -->
  <div class="card" id="dashboard-section" style="display: none;">
    <h2>Giriş Başarılı! 🎉</h2>
    <p style="font-size: 15px; color: #6a655a;" id="kullanici-bilgisi">Randevu ve saat yönetim ekranı buraya gelecek.</p>
    <button class="logout" onclick="cikisYap()">Çıkış Yap</button>
  </div>

  <!-- GÜNCELLENMİŞ VE HATASI DÜZELTİLMİŞ JAVASCRIPT KISMI -->
  <script>
    // 1. SUPABASE BAĞLANTISI (Hatayı çözmek için adı 'client' olarak değiştirildi)
    const supabaseUrl = 'https://hsrifvlkiazkzlmebdgb.supabase.co';
    const supabaseKey = 'sb_publishable_fJ4Z7Hp80QOGUVh9pDrMXA_ZIuTi7rn';
    
    // Supabase bağlantısını 'client' adıyla kuruyoruz
    const client = window.supabase.createClient(supabaseUrl, supabaseKey);

    // 2. GİRİŞ YAPMA FONKSİYONU
    async function girisYap() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const mesaj = document.getElementById('mesaj');

      mesaj.innerText = "Bağlanıyor...";

      // İstek gönderiliyor...
      const { data, error } = await client.auth.signInWithPassword({
        email: email,
        password: password,
      });

      if (error) {
        // Eğer yanlış bilgi girilirse veya sistem kapalıysa
        mesaj.innerText = "Hata: E-posta veya şifre yanlış!";
      } else {
        // Her şey doğruysa
        mesaj.innerText = "";
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('dashboard-section').style.display = 'block';
      }
    }

    // 3. ÇIKIŞ YAPMA FONKSİYONU
    async function cikisYap() {
      await client.auth.signOut();
      document.getElementById('email').value = "";
      document.getElementById('password').value = "";
      document.getElementById('login-section').style.display = 'block';
      document.getElementById('dashboard-section').style.display = 'none';
    }
  </script>
</body>
</html>
