<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<base href="/" />

<title>04agri.com — Ağrı'nın Dijital Rehberi</title>
<meta name="description" content="Ağrı'nın dijital rehberi: randevu alma, restoranlar, cafeler, sağlık, eğitim, nöbetçi eczaneler ve şehir haberleri." />

<link rel="icon" type="image/jpeg" href="https://04agri.com/agridagi.jpg" />
<link rel="apple-touch-icon" href="https://04agri.com/agridagi.jpg" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<!-- PDF ve Excel Kütüphaneleri ($0 Ücretsiz) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

<style>
/* ============================================================
   04agri.com — Ağrı Dijital Rehberi (Apple Minimalist CSS)
   ============================================================ */
:root{
  --bg:        #fbfbfd;
  --bg-2:      #f5f5f7;
  --ink:       #1d1d1f;
  --ink-soft:  #6e6e73;
  --ink-faint: #86868b;
  --line:      #e5e5ea;
  --card:      #ffffff;

  --dark:      #0c1020;
  --dark-2:    #131a31;
  --dawn-1:    #1a2444;      
  --dawn-2:    #5b6aa0;
  --dawn-3:    #e6a071;      
  --dawn-4:    #f3c9a0;

  --accent:    #34c759;      
  --pin:       #ff3b30;
  --blue:      #0071e3;

  --maxw:      1240px;
  --r-lg:      28px;
  --r-md:      20px;
  --r-sm:      12px;
  --shadow-1:  0 4px 20px rgba(0,0,0,0.04);
  --shadow-2:  0 12px 32px rgba(0,0,0,0.08);
  --shadow-3:  0 24px 60px rgba(0,0,0,0.14);

  --display: "Bricolage Grotesque", -apple-system, system-ui, sans-serif;
  --body:    "Plus Jakarta Sans", -apple-system, system-ui, sans-serif;
  --ease: cubic-bezier(.22,.61,.36,1);
}

*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
html, body{
  margin:0; padding:0; width:100%; max-width:100%;
  background:var(--bg); color:var(--ink);
  font-family:var(--body); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
h1,h2,h3,h4{ font-family:var(--display); font-weight:700; line-height:1.05; letter-spacing:-.02em; margin:0; }
button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; outline:none; }
input, select, textarea{ font-family:inherit; font-size:15px; }
a{ color:inherit; text-decoration:none; cursor:pointer; }
.wrap{ max-width:var(--maxw); margin:0 auto; padding:0 24px; width:100%; }

/* TOPBAR */
.topbar{ position:fixed; inset:0 0 auto 0; z-index:60; display:grid; grid-template-columns:auto 1fr auto; align-items:center; padding:16px 28px; transition:background .3s var(--ease), backdrop-filter .3s; pointer-events:none; width:100%; }
.topbar > *{ pointer-events:auto; }
.topbar.scrolled{ background:rgba(255,255,255,0.8); backdrop-filter:saturate(180%) blur(20px); box-shadow:0 1px 0 var(--line); }
.logo{ display:flex; align-items:center; gap:8px; font-family:var(--display); font-weight:800; font-size:22px; }
.logo .badge{ width:36px; height:36px; border-radius:10px; display:grid; place-items:center; background:var(--accent); color:#000; font-size:17px; font-weight:800; }
.logo .txt{ display:flex; align-items:baseline; color:var(--ink); }
.topbar.on-dark .logo .txt{ color:#fff; }
.topbar-nav{ justify-self:center; display:flex; gap:24px; font-size:14.5px; font-weight:600; align-items:center; }
.topbar-nav a{ color:var(--ink); transition:color .2s; }
.topbar.on-dark .topbar-nav a{ color:rgba(255,255,255,0.9); }
.topbar-nav a:hover{ color:var(--accent); }

.nav-book-btn{ background:var(--accent); color:#000 !important; font-weight:800 !important; padding:8px 18px; border-radius:100px; transition:transform .2s, opacity .2s; display:inline-flex; align-items:center; gap:6px; box-shadow:0 4px 12px rgba(52,199,89,0.25); }
.nav-book-btn:hover{ transform:scale(1.03); opacity:0.95; }

/* HERO */
.hero{ position:relative; height:92svh; min-height:640px; width:100%; overflow:hidden; background:linear-gradient(180deg, var(--dark) 0%, var(--dark-2) 100%); display:flex; align-items:center; justify-content:center; }
.hero .sky{ position:absolute; inset:0; background:radial-gradient(120% 80% at 50% 120%, var(--dawn-3) 0%, transparent 55%), linear-gradient(180deg, var(--dawn-1) 0%, var(--dawn-2) 58%, var(--dawn-4) 100%); }
.hero-content{ position:relative; z-index:10; display:flex; flex-direction:column; align-items:center; text-align:center; padding:0 20px; }
.hero-title{ color:#fff; font-size:clamp(36px, 6vw, 72px); margin:16px 0; }
.hero-title em{ font-style:normal; color:var(--accent); }
.hero-sub{ color:rgba(255,255,255,0.85); font-size:clamp(15px, 1.6vw, 18px); max-width:48ch; margin-bottom:28px; }

.search{ display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.95); backdrop-filter:blur(20px); border-radius:100px; padding:8px 8px 8px 22px; width:min(640px, 92vw); box-shadow:var(--shadow-3); }
.search input{ flex:1; border:none; outline:none; background:none; font-size:16px; color:var(--ink); }
.search .go{ background:var(--ink); color:#fff; font-weight:700; font-size:14px; padding:12px 24px; border-radius:100px; transition:opacity .2s; }
.search .go:hover{ opacity:0.85; }

/* GÜNDEM & BLOG BÖLÜMÜ */
#gundem{ padding:50px 0; background:var(--bg); }
.gundem-layout{ display:grid; grid-template-columns: 1fr 340px; gap:36px; align-items:start; }
.news-header{ font-family:var(--display); font-size:24px; font-weight:800; margin-bottom:20px; display:flex; align-items:center; gap:10px; }
.news-header::before{ content:""; display:block; width:10px; height:10px; border-radius:50%; background:var(--pin); }
.news-list{ display:flex; flex-direction:column; gap:16px; }
.news-item{ background:var(--card); border-radius:var(--r-md); padding:20px; box-shadow:var(--shadow-1); border:1px solid var(--line); transition:all .2s var(--ease); cursor:pointer; }
.news-item:hover{ transform:translateY(-2px); box-shadow:var(--shadow-2); }
.news-author{ font-size:12px; font-weight:800; color:var(--accent); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:4px; display:flex; justify-content:space-between; }
.news-author span.date{ color:var(--ink-faint); font-weight:500; }
.news-item h4{ font-size:18px; color:var(--ink); margin-bottom:6px; }
.news-item p{ font-size:14.5px; color:var(--ink-soft); line-height:1.5; margin:0; }
.news-readmore{ color:var(--blue); font-size:13px; font-weight:700; margin-top:8px; display:inline-block; }

/* WIDGETLAR */
.widget-panel{ display:flex; flex-direction:column; gap:16px; }
.widget-card{ background:var(--card); border-radius:var(--r-md); padding:20px; box-shadow:var(--shadow-1); border:1px solid var(--line); }
.widget-card.weather{ background:linear-gradient(135deg, #0071e3 0%, #4facfe 100%); color:#fff; border:none; }
.widget-card.prayer{ background:var(--dark-2); color:#fff; border:none; }

/* KARTLAR & OVERLAY */
.grid{ max-width:var(--maxw); margin:0 auto; padding:30px 24px 80px; display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:24px; }
.card{ position:relative; height:360px; border-radius:var(--r-lg); overflow:hidden; cursor:pointer; box-shadow:var(--shadow-1); border:1px solid var(--line); display:flex; flex-direction:column; justify-content:space-between; padding:22px; color:#fff; background-size:cover; transition:transform .3s var(--ease), box-shadow .3s; }
.card:hover{ transform:translateY(-4px); box-shadow:var(--shadow-2); }
.card .scrim{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.85) 100%); z-index:1; }
.card .body{ position:relative; z-index:2; }

/* APPLE MODAL DÜZENİ (Randevu & Detaylar) */
.modal-overlay{ position:fixed; inset:0; z-index:999; background:rgba(0,0,0,0.5); backdrop-filter:blur(16px); display:grid; place-items:center; padding:16px; animation:fadeIn .2s ease; }
.modal-box{ background:#fff; color:var(--ink); border-radius:var(--r-lg); max-width:560px; width:100%; max-height:90vh; overflow-y:auto; box-shadow:var(--shadow-3); border:1px solid var(--line); padding:32px; position:relative; animation:slideUp .3s var(--ease); }
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
@keyframes slideUp{ from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:none;} }
.modal-close{ position:absolute; top:20px; right:20px; width:36px; height:36px; border-radius:50%; background:var(--bg-2); display:grid; place-items:center; font-weight:800; cursor:pointer; }
.form-group{ margin-bottom:16px; }
.form-group label{ display:block; font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
.form-control{ width:100%; padding:12px 16px; border-radius:var(--r-sm); border:1px solid var(--line); background:var(--bg-2); color:var(--ink); outline:none; transition:border .2s; }
.form-control:focus{ border-color:var(--blue); background:#fff; }
.btn-primary{ background:var(--ink); color:#fff; font-weight:800; padding:14px 24px; border-radius:100px; width:100%; font-size:15px; transition:transform .2s, opacity .2s; }
.btn-primary:hover{ opacity:0.9; transform:scale(1.01); }

/* MOBİL UYUM */
@media(max-width:768px){
  .topbar-nav{ display:none; }
  .gundem-layout{ grid-template-columns:1fr; }
  .modal-box{ padding:24px 20px; }
}
</style>
</head>
<body>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect } = React;

// 23 İŞLETME LİSTESİ
const BUSINESSES = [
  { id: 'sevval-tasdemir', name: 'Şevval Taşdemir (Dil Terapisti)', cat: 'Sağlık', catKey: 'saglik' },
  { id: 'dilek-polat', name: 'Dilek Polat (Psikolog)', cat: 'Sağlık', catKey: 'saglik' },
  { id: 'bilge-igan', name: 'Uzm. Dyt. Bilge İgan Yıldırım', cat: 'Diyetisyen', catKey: 'diyet' },
  { id: 'berika-kurucay', name: 'Dyt. Berika Kuruçay', cat: 'Diyetisyen', catKey: 'diyet' },
  { id: 'seda-nur-dursun', name: 'Dyt. Seda Nur Dursun', cat: 'Diyetisyen', catKey: 'diyet' },
  { id: 'seher-issi', name: 'Dyt. Seher Issi', cat: 'Diyetisyen', catKey: 'diyet' },
  { id: 'hamiyet-sahin', name: 'Dyt. Hamiyet Şahin', cat: 'Diyetisyen', catKey: 'diyet' },
  { id: 'melike-cukadar', name: 'Melike Çukadar (Ergoterapist)', cat: 'Sağlık', catKey: 'saglik' },
  { id: 'dr-nilay', name: 'Dr. Nilay Dinçgözoğlu', cat: 'Medikal Estetik / Doktor', catKey: 'doktor' },
  { id: 'club-maxfit', name: 'Club Maxfit Spor Salonu', cat: 'Spor & Fitness', catKey: 'spor' },
  { id: 'elit-dil', name: 'E.L.I.T Dil Kursu', cat: 'Eğitim', catKey: 'egitim' },
  { id: 'bright-english', name: 'Bright English (İrem Kaya)', cat: 'Eğitim', catKey: 'egitim' },
  { id: 'nevra-basci', name: 'Nevra Başcı (Matematik)', cat: 'Matematik', catKey: 'matematik' },
  { id: 'emir-hoca', name: 'Emir Hoca (Matematik)', cat: 'Matematik', catKey: 'matematik' },
  { id: 'canan-hoca', name: 'Canan Hoca (Matematik)', cat: 'Matematik', catKey: 'matematik' },
  { id: 'muhammed-hoca', name: 'Muhammed Hoca (Müzik)', cat: 'Müzik', catKey: 'muzik' },
  { id: 'merve-hoca', name: 'Merve Hoca (Piyano & Flüt)', cat: 'Müzik', catKey: 'muzik' },
  { id: 'bahar-igan', name: 'Bahar İgan Bağan (Yaşam Koçu)', cat: 'Danışmanlık', catKey: 'danismanlik' },
  { id: 'ozge-nur-celik', name: 'Özge Nur Çelik (Çocuk Gelişimi)', cat: 'Danışmanlık', catKey: 'danismanlik' },
  { id: 'berivan-hoca', name: 'Berivan Hoca (Çocuk Gelişimi)', cat: 'Danışmanlık', catKey: 'danismanlik' },
  { id: 'omer-hoca', name: 'Ömer Hoca (Hareket Eğitimi)', cat: 'Danışmanlık', catKey: 'danismanlik' },
  { id: 'seastarsoft', name: 'SeaStarSoft', cat: 'Yazılım', catKey: 'yazilim' },
  { id: 'bluversea', name: 'Bluversea', cat: 'Yazılım', catKey: 'yazilim' }
];

function App() {
  const [blogs, setBlogs] = useState([]);
  const [selectedBlog, setSelectedBlog] = useState(null);
  const [isBookModalOpen, setIsBookModalOpen] = useState(false);
  const [bookTab, setBookTab] = useState('book'); // 'book' veya 'cancel'
  
  // Randevu Formu
  const [selectedBiz, setSelectedBiz] = useState(BUSINESSES[0].id);
  const [name, setName] = useState('');
  const [phone, setPhone] = useState('');
  const [email, setEmail] = useState('');
  const [date, setDate] = useState('');
  const [time, setTime] = useState('10:00');
  const [note, setNote] = useState('');
  const [bookSuccessData, setBookSuccessData] = useState(null);

  // İptal Formu
  const [cancelCode, setCancelCode] = useState('');
  const [cancelPhone, setCancelPhone] = useState('');

  // Blogları API'den Çek
  useEffect(() => {
    fetch('/api/public-blogs')
      .then(res => res.json())
      .then(data => setBlogs(data || []))
      .catch(() => {});
  }, []);

  // Randevu Gönderme
  const handleBooking = async (e) => {
    e.preventDefault();
    if (!name || !phone || !email || !date || !time) return alert("Lütfen tüm zorunlu alanları doldurun!");

    const res = await fetch('/api/book-appointment', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        business_id: selectedBiz,
        customer_name: name,
        customer_phone: phone,
        customer_email: email,
        appointment_date: date,
        appointment_time: time,
        customer_note: note
      })
    });
    const data = await res.json();
    if (data.success) {
      const bizObj = BUSINESSES.find(b => b.id === selectedBiz);
      setBookSuccessData({
        code: data.code,
        bizName: bizObj.name,
        catKey: bizObj.catKey,
        name, phone, email, date, time
      });
    } else {
      alert(data.error || "Randevu alınamadı.");
    }
  };

  // Randevu İptal Etme
  const handleCancelBooking = async (e) => {
    e.preventDefault();
    if (!cancelCode || !cancelPhone) return alert("Lütfen Kod ve Telefon numaranızı girin!");

    const res = await fetch('/api/cancel-by-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: cancelCode.trim(), phone: cancelPhone.trim() })
    });
    const data = await res.json();
    alert(data.message || (data.success ? "Randevunuz iptal edildi." : "Kayıt bulunamadı."));
    if (data.success) {
      setIsBookModalOpen(false);
      setCancelCode(''); setCancelPhone('');
    }
  };

  // PDF İndir
  const downloadPDF = (info) => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(18);
    doc.text("04agri.com - Randevu Onay Belgesi", 14, 20);
    doc.setFontSize(12);
    doc.text(`Randevu Kodu (PNR): ${info.code}`, 14, 30);
    doc.text(`İşletme / Uzman: ${info.bizName}`, 14, 40);
    doc.text(`Müşteri: ${info.name}`, 14, 50);
    doc.text(`Tarih & Saat: ${info.date} - ${info.time}`, 14, 60);
    doc.text(`Telefon: ${info.phone}`, 14, 70);
    doc.text("Lütfen randevu saatinden 10 dakika önce hazır bulununuz.", 14, 85);
    doc.save(`Randevu_${info.code}.pdf`);
  };

  // Kategoriye Özel Mesaj
  const getCategoryMessage = (catKey) => {
    if (catKey === 'doktor' || catKey === 'saglik') return "Geçmiş olsun dileklerimizle, sağlıklı günler dileriz! 🩺🌿";
    if (catKey === 'diyet') return "Sağlıklı ve formda bir yaşama harika bir adım attınız! 🥗✨";
    if (catKey === 'muzik') return "Müzik dolu, keyifli ve verimli bir seans dileriz! 🎵🎻";
    if (catKey === 'matematik' || catKey === 'egitim') return "Başarılarla dolu, zihin açıcı harika bir ders dileriz! 📚💡";
    if (catKey === 'spor') return "Enerjik ve fit bir antrenman seni bekliyor! 💪🔥";
    return "Randevunuz başarıyla onaylandı! Teşekkür ederiz. ✨";
  };

  return (
    <div>
      {/* TOPBAR */}
      <div className="topbar scrolled">
        <a className="logo" href="/">
          <span className="badge">04</span>
          <span className="txt">agri.com</span>
        </a>
        <nav className="topbar-nav">
          <a href="#gundem">Gündem</a>
          <a href="#kategoriler">Kategoriler</a>
          <a href="#iletisim">İletişim</a>
          <button className="nav-book-btn" onClick={() => { setIsBookModalOpen(true); setBookSuccessData(null); }}>
            📅 Randevu Al
          </button>
        </nav>
        <div>
          <button className="nav-book-btn" style={{padding:'6px 14px', fontSize:'13px'}} onClick={() => { setIsBookModalOpen(true); setBookSuccessData(null); }}>
            Randevu 📅
          </button>
        </div>
      </div>

      {/* HERO */}
      <header className="hero" style={{marginTop:'65px'}}>
        <div className="sky"></div>
        <div className="hero-content">
          <h1 className="hero-title">Ağrı'yı <em>Keşfet</em>.</h1>
          <p className="hero-sub">Ağrı'nın en seçkin 23 işletmesinden anında online randevu al, şehir gündemini ve nöbetçi eczaneleri takip et.</p>
          <div className="search">
            <input placeholder="Hangi işletme veya uzmanı arıyorsunuz?..." />
            <button className="go" onClick={() => setIsBookModalOpen(true)}>Randevu Al</button>
          </div>
        </div>
      </header>

      {/* GÜNDEM & BLOGLAR BÖLÜMÜ */}
      <section id="gundem">
        <div className="wrap gundem-layout">
          <div className="g-left">
            <div className="news-header">Gündem & İşletme Duyuruları</div>
            <div className="news-list">
              {blogs.length === 0 ? (
                <div className="news-item">
                  <div className="news-author">04agri.com <span>Bugün</span></div>
                  <h4>Ağrı'nın Dijital Randevu & Şehir Portalı Yayında 🎉</h4>
                  <p>Ağrı genelindeki sağlık uzmanları, eğitim kurumları ve yerel işletmelerden anında ücretsiz randevu alabilirsiniz.</p>
                </div>
              ) : (
                blogs.map(b => (
                  <div key={b.id} className="news-item" onClick={() => setSelectedBlog(b)}>
                    <div className="news-author">{b.business_name} <span className="date">{b.created_at?.split('T')[0] || ''}</span></div>
                    <h4>{b.title}</h4>
                    <p>{b.content.length > 140 ? b.content.substring(0, 140) + "..." : b.content}</p>
                    {b.content.length > 140 && <span className="news-readmore">Devamını Oku ➔</span>}
                  </div>
                ))
              )}
            </div>
          </div>

          <div className="widget-panel">
            <div className="widget-card weather">
              <h3 style={{fontSize:'18px', marginBottom:'6px'}}>Ağrı Hava Durumu</h3>
              <div style={{fontSize:'36px', fontWeight:800}}>24° Güneşli</div>
            </div>
            <div className="widget-card prayer">
              <h3 style={{fontSize:'18px', marginBottom:'6px'}}>Namaz Vakitleri</h3>
              <p style={{fontSize:'14px', opacity:0.8, margin:0}}>Ağrı için güncel vakitler aktif.</p>
            </div>
          </div>
        </div>
      </section>

      {/* BLOG DETAY MODALI */}
      {selectedBlog && (
        <div className="modal-overlay" onClick={() => setSelectedBlog(null)}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>
            <div className="modal-close" onClick={() => setSelectedBlog(null)}>✕</div>
            <span style={{fontSize:'12px', fontWeight:800, color:'var(--accent)', textTransform:'uppercase'}}>{selectedBlog.business_name}</span>
            <h2 style={{margin:'10px 0 16px', fontSize:'22px'}}>{selectedBlog.title}</h2>
            <p style={{fontSize:'15px', lineHeight:1.6, color:'var(--ink-soft)', whiteSpace:'pre-wrap'}}>{selectedBlog.content}</p>
          </div>
        </div>
      )}

      {/* APPLE MİNİMALİST RANDEVU MODALI */}
      {isBookModalOpen && (
        <div className="modal-overlay" onClick={() => setIsBookModalOpen(false)}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>
            <div className="modal-close" onClick={() => setIsBookModalOpen(false)}>✕</div>

            {!bookSuccessData ? (
              <>
                <div style={{display:'flex', gap:'8px', marginBottom:'24px', background:'var(--bg-2)', padding:'4px', borderRadius:'100px'}}>
                  <button style={{flex:1, padding:'10px', borderRadius:'100px', fontWeight:800, fontSize:'13px', background:bookTab==='book'?'#fff':'none', color:bookTab==='book'?'#000':'var(--ink-soft)'}} onClick={() => setBookTab('book')}>
                    📅 Yeni Randevu Al
                  </button>
                  <button style={{flex:1, padding:'10px', borderRadius:'100px', fontWeight:800, fontSize:'13px', background:bookTab==='cancel'?'#fff':'none', color:bookTab==='cancel'?'#000':'var(--ink-soft)'}} onClick={() => setBookTab('cancel')}>
                    ❌ Randevu İptal Et
                  </button>
                </div>

                {bookTab === 'book' ? (
                  <form onSubmit={handleBooking}>
                    <div className="form-group">
                      <label>Randevu Alınacak İşletme / Uzman *</label>
                      <select className="form-control" value={selectedBiz} onChange={e => setSelectedBiz(e.target.value)}>
                        {BUSINESSES.map(b => (
                          <option key={b.id} value={b.id}>{b.name}</option>
                        ))}
                      </select>
                    </div>

                    <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'12px'}}>
                      <div className="form-group">
                        <label>Adınız Soyadınız *</label>
                        <input className="form-control" required placeholder="Ad Soyad" value={name} onChange={e => setName(e.target.value)} />
                      </div>
                      <div className="form-group">
                        <label>Telefon Numaranız *</label>
                        <input className="form-control" required placeholder="05XX XXX XX XX" value={phone} onChange={e => setPhone(e.target.value)} />
                      </div>
                    </div>

                    <div className="form-group">
                      <label>E-Posta Adresiniz *</label>
                      <input className="form-control" type="email" required placeholder="ornek@mail.com" value={email} onChange={e => setEmail(e.target.value)} />
                    </div>

                    <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'12px'}}>
                      <div className="form-group">
                        <label>Randevu Tarihi *</label>
                        <input className="form-control" type="date" required value={date} onChange={e => setDate(e.target.value)} />
                      </div>
                      <div className="form-group">
                        <label>Saat Seçimi *</label>
                        <select className="form-control" value={time} onChange={e => setTime(e.target.value)}>
                          {['09:00','09:30','10:00','10:30','11:00','11:30','13:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00'].map(t => (
                            <option key={t} value={t}>{t}</option>
                          ))}
                        </select>
                      </div>
                    </div>

                    <div className="form-group">
                      <label>Kısa Notunuz (İsteğe bağlı)</label>
                      <textarea className="form-control" rows="2" placeholder="Belirtmek istediğiniz özel bir durum varsa..." value={note} onChange={e => setNote(e.target.value)}></textarea>
                    </div>

                    <button type="submit" className="btn-primary">Randevuyu Onayla ➔</button>
                  </form>
                ) : (
                  <form onSubmit={handleCancelBooking}>
                    <p style={{fontSize:'14px', color:'var(--ink-soft)', marginBottom:'16px'}}>Daha önce aldığınız randevuyu iptal etmek için randevu kodunuzu ve kayıtlı telefonunuzu giriniz.</p>
                    <div className="form-group">
                      <label>Randevu Kodu (PNR) *</label>
                      <input className="form-control" required placeholder="ör: AGR-4921" value={cancelCode} onChange={e => setCancelCode(e.target.value)} />
                    </div>
                    <div className="form-group">
                      <label>Telefon Numaranız *</label>
                      <input className="form-control" required placeholder="05XX XXX XX XX" value={cancelPhone} onChange={e => setCancelPhone(e.target.value)} />
                    </div>
                    <button type="submit" className="btn-primary" style={{background:'var(--pin)'}}>Randevuyu İptal Et</button>
                  </form>
                )}
              </>
            ) : (
              <div style={{textAlign:'center'}}>
                <div style={{fontSize:'48px', marginBottom:'10px'}}>🎉</div>
                <h2 style={{fontSize:'22px', marginBottom:'8px'}}>Randevunuz Oluşturuldu!</h2>
                <div style={{background:'var(--bg-2)', padding:'14px', borderRadius:'14px', margin:'16px 0', border:'1px dashed var(--line)'}}>
                  <div style={{fontSize:'12px', color:'var(--ink-faint)', fontWeight:700}}>RANDEVU TAKİP KODUNUZ</div>
                  <div style={{fontSize:'28px', fontWeight:800, color:'var(--blue)', letterSpacing:'2px'}}>{bookSuccessData.code}</div>
                </div>
                <p style={{fontSize:'15px', color:'var(--ink-soft)', lineHeight:1.5, margin:'12px 0 20px'}}>
                  {getCategoryMessage(bookSuccessData.catKey)}
                </p>

                <div style={{display:'flex', gap:'10px'}}>
                  <button className="btn-primary" onClick={() => downloadPDF(bookSuccessData)}>📄 PDF Olarak İndir</button>
                  <button className="btn-primary" style={{background:'#25D366'}} onClick={() => {
                    const txt = `04agri.com üzerinden ${bookSuccessData.bizName} için randevum alındı. Kodum: ${bookSuccessData.code} - Tarih: ${bookSuccessData.date} Saat: ${bookSuccessData.time}`;
                    window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
                  }}>💬 Paylaş</button>
                </div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
