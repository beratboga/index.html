<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>04agri.com — Ağrı'nın Dijital Rehberi</title>
<meta name="description" content="Ağrı'nın dijital rehberi: restoranlar, cafes, gezilecek yerler, nöbetçi eczane, etkinlikler ve daha fazlası." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   04agri.com — Ağrı Dijital Rehberi
   ============================================================ */

:root{
  --bg:        #f6f4ef;
  --bg-2:      #efece4;
  --ink:       #17150f;
  --ink-soft:  #6a655a;
  --ink-faint: #a39d90;
  --line:      #e3ded3;
  --card:      #ffffff;

  --dark:   #0c1020;
  --dark-2: #131a31;
  --dawn-1: #1a2444;      
  --dawn-2: #5b6aa0;
  --dawn-3: #e6a071;      
  --dawn-4: #f3c9a0;

  --globe:  220, 232, 255;
  --accent: #06f251;      
  --pin:    #FF4B4B;

  --maxw: 1280px;
  --r-lg: 28px;
  --r-md: 18px;
  --r-sm: 12px;
  --shadow-1: 0 1px 2px rgba(20,18,12,.04), 0 8px 24px rgba(20,18,12,.06);
  --shadow-2: 0 12px 40px rgba(20,18,12,.16);
  --shadow-3: 0 30px 90px rgba(8,10,24,.45);

  --display: "Bricolage Grotesque", "Plus Jakarta Sans", system-ui, sans-serif;
  --body:    "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --ease: cubic-bezier(.22,.61,.36,1);
  --ease-io: cubic-bezier(.83,0,.17,1);
}

*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
html, body{
  margin:0; padding:0;
  width: 100%;
  max-width: 100%;
  background:var(--bg); color:var(--ink);
  font-family:var(--body); font-size:17px; line-height:1.55;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
h1,h2,h3,h4{ font-family:var(--display); font-weight:700; line-height:1.02; letter-spacing:-.02em; margin:0; }
button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input, select{ font-family:inherit; }
a{ color:inherit; text-decoration:none; cursor:pointer; }
.wrap{ max-width:var(--maxw); margin:0 auto; padding:0 28px; width:100%; }
::selection{ background:var(--accent); color:var(--ink); }

/* ---------- NAZİK POLİTİKA ONAY MODALI (BOTTOM SHEET) ---------- */
.tos-overlay { position:fixed; inset:0; z-index:9999; background:rgba(12,16,32,0.45); backdrop-filter:blur(8px); display:flex; flex-direction:column; justify-content:flex-end; align-items:center; width:100%; height:100%; }
.tos-modal { background:#fff; color:var(--ink); padding:36px 36px 42px; border-radius:32px 32px 0 0; max-width:800px; width:100%; box-shadow:0 -10px 40px rgba(0,0,0,0.2); animation:slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; display:flex; flex-direction:column; gap:16px; }
@keyframes slideUp { from { transform:translateY(100%); opacity:0; } to { transform:translateY(0); opacity:1; } }

.tos-modal h2 { font-size:24px; font-weight:800; color:var(--dark); display:flex; align-items:center; gap:10px; margin:0; }
.tos-modal p { font-size:15px; color:var(--ink-soft); line-height:1.6; margin:0; text-align:justify; }
.tos-disclaimer { font-size:13px !important; color:var(--ink-faint) !important; background:var(--bg-2); padding:12px 14px; border-radius:12px; border-left:3px solid var(--accent); }
.tos-actions { display:flex; gap:12px; margin-top:12px; }
.tos-btn { flex:1; padding:16px; border-radius:100px; font-weight:800; font-size:15px; text-align:center; transition:all 0.2s; cursor:pointer; }
.tos-btn.accept { background:var(--accent); color:var(--ink); border:none; }
.tos-btn.accept:hover { filter:brightness(0.95); transform:translateY(-2px); }
.tos-btn.decline { background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
.tos-btn.decline:hover { background:var(--bg-2); color:var(--ink); }

/* GİZLİLİK / KULLANIM ŞARTLARI DOKÜMAN MODALI */
.doc-modal-overlay { position:fixed; inset:0; z-index:10000; background:rgba(12,16,32,0.7); backdrop-filter:blur(10px); display:grid; place-items:center; padding:20px; }
.doc-modal-card { background:var(--card); color:var(--ink); border-radius:24px; max-width:640px; width:100%; max-height:85vh; display:flex; flex-direction:column; box-shadow:var(--shadow-3); overflow:hidden; animation:fadeIn .35s ease; }
.doc-modal-head { display:flex; align-items:center; justify-content:space-between; padding:24px 28px; border-bottom:1px solid var(--line); }
.doc-modal-head h2 { font-size:22px; font-weight:800; color:var(--dark); }
.doc-modal-close { width:38px; height:38px; border-radius:50%; background:var(--bg-2); font-weight:800; cursor:pointer; flex-shrink:0; }
.doc-modal-body { padding:24px 28px 30px; overflow-y:auto; }
.doc-modal-body p { font-size:15px; line-height:1.7; color:var(--ink-soft); text-align:justify; margin:0; }

/* Kabul Etmeyenler İçin Çıkan Kibar Blok Ekranı */
.tos-blocked-overlay { position:fixed; inset:0; z-index:9999; background:rgba(12,16,32,0.65); backdrop-filter:blur(12px); display:grid; place-items:center; padding:20px; }
.tos-blocked-card { background:var(--card); color:var(--ink); padding:40px; border-radius:24px; max-width:480px; text-align:center; box-shadow:var(--shadow-3); animation: fadeIn 0.4s ease; }
.tos-blocked-card h3 { font-size:22px; margin-bottom:16px; color:var(--dark); }
.tos-blocked-card p { color:var(--ink-soft); font-size:15px; line-height:1.6; margin-bottom:24px; }
@keyframes fadeIn { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }

/* ---------- top bar ---------- */
.topbar{ position:fixed; inset:0 0 auto 0; z-index:60; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:18px 28px; transition:background .4s var(--ease), backdrop-filter .4s; pointer-events:none; width:100%; }
.topbar > *{ pointer-events:auto; }
.topbar.scrolled{ background:color-mix(in srgb, var(--bg), transparent 12%); backdrop-filter:saturate(140%) blur(14px); box-shadow:0 1px 0 var(--line); }
.logo{ justify-self:start; display:flex; align-items:center; gap:8px; font-family:var(--display); font-weight:800; font-size:22px; letter-spacing:-.03em; }
.logo .badge{ width:38px; height:38px; border-radius:11px; display:grid; place-items:center; background:var(--accent); color:var(--ink); font-size:18px; font-weight:800; box-shadow:0 6px 16px color-mix(in srgb,var(--accent),transparent 55%); }
.logo .txt{ display:flex; align-items:baseline; color:var(--ink); transition: color .4s var(--ease); }
.logo .dim{ color:var(--ink-faint); font-weight:600; transition: color .4s var(--ease); }
.topbar.on-dark .logo .txt{ color:#fff; }
.topbar.on-dark .logo .dim{ color:rgba(255,255,255,.55); }

.topbar-nav{ justify-self:center; display:flex; gap:28px; font-size:15px; font-weight:700; }
.topbar-nav a{ position:relative; color:var(--ink); transition:color .2s; }
.topbar.on-dark .topbar-nav a{ color:#fff; }
.topbar-nav a:hover{ color:var(--accent); }

.topbar .loc{ justify-self:end; display:flex; align-items:center; gap:7px; font-size:14px; font-weight:600; color:var(--ink-soft); }
.topbar.on-dark .loc{ color:rgba(255,255,255,.7); }
.loc .dot{ width:8px;height:8px;border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb,var(--accent),transparent 70%); }

/* HERO & MOUNTAIN */
.hero{ position:relative; height:100svh; min-height:680px; width:100%; overflow:hidden; background:linear-gradient(180deg, var(--dark) 0%, var(--dark-2) 100%); }
.hero .sky{ position:absolute; inset:0; transition:opacity 1.4s var(--ease); }
.hero .sky.dawn{ opacity:0; background: radial-gradient(120% 80% at 50% 120%, var(--dawn-3) 0%, transparent 55%), linear-gradient(180deg, var(--dawn-1) 0%, var(--dawn-2) 58%, var(--dawn-4) 100%); }
.hero.is-mountain .sky.dawn{ opacity:1; }
.hero .sun{ position:absolute; left:50%; top:62%; width:340px; height:340px; margin:-170px 0 0 -170px; border-radius:50%; opacity:0; background:radial-gradient(circle, rgba(255,228,190,.9) 0%, rgba(255,200,140,.35) 40%, transparent 70%); transition:opacity 1.6s var(--ease) .2s; filter:blur(2px); }
.hero.is-mountain .sun{ opacity:.9; }

.globe-stage{ position:absolute; inset:0; display:grid; place-items:center; transform-origin:50% 54%; transition:transform 1.5s var(--ease-io), opacity 1.1s var(--ease) .25s; }
.hero.is-zoom .globe-stage{ transform:scale(8); opacity:0; }
.globe-canvas{ display:block; }

.geo-label{ position:absolute; left:50%; top:54%; transform:translate(-50%,46px) scale(.9); z-index:6; text-align:center; opacity:0; transition:opacity .6s var(--ease), transform .6s var(--ease); pointer-events:none; }
.hero.is-locate .geo-label{ opacity:1; transform:translate(-50%,46px) scale(1); }
.hero.is-zoom .geo-label, .hero.is-mountain .geo-label{ opacity:0; }
.geo-label .pt{ font-family:var(--display); font-weight:700; font-size:15px; color:#fff; letter-spacing:.18em; text-transform:uppercase; }
.geo-label .sub{ font-size:12.5px; color:rgba(255,255,255,.6); margin-top:3px; letter-spacing:.05em; }

.mountain{ position:absolute; inset:0; z-index: 5; opacity:0; transform:translateY(40px); pointer-events:none; transition:opacity 1.3s var(--ease) .35s, transform 1.5s var(--ease) .35s; }
.hero.is-mountain .mountain{ opacity:1; transform:translateY(0); }
.mountain img { width: 100%; height: 100%; object-fit: cover; object-position: bottom center; display: block; }

.hero-content{ position:absolute; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:14vh; text-align:center; pointer-events:none; width:100%; }
.hero-content > *{ pointer-events:auto; }
.hero-eyebrow{ display:inline-flex; align-items:center; gap:9px; font-size:13px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.72); white-space:nowrap; padding:8px 16px; border:1px solid rgba(255,255,255,.18); border-radius:100px; background:rgba(255,255,255,.04); backdrop-filter:blur(6px); opacity:0; transform:translateY(12px); transition:all .7s var(--ease) .1s; }
.hero-title{ color:#fff; font-size:clamp(38px, 6.4vw, 78px); margin:20px 0 0; line-height:1.0; opacity:0; transform:translateY(18px); transition:all .8s var(--ease) .2s; white-space:nowrap; }
.hero-title em{ font-style:normal; color:var(--accent); -webkit-text-stroke:0; background:linear-gradient(120deg,var(--accent),#2dd86f); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.hero-sub{ color:rgba(255,255,255,.82); font-size:clamp(15px,1.6vw,19px); margin:20px auto 0; max-width:44ch; padding:0 20px; opacity:0; transform:translateY(16px); transition:all .8s var(--ease) .3s; text-wrap:pretty; }
.hero.is-mountain .hero-eyebrow, .hero.is-mountain .hero-title, .hero.is-mountain .hero-sub{ opacity:1; transform:none; }

.search-wrapper{ position:relative; margin-top:34px; width:min(680px, 90%); opacity:0; transform:translateY(20px) scale(.98); transition:all .8s var(--ease) .42s; }
.hero.is-mountain .search-wrapper{ opacity:1; transform:none; }
.search{ display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.96); border-radius:100px; padding:9px 9px 9px 22px; box-shadow:var(--shadow-3); border:1px solid rgba(255,255,255,.6); position:relative; z-index:2; width:100%; }
.search .ico{ color:var(--ink-faint); display:flex; flex-shrink:0; }
.search input{ flex:1; border:none; outline:none; background:none; font-size:17px; color:var(--ink); padding:12px 4px; min-width:0; }
.search input::placeholder{ color:var(--ink-faint); }
.search .go{ flex-shrink:0; background:var(--ink); color:#fff; font-weight:700; font-size:15px; padding:13px 26px; border-radius:100px; transition:transform .2s var(--ease), background .2s; }
.search .go:hover{ transform:translateY(-1px); background:#000; }

.search-dropdown{ position:absolute; top:calc(100% + 12px); left:0; right:0; background:#fff; border-radius:var(--r-md); box-shadow:var(--shadow-3); overflow:hidden; z-index:1; display:flex; flex-direction:column; text-align:left; }
.sugg-item{ display:flex; align-items:center; gap:12px; padding:14px 22px; border-bottom:1px solid var(--line); cursor:pointer; transition:background .2s; }
.sugg-item:last-child{ border-bottom:none; }
.sugg-item:hover{ background:var(--bg-2); }
.sugg-item .s-icon{ display:grid; place-items:center; width:34px; height:34px; border-radius:8px; color:#fff; flex-shrink:0; }
.sugg-item .s-text{ flex:1; display:flex; flex-direction:column; }
.sugg-item .s-name{ font-weight:700; color:var(--ink); font-size:15px; }
.sugg-item .s-cat{ font-size:12px; color:var(--ink-soft); font-weight:600; }

.search-tags{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:16px; opacity:0; transition:opacity .8s var(--ease) .6s; padding:0 16px; }
.hero.is-mountain .search-tags{ opacity:1; }
.search-tags button{ font-size:13px; font-weight:600; color:#fff; padding:7px 14px; border-radius:100px; border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.06); backdrop-filter:blur(6px); transition:all .2s var(--ease); cursor:pointer; }
.search-tags button:hover{ background:var(--accent); color:var(--ink); border-color:transparent; transform:translateY(-1px); }
.search-tags button.highlight-btn { background: var(--accent); color: var(--ink); border-color: transparent; box-shadow: 0 4px 14px rgba(6, 242, 81, 0.2); }
.search-tags button.highlight-btn:hover { filter: brightness(0.9); }

.scroll-hint{ position:absolute; left:50%; bottom:26px; transform:translateX(-50%); z-index:11; display:flex; flex-direction:column; align-items:center; gap:7px; color:rgba(255,255,255,.7); font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; opacity:0; transition:opacity .8s var(--ease) .8s; }
.hero.is-mountain .scroll-hint{ opacity:1; }
.scroll-hint .mouse{ width:22px; height:34px; border:2px solid rgba(255,255,255,.45); border-radius:12px; position:relative; }
.scroll-hint .mouse::after{ content:""; position:absolute; left:50%; top:6px; width:3px; height:7px; margin-left:-1.5px; border-radius:2px; background:#fff; animation:wheel 1.6s var(--ease) infinite; }
@keyframes wheel{ 0%{opacity:0;transform:translateY(0)} 30%{opacity:1} 70%{opacity:1} 100%{opacity:0;transform:translateY(10px)} }

/* BANNER MARQUEE */
.banner-section{ padding:40px 0; background:var(--bg); overflow:hidden; width:100%; max-width:100%; }
.marquee{ display:flex; width:max-content; animation:scroll 40s linear infinite; will-change:transform; }
.marquee:hover{ animation-play-state:paused; }
@keyframes scroll{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
.banner-img{ width:300px; height:180px; border-radius:var(--r-md); object-fit:cover; box-shadow:var(--shadow-1); border:2px solid #fff; margin-right:20px; flex-shrink:0; }
.banner-placeholder{ display:flex; align-items:center; justify-content:center; text-align:center; padding:16px; background:linear-gradient(135deg, var(--dawn-1) 0%, var(--dawn-3) 100%); }
.banner-placeholder span{ color:#fff; font-family:var(--display); font-weight:700; font-size:17px; letter-spacing:-.01em; text-shadow:0 2px 8px rgba(0,0,0,.25); }

/* HİKAYELER (özgün tasarım) */
.stories-section{ padding:8px 0 24px; background:var(--bg); width:100%; }
.stories-row{ display:flex; gap:20px; flex-wrap:wrap; }
.story-bubble{ display:flex; flex-direction:column; align-items:center; gap:8px; background:none; cursor:pointer; width:84px; }
.story-ring{ width:82px; height:82px; border-radius:50%; padding:3px; display:grid; place-items:center;
  background:conic-gradient(from 140deg, var(--accent), var(--dawn-3), var(--dawn-2), var(--accent));
  box-shadow:0 6px 18px color-mix(in srgb, var(--accent), transparent 70%); transition:transform .2s var(--ease); }
.story-bubble:hover .story-ring{ transform:scale(1.05); }
.story-thumb{ width:100%; height:100%; border-radius:50%; background-color:var(--dark-2); background-size:cover; background-position:center;
  display:grid; place-items:center; color:rgba(255,255,255,.7); border:3px solid var(--bg); }
.story-label{ font-size:13px; font-weight:700; color:var(--ink-soft); text-align:center; line-height:1.1; max-width:84px; }

/* Hikaye tam ekran görüntüleyici */
.story-viewer{ position:fixed; inset:0; z-index:300; background:rgba(8,10,24,.92); backdrop-filter:blur(6px); display:grid; place-items:center; padding:20px; animation:fadeIn .3s ease; }
.story-progress{ position:absolute; top:18px; left:50%; transform:translateX(-50%); width:min(360px,80%); height:4px; border-radius:4px; background:rgba(255,255,255,.25); overflow:hidden; }
.story-progress-fill{ display:block; height:100%; width:100%; background:#fff; border-radius:4px; transform-origin:left; animation:storyBar 6s linear forwards; }
@keyframes storyBar{ from{ transform:scaleX(0);} to{ transform:scaleX(1);} }
.story-close{ position:absolute; top:30px; right:24px; width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,.15); color:#fff; font-size:16px; font-weight:800; cursor:pointer; }
.story-card{ position:relative; width:min(380px,92vw); aspect-ratio:9/16; max-height:84vh; border-radius:22px; overflow:hidden; box-shadow:var(--shadow-3); }
.story-card-img{ width:100%; height:100%; object-fit:cover; }
.story-card-bg{ position:absolute; inset:0; background:linear-gradient(160deg, var(--dawn-1) 0%, var(--dawn-2) 45%, var(--dawn-3) 100%); }
.story-card-overlay{ position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end; gap:14px; padding:30px; background:linear-gradient(180deg, transparent 45%, rgba(0,0,0,.55) 100%); }
.story-card-badge{ align-self:flex-start; background:var(--accent); color:var(--ink); font-family:var(--display); font-weight:800; font-size:14px; padding:7px 16px; border-radius:100px; }
.story-card-text{ color:#fff; font-family:var(--display); font-weight:700; font-size:24px; line-height:1.2; text-shadow:0 2px 10px rgba(0,0,0,.4); text-wrap:balance; }

/* GÜNDEM, HİKAYELER & WIDGETLAR */
#gundem{ padding:20px 0 40px; background:var(--bg); width:100%; max-width:100%; overflow-x:hidden; }
.gundem-layout{ display:grid; grid-template-columns: 1fr 360px; gap:32px; align-items:start; }

.widget-panel{ display:flex; flex-direction:column; gap:16px; width:100%; }
.widget-card{ background:var(--card); border-radius:var(--r-lg); padding:24px; box-shadow:var(--shadow-1); border:1px solid var(--line); position:relative; overflow:hidden; }
.widget-card.weather{ background:linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color:#fff; border:none; }
.w-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
.w-top .city{ font-family:var(--display); font-weight:700; font-size:20px; }
.w-top .date{ font-size:13px; font-weight:600; opacity:.8; }
.w-main{ display:flex; align-items:center; gap:16px; }
.w-main .temp{ font-size:42px; font-family:var(--display); font-weight:800; line-height:1; }
.w-main .desc{ font-size:14px; font-weight:600; opacity:.9; max-width:120px; line-height:1.2; }

.widget-card.prayer{ background:var(--dark-2); color:#fff; border:none; padding:20px; }
.p-top{ display:flex; flex-direction:column; margin-bottom:12px; }
.p-top-row { display:flex; align-items:center; justify-content:space-between; font-family:var(--display); font-size:19px; font-weight:700; margin-bottom:4px; }
.p-date{ font-size:12px; font-weight:600; color:var(--accent); font-family:var(--body); }
.p-countdown { font-size:13px; color:rgba(255,255,255,.7); display:flex; gap:6px; align-items:center; font-weight:600; }
.p-countdown span { background:rgba(6,242,81,.15); color:var(--accent); padding:2px 8px; border-radius:100px; font-family:var(--display); font-size:14px; font-variant-numeric:tabular-nums; border:1px solid rgba(6,242,81,.3); }
.p-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center; }
.p-item{ background:rgba(255,255,255,.08); border-radius:10px; padding:6px 2px; border:1px solid rgba(255,255,255,.05); }
.p-item.active{ background:var(--accent); color:var(--ink); font-weight:800; border-color:transparent; transform:scale(1.02); box-shadow:0 4px 12px rgba(6,242,81,.2); }
.p-item span{ display:block; font-size:10px; font-weight:700; opacity:.7; text-transform:uppercase; margin-bottom:1px; }
.p-item strong{ display:block; font-family:var(--display); font-size:14px; }

/* DİNAMİK SEÇMELİ ECZANE WIDGETI */
.widget-card.pharmacy-widget { background: var(--card); border: 1px solid var(--line); padding: 20px; color: var(--ink); }
.ph-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; }
.ph-title { font-family: var(--display); font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
.ph-select { background: var(--bg-2); border: 1px solid var(--line); padding: 6px 12px; border-radius: 100px; font-size: 13px; font-weight: 700; outline: none; color: var(--ink); cursor: pointer; }
.ph-box { background: var(--bg); border-radius: var(--r-sm); padding: 14px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.ph-name-row { display: flex; justify-content: space-between; align-items: baseline; }
.ph-name { font-family: var(--display); font-size: 16px; font-weight: 800; color: var(--pin); }
.ph-date-badge { font-size: 11px; background: var(--ink); color: #fff; padding: 2px 8px; border-radius: 100px; font-weight: 700; }
.ph-detail { font-size: 13.5px; color: var(--ink-soft); line-height: 1.4; font-weight: 500; }
.ph-landmark { font-size: 12px; color: var(--ink); font-weight: 700; text-transform: uppercase; border-left: 2px solid var(--pin); padding-left: 6px; margin-top: 2px; }
.ph-footer-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; padding-top: 8px; border-top: 1px dashed var(--line); }
.ph-phone { font-size: 14px; font-weight: 800; color: var(--ink); display: flex; align-items: center; gap: 4px; }
.ph-map-link { font-size: 12.5px; font-weight: 700; color: #3498DB; text-decoration: underline; }
.ph-empty { font-size: 13.5px; color: var(--ink-faint); text-align: center; padding: 10px 0; font-weight: 600; }

.news-wrap{ grid-column: 1 / -1; margin-top:16px; width:100%; }
.news-header{ font-family:var(--display); font-size:26px; font-weight:700; margin-bottom:20px; display:flex; align-items:center; gap:10px; }
.news-header::before{ content:""; display:block; width:12px; height:12px; border-radius:50%; background:var(--pin); }
.news-list{ display:flex; flex-direction:column; gap:16px; width:100%; }
.news-item{ display:flex; gap:20px; background:var(--card); border-radius:var(--r-md); padding:16px; box-shadow:var(--shadow-1); border:1px solid var(--line); transition:transform .2s var(--ease), box-shadow .2s; cursor:pointer; }
.news-item:hover{ transform:translateY(-3px); box-shadow:var(--shadow-2); }
.news-img{ width:150px; height:110px; border-radius:12px; object-fit:cover; flex-shrink:0; background:var(--bg-2); }
.news-img-placeholder{ background:linear-gradient(135deg, var(--dawn-1) 0%, var(--dawn-3) 100%); }
.news-content{ display:flex; flex-direction:column; justify-content:center; }
.news-content h4{ font-size:18px; margin-bottom:6px; color:var(--ink); }
.news-content p{ font-size:14px; color:var(--ink-soft); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.news-meta{ margin-bottom:6px; font-size:12px; font-weight:700; color:var(--accent); letter-spacing:.05em; }

/* KATEGORİLER (SABİT SEKMELİ DÜZEN - ASLA BOŞLUK BIRAKMAZ) */
#kategoriler { width:100%; max-width:100%; padding:40px 0 20px; background:var(--bg); }
.cats-intro{ padding-bottom: 24px; }
.cats-intro .kicker{ font-size:13px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); }
.cats-intro h2{ font-size:clamp(30px,4.6vw,56px); margin:14px 0 0; max-width:18ch; text-wrap:balance; }
.cats-intro p{ color:var(--ink-soft); max-width:52ch; margin:16px 0 0; font-size:17px; }

.cats-interactive-container { display:grid; grid-template-columns:360px 1fr; gap:40px; align-items:start; width:100%; margin-top:20px; }
.cat-list{ display:flex; flex-direction:column; gap:4px; }
.cat-item{ display:flex; align-items:center; gap:16px; padding:12px 16px; text-align:left; width:100%; border-radius:var(--r-sm); transition:all 0.3s var(--ease); position:relative; background:transparent; }
.cat-item .num{ font-family:var(--display); font-weight:600; font-size:14px; width:24px; color:var(--ink-faint); font-variant-numeric:tabular-nums; }
.cat-item .nm{ font-family:var(--display); font-weight:700; letter-spacing:-.02em; font-size:22px; color:var(--ink-soft); transition:all 0.3s var(--ease); line-height:1.05; }
.cat-item .swatch{ width:0; height:12px; border-radius:6px; transition:width 0.3s var(--ease); flex-shrink:0; }
.cat-item.active { background: var(--card); box-shadow: var(--shadow-1); border: 1px solid var(--line); }
.cat-item.active .nm{ color:var(--ink); font-size:25px; }
.cat-item.active .num{ color:var(--ink); }
.cat-item.active .swatch{ width:24px; }
.cat-item:hover:not(.active) { background: rgba(255,255,255,0.5); }
.cat-item:hover .nm { color: var(--ink); }

.cat-stage{ position:relative; height:420px; border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--shadow-2); background:var(--bg-2); width:100%; }
.cat-panel{ position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end; padding:42px; color:#fff; height:100%; }
.cat-panel .ghost{ position:absolute; right:-10px; top:-30px; font-family:var(--display); font-weight:800; font-size:clamp(180px,24vw,260px); line-height:.8; color:rgba(255,255,255,.14); letter-spacing:-.04em; pointer-events:none; }
.cat-panel .scrim{ position:absolute; inset:0; background:linear-gradient(180deg, transparent 30%, rgba(0,0,0,.55) 100%); }
.cat-panel .body{ position:relative; z-index:2; }
.cat-panel h3{ font-size:clamp(34px,4vw,50px); color:#fff; text-wrap:balance; margin-bottom:8px; }
.cat-panel p{ margin:8px 0 0; font-size:16px; max-width:44ch; color:rgba(255,255,255,.95); text-wrap:pretty; }
.cat-cta{ align-self:flex-start; display:inline-flex; align-items:center; gap:9px; background:#fff; color:var(--ink); font-weight:700; font-size:15px; padding:14px 24px; border-radius:100px; box-shadow:0 10px 30px rgba(0,0,0,0.15); transition:transform .2s var(--ease); margin-top:24px; }
.cat-cta:hover{ transform:translateY(-2px); }

/* MEKANLAR / KARTLAR OVERLAY */
.ov{ position:fixed; inset:0; z-index:100; background:var(--bg); display:flex; flex-direction:column; animation:ovIn .4s var(--ease) both; width:100%; overflow-x:hidden; }
@keyframes ovIn{ from{ opacity:0; transform:translateY(2%); } to{ opacity:1; transform:none; } }
.ov-head{ display:flex; align-items:center; gap:16px; padding:18px 28px; border-bottom:1px solid var(--line); flex-shrink:0; background:var(--bg); z-index:3; width:100%; box-sizing:border-box; }
.ov-back{ display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:15px; padding:10px 16px; border-radius:100px; background:var(--bg-2); transition:background .2s; }
.ov-back:hover{ background:var(--line); }
.ov-title{ display:flex; align-items:center; gap:12px; }
.ov-title .dot{ width:14px; height:14px; border-radius:5px; }
.ov-title h2{ font-size:26px; }
.ov-close{ margin-left:auto; width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:var(--bg-2); font-weight:800; cursor:pointer; }

.ov-body{ flex:1; overflow-y:auto; overflow-x:hidden; width:100%; display:flex; flex-direction:column; }
.grid{ max-width:var(--maxw); margin:0 auto; padding:32px 28px 80px; display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:26px; width:100%; }

.card{ position:relative; height:340px; border-radius:var(--r-md); overflow:hidden; cursor:pointer; box-shadow:var(--shadow-1); transition:transform .35s var(--ease), box-shadow .35s var(--ease); display:flex; flex-direction:column; justify-content:flex-end; padding:24px; color:#fff; }
.card:hover{ transform:translateY(-6px); box-shadow:var(--shadow-2); }
.card .scrim{ position:absolute; inset:0; background:linear-gradient(180deg, transparent 20%, rgba(0,0,0,0.88) 100%); z-index:1; }
.card .body{ position:relative; z-index:2; }
.card h3{ font-size:24px; color:#fff; text-wrap:balance; margin:0; font-weight:800; }
.card .card-area{ display:flex; align-items:center; gap:6px; font-size:13.5px; font-weight:700; margin:8px 0; color:var(--accent); }
.card p{ margin:6px 0 0; font-size:14px; color:rgba(255,255,255,0.92); line-height:1.45; text-wrap:pretty; }

/* GEZİLECEK YERLER DETAY MODALI (SADECE FOTO, METİN VE ADRES-KONUM) */
.place-modal-overlay { position:fixed; inset:0; z-index:250; background:rgba(12,16,32,0.85); backdrop-filter:blur(10px); display:grid; place-items:center; padding:20px; width:100%; height:100%; }
.place-modal-content { background:var(--bg); border-radius:var(--r-lg); max-width:700px; width:100%; overflow:hidden; box-shadow:var(--shadow-3); border:1px solid var(--line); display:flex; flex-direction:column; position:relative; max-height:92vh; }
.pm-close { position:absolute; top:16px; right:16px; width:38px; height:38px; border-radius:50%; background:rgba(0,0,0,0.5); color:#fff; display:grid; place-items:center; z-index:10; font-weight:800; cursor:pointer; }
.pm-img-wrap { width:100%; height:300px; position:relative; background:#111; }
.pm-img-wrap img { width:100%; height:100%; object-fit:cover; }
.pm-noimg { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:rgba(255,255,255,.55); }
.pm-noimg span { font-size:13px; font-weight:600; letter-spacing:.04em; }
.card-noimg { position:absolute; inset:0; display:grid; place-items:center; color:rgba(255,255,255,.35); z-index:0; }
.pm-img-scrim { position:absolute; inset:0; background:linear-gradient(180deg, transparent 50%, rgba(23,21,15,0.9) 100%); }
.pm-title-box { position:absolute; bottom:20px; left:24px; right:24px; color:#fff; }
.pm-title-box h2 { font-size:28px; font-weight:800; text-shadow:0 2px 8px rgba(0,0,0,0.5); }
.pm-body { padding:28px; display:flex; flex-direction:column; gap:20px; overflow-y:auto; }
.pm-info { font-size:15.5px; color:var(--ink); line-height:1.6; margin:0; }
.pm-meta-box { background:var(--card); border:1px solid var(--line); padding:16px; border-radius:var(--r-sm); display:flex; flex-direction:column; gap:10px; }
.pm-meta-item { display:flex; align-items:flex-start; gap:10px; font-size:14.5px; font-weight:600; color:var(--ink-soft); }
.pm-meta-item svg { color:var(--pin); flex-shrink:0; margin-top:2px; }
.pm-maps-btn { background:var(--ink); color:#fff; font-weight:800; padding:14px; border-radius:100px; display:flex; align-items:center; justify-content:center; gap:8px; font-size:15px; transition:background 0.2s; text-align:center; margin-top:8px; }
.pm-maps-btn:hover { background:#000; }

/* ÇOK YAKINDA SADECE TEK SATIR UYARI MODELİ */
.coming-soon-container { max-width:500px; margin:auto; text-align:center; padding:80px 24px; }
.coming-soon-container h4 { font-size:20px; color:var(--ink-soft); font-weight:700; margin:0; letter-spacing:-0.01em; }

/* ===== SAĞLIK HİZMETLERİ ALT KATEGORİ + DİYETİSYEN (YENİ) ===== */
.health-sub-page { max-width:var(--maxw); margin:0 auto; padding:32px 28px 80px; width:100%; }
.health-sub-intro { margin-bottom:28px; }
.health-sub-intro .kick { font-size:13px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:#2ECC71; }
.health-sub-intro h3 { font-size:clamp(26px,3.4vw,40px); margin:10px 0 0; color:var(--ink); }
.health-sub-intro p { color:var(--ink-soft); max-width:54ch; margin:12px 0 0; font-size:16px; }
.health-sub-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:20px; }
.health-sub-card { position:relative; background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:26px 24px; box-shadow:var(--shadow-1); cursor:pointer; overflow:hidden; transition:transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s var(--ease); display:flex; flex-direction:column; gap:14px; min-height:200px; }
.health-sub-card:hover { transform:translateY(-6px); box-shadow:var(--shadow-2); border-color:transparent; }
.health-sub-card .hs-glow { position:absolute; right:-40px; top:-40px; width:140px; height:140px; border-radius:50%; opacity:.12; filter:blur(6px); transition:opacity .3s var(--ease), transform .3s var(--ease); }
.health-sub-card:hover .hs-glow { opacity:.22; transform:scale(1.15); }
.health-sub-card .hs-icon { width:52px; height:52px; border-radius:14px; display:grid; place-items:center; color:#fff; position:relative; z-index:2; box-shadow:0 8px 20px rgba(0,0,0,.12); }
.health-sub-card .hs-name { font-family:var(--display); font-size:21px; font-weight:800; color:var(--ink); position:relative; z-index:2; line-height:1.1; }
.health-sub-card .hs-desc { font-size:13.5px; color:var(--ink-soft); line-height:1.45; position:relative; z-index:2; margin-top:auto; }
.health-sub-card .hs-go { display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:800; color:#2ECC71; position:relative; z-index:2; transition:gap .25s var(--ease); }
.health-sub-card:hover .hs-go { gap:11px; }

/* DİYETİSYEN LİSTE */
.diet-page { max-width:var(--maxw); margin:0 auto; padding:32px 28px 80px; width:100%; }
.diet-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:24px; }
.diet-card { background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--shadow-1); cursor:pointer; transition:transform .35s var(--ease), box-shadow .35s var(--ease); display:flex; flex-direction:column; animation:dietIn .5s var(--ease) both; }
@keyframes dietIn { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:none; } }
.diet-card:hover { transform:translateY(-8px); box-shadow:var(--shadow-2); }
.diet-photo-wrap { width:100%; aspect-ratio:4/5; overflow:hidden; background:linear-gradient(150deg, #2ECC71 0%, #0f7a45 100%); position:relative; }
.diet-photo-wrap img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .5s var(--ease); }
.diet-card:hover .diet-photo-wrap img { transform:scale(1.05); }
.diet-photo-noimg { position:absolute; inset:0; display:grid; place-items:center; color:rgba(255,255,255,.65); }
.diet-card-body { padding:20px 22px 24px; display:flex; flex-direction:column; gap:14px; }
.diet-card-name { font-family:var(--display); font-size:20px; font-weight:800; color:var(--ink); line-height:1.15; text-align:center; }
.diet-card-btn { align-self:stretch; display:inline-flex; align-items:center; justify-content:center; gap:8px; background:var(--ink); color:#fff; font-weight:800; font-size:14.5px; padding:13px 18px; border-radius:100px; transition:background .2s var(--ease), transform .2s var(--ease); }
.diet-card-btn:hover { background:#2ECC71; color:#08210f; transform:translateY(-2px); }

/* DİYETİSYEN DETAY MODALI */
.diet-modal-overlay { position:fixed; inset:0; z-index:260; background:rgba(8,20,12,0.82); backdrop-filter:blur(10px); display:grid; place-items:center; padding:20px; animation:fadeIn .3s ease; }
.diet-modal-card { background:var(--bg); border-radius:var(--r-lg); max-width:560px; width:100%; max-height:92vh; overflow-y:auto; box-shadow:var(--shadow-3); border:1px solid var(--line); position:relative; animation:dietModalIn .4s var(--ease) both; }
@keyframes dietModalIn { from { opacity:0; transform:translateY(30px) scale(.97); } to { opacity:1; transform:none; } }
.diet-modal-close { position:absolute; top:16px; right:16px; width:38px; height:38px; border-radius:50%; background:rgba(0,0,0,0.55); color:#fff; display:grid; place-items:center; z-index:10; font-weight:800; cursor:pointer; }
.diet-modal-hero { width:100%; aspect-ratio:1/1; max-height:380px; overflow:hidden; background:linear-gradient(150deg, #2ECC71 0%, #0f7a45 100%); position:relative; }
.diet-modal-hero img { width:100%; height:100%; object-fit:cover; object-position:center top; display:block; }
.diet-modal-hero-noimg { position:absolute; inset:0; display:grid; place-items:center; color:rgba(255,255,255,.65); }
.diet-modal-body { padding:26px 28px 30px; display:flex; flex-direction:column; gap:18px; }
.diet-modal-name { font-family:var(--display); font-size:26px; font-weight:800; color:var(--ink); text-align:center; line-height:1.15; }
.diet-modal-tagline { font-size:15px; color:var(--ink-soft); text-align:center; line-height:1.5; font-weight:600; max-width:42ch; margin:0 auto; }
.diet-contact-box { background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:18px; display:flex; flex-direction:column; gap:12px; }
.diet-contact-title { font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:#2ECC71; }
.diet-contact-row { display:flex; align-items:center; gap:12px; font-size:15px; font-weight:700; color:var(--ink); transition:color .2s; }
.diet-contact-row svg { color:#2ECC71; flex-shrink:0; }
.diet-contact-row.phone:hover { color:#2ECC71; }
.diet-contact-row .label { font-size:11px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; display:block; }
.diet-contact-row .val { display:flex; flex-direction:column; line-height:1.3; }
.diet-maps-btn { background:var(--ink); color:#fff; font-weight:800; padding:15px; border-radius:100px; display:flex; align-items:center; justify-content:center; gap:8px; font-size:15px; transition:background .2s var(--ease), transform .2s var(--ease); }
.diet-maps-btn:hover { background:#2ECC71; color:#08210f; transform:translateY(-2px); }

/* NÖBETÇİ ECZANE TAM SAYFA GÖRÜNÜMÜ */
.pharm-page { max-width:var(--maxw); margin:0 auto; padding:28px 28px 80px; width:100%; }
.pharm-page-bar { display:flex; flex-direction:column; gap:16px; margin-bottom:26px; }
.pharm-page-date { display:inline-flex; align-items:center; gap:8px; font-family:var(--display); font-weight:700; font-size:18px; color:var(--ink); }
.pharm-page-date svg { color:var(--pin); }
.pharm-page-districts { display:flex; flex-wrap:wrap; gap:8px; }
.pharm-chip { font-size:14px; font-weight:700; padding:9px 18px; border-radius:100px; background:var(--bg-2); border:1px solid var(--line); color:var(--ink-soft); transition:all .2s var(--ease); cursor:pointer; }
.pharm-chip:hover { background:var(--card); color:var(--ink); }
.pharm-chip.active { background:var(--ink); color:#fff; border-color:transparent; }
.pharm-page-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:20px; }
.pharm-card { background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:22px; box-shadow:var(--shadow-1); display:flex; flex-direction:column; gap:10px; transition:transform .2s var(--ease), box-shadow .2s; }
.pharm-card:hover { transform:translateY(-3px); box-shadow:var(--shadow-2); }
.pharm-card-top { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
.pharm-card-name { font-family:var(--display); font-size:19px; font-weight:800; color:var(--pin); line-height:1.1; }
.pharm-card-dist { font-size:11px; font-weight:800; background:var(--ink); color:#fff; padding:3px 10px; border-radius:100px; white-space:nowrap; letter-spacing:.03em; }
.pharm-card-addr { font-size:14px; color:var(--ink-soft); line-height:1.45; font-weight:500; }
.pharm-card-landmark { font-size:13px; color:var(--ink); font-weight:700; border-left:3px solid var(--pin); padding-left:8px; }
.pharm-card-foot { display:flex; justify-content:space-between; align-items:center; margin-top:4px; padding-top:12px; border-top:1px dashed var(--line); }
.pharm-card-phone { font-size:15px; font-weight:800; color:var(--ink); }
.pharm-card-map { font-size:13px; font-weight:700; color:#3498DB; text-decoration:underline; }
.pharm-empty { grid-column:1 / -1; text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:16px; font-weight:600; }

/* FOOTER & SÖZLEŞME METNİ */
.foot{ background:var(--dark); color:#fff; padding:60px 0 30px; margin-top:40px; width:100%; max-width:100%; overflow:hidden; }
.foot .top{ display:flex; flex-wrap:wrap; gap:40px; justify-content:space-between; align-items:flex-start; }
.foot h3{ font-size:clamp(28px,4vw,48px); max-width:16ch; color:#fff; text-wrap:balance; }
.foot .lead { color:rgba(255,255,255,.6); font-size:14px; margin-top:12px; max-width:52ch; text-align:justify; line-height:1.5; }
.foot .cols{ display:flex; gap:64px; flex-wrap:wrap; }
.foot .col h5{ font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.5); margin:0 0 14px; font-weight:700; }
.foot .col a, .foot .col span{ display:block; color:rgba(255,255,255,.82); font-size:15px; padding:5px 0; transition:color .2s; cursor:pointer; }
.foot .col a:hover{ color:var(--accent); }
.foot .rule{ height:1px; background:rgba(255,255,255,.1); margin:40px 0 20px; width:100%; }
.foot .bottom{ display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; font-size:13.5px; color:rgba(255,255,255,.45); width:100%; }

/* ---------- RESPONSIVE ---------- */
@media (max-width:920px){
  .topbar{ grid-template-columns: auto 1fr; }
  .topbar-nav{ display:none; }
  .gundem-layout{ grid-template-columns:1fr; }
  .cats-interactive-container { grid-template-columns:150px 1fr; gap:20px; }
  .cat-stage{ height:380px; }
  .cat-list{ gap:4px; }
  .cat-item{ padding:10px 8px; gap:8px; }
  .cat-item .num{ display:none; }

/* Güvenli kalıcı saklama: localStorage çalışmazsa cookie, o da olmazsa bellek.
   Bu sayede hangi ortamda olursa olsun onay kaydı sayfa yenilense de korunur. */
const safeStore = (function(){
  let mem = {};

  function lsOk(){
    try { const k="__t__"; window.localStorage.setItem(k,"1"); window.localStorage.removeItem(k); return true; }
    catch(e){ return false; }
  }
  const hasLS = lsOk();

  function setCookie(key, val){
    try {
      const exp = new Date(Date.now() + 365*24*60*60*1000).toUTCString();
      document.cookie = encodeURIComponent(key) + "=" + encodeURIComponent(val) + "; expires=" + exp + "; path=/; SameSite=Lax";
      return true;
    } catch(e){ return false; }
  }
  function getCookie(key){
    try {
      const name = encodeURIComponent(key) + "=";
      const parts = document.cookie.split(";");
      for (let c of parts){
        c = c.trim();
        if (c.indexOf(name) === 0) return decodeURIComponent(c.substring(name.length));
      }
      return null;
    } catch(e){ return null; }
  }

  return {
    get(key){
      if (hasLS){
        try { const v = window.localStorage.getItem(key); if (v != null) return v; } catch(e){}
      }
      const ck = getCookie(key);
      if (ck != null) return ck;
      return (key in mem) ? mem[key] : null;
    },
    set(key, val){
      let stored = false;
      if (hasLS){
        try { window.localStorage.setItem(key, val); stored = true; } catch(e){}
      }
      if (setCookie(key, val)) stored = true;
      mem[key] = val; // her durumda bellek yedeği
      return stored;
    }
  };
})();

/* ===================== globe.jsx ===================== */
const { useRef, useEffect, useState, useCallback } = React;
const AGRI_LAT = 39.72, AGRI_LON = 43.05;
const RAD = Math.PI / 180;
const norm360 = a => ((a % 360) + 360) % 360;

function project(lat, lon, yaw, pitch){
  const lr = (lon + yaw) * RAD, fr = lat * RAD, b = pitch * RAD;
  const x = Math.cos(fr) * Math.sin(lr), y = Math.sin(fr), z = Math.cos(fr) * Math.cos(lr);
  return { x, y: y * Math.cos(b) - z * Math.sin(b), z: y * Math.sin(b) + z * Math.cos(b) };
}

function GlobeCanvas({ phase }){
  const ref = useRef(null);
  const state = useRef({ yaw: -20, pitch: 8, targetYaw: null, targetPitch: 39.72, t: 0 });

  useEffect(() => {
    const canvas = ref.current; const ctx = canvas.getContext("2d");
    let raf, w, h, R, cx, cy, dpr = Math.min(devicePixelRatio || 1, 2);
    function size(){ w=canvas.getBoundingClientRect().width; h=canvas.getBoundingClientRect().height; canvas.width=w*dpr; canvas.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); R=Math.min(w,h)*0.27; cx=w/2; cy=h*0.54; }
    size(); window.addEventListener("resize", size);
    const GC = `220,232,255`;

    function drawArc(pts){
      ctx.beginPath(); let started = false;
      for (let i=0; i<pts.length; i++){
        if (pts[i].z > 0.02){ const sx = cx + R * pts[i].x, sy = cy - R * pts[i].y; if (!started){ ctx.moveTo(sx, sy); started = true; } else ctx.lineTo(sx, sy); } else started = false;
      }
      ctx.stroke();
    }

    function frame(ts){
      const s = state.current; if (!s.t) s.t = ts; const dt = Math.min(48, ts - s.t); s.t = ts;
      if (s.targetYaw == null) s.yaw -= dt * 0.024; else { s.yaw += (s.targetYaw - s.yaw) * 0.055; s.pitch += (s.targetPitch - s.pitch) * 0.06; }
      ctx.clearRect(0,0,w,h);
      const g = ctx.createRadialGradient(cx - R*0.3, cy - R*0.35, R*0.1, cx, cy, R*1.05); g.addColorStop(0, `rgba(${GC},0.10)`); g.addColorStop(0.7, `rgba(${GC},0.03)`); g.addColorStop(1, `rgba(${GC},0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fill();
      ctx.lineWidth=1.1; ctx.strokeStyle=`rgba(${GC},0.28)`; ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke();
      const yaw = s.yaw, pitch = s.pitch; ctx.lineWidth=1;
      for (let lat=-75; lat<=75; lat+=15){ ctx.strokeStyle=lat===0?`rgba(${GC},0.40)`:`rgba(${GC},0.16)`; const pts=[]; for(let lon=0; lon<=360; lon+=4) pts.push(project(lat,lon,yaw,pitch)); drawArc(pts); }
      for (let lon=0; lon<360; lon+=15){ ctx.strokeStyle=`rgba(${GC},0.16)`; const pts=[]; for(let lat=-90; lat<=90; lat+=4) pts.push(project(lat,lon,yaw,pitch)); drawArc(pts); }
      const m = project(AGRI_LAT, AGRI_LON, yaw, pitch);
      if (m.z > 0){
        const sx=cx+R*m.x, sy=cy-R*m.y, near=s.targetYaw!=null?1:0.35, pulse=(Math.sin(ts/420)+1)/2;
        ctx.strokeStyle=`rgba(6,242,81,${0.5*near})`; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(sx,sy,6+pulse*10*near,0,Math.PI*2); ctx.stroke();
        ctx.fillStyle=`rgba(6,242,81,${0.85*near+0.15})`; ctx.beginPath(); ctx.arc(sx,sy,4.5,0,Math.PI*2); ctx.fill();
      }
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    return () => { cancelAnimationFrame(raf); window.removeEventListener("resize", size); };
  }, []);

  useEffect(() => {
    const s = state.current;
    if (phase === "spin"){ s.targetYaw = null; s.targetPitch = 39.72; } else if (["locate","zoom","mountain","rest"].includes(phase)){
      if (s.targetYaw == null){ s.targetYaw = s.yaw + norm360(-AGRI_LON - s.yaw) + 360; s.targetPitch = AGRI_LAT; }
    }
  }, [phase]);

  return <canvas ref={ref} className="globe-canvas" style={{width:"100%", height:"100%"}} />;
}

function Topbar({ dark }){
  const [scrolled, setScrolled] = useState(false);

  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 40);
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  // Sayfanın en üstündeyken hero karanlık olduğu için yazılar beyaz (on-dark);
  // aşağı kaydırınca açık arka plan gelir (scrolled).
  const onDark = !scrolled;
  const cls = ["topbar", scrolled ? "scrolled" : "", onDark ? "on-dark" : ""].join(" ").trim();

  return (
    <div className={cls}>
      <a className="logo" href="#top" onClick={(e)=>{ e.preventDefault(); window.scrollTo({ top:0, behavior:"smooth" }); }}>
        <span className="badge">04</span>

function Hero({ onSearchPlace, onOpenCat }){
  const [phase, setPhase] = useState("spin");
  const timers = useRef([]);
  const [q, setQ] = useState("");
  const [suggs, setSuggs] = useState([]);

  const run = useCallback(() => {
    timers.current.forEach(clearTimeout); timers.current = []; setPhase("spin");
    [[2200, "locate"], [4000, "zoom"], [4800, "mountain"], [5600, "rest"]].forEach(([ms, p]) => timers.current.push(setTimeout(() => setPhase(p), ms)));
  }, []);

  useEffect(() => { run(); return () => timers.current.forEach(clearTimeout); }, [run]);

  const cls = ["hero", phase==="locate"?"is-locate":"", phase==="zoom"?"is-zoom":"", ["mountain","rest"].includes(phase)?"is-zoom is-mountain":""].join(" ");

  const handleSearchChange = (e) => {
    const val = e.target.value; setQ(val);
    if(val.length > 1) {
      let res = [];
      window.AGRI.categories.forEach(c => {
        if(c.id === "gezilecek") {
          c.places.forEach(p => { if(p.name.toLowerCase().includes(val.toLowerCase())) { res.push({ ...p, catId: c.id, catName: c.name, catColor: c.color }); } });
        }
      });
      setSuggs(res.slice(0, 5));
    } else setSuggs([]);
  };

  const handleSelect = (place) => { setQ(""); setSuggs([]); onSearchPlace(place); }

  return (
    <header className={cls} data-screen-label="Hero">
      <div className="sky dawn"></div><div className="sun"></div>
      <div className="globe-stage"><GlobeCanvas phase={phase} /></div>
      <div className="geo-label"><div className="pt">AĞRI</div><div className="sub">39.72° K · 43.05° D</div></div>
      <div className="mountain"><img src="agridagi.png" alt="Ağrı Dağı" /></div>

      <div className="hero-content">
        <span className="hero-eyebrow"><span style={{width:8,height:8,borderRadius:"50%",background:"var(--accent)",display:"inline-block"}}></span>Ağrı'nın dijital kapısı</span>
        <h1 className="hero-title">Ağrı'yı <em>keşfet</em>.</h1>
        <div className="search-wrapper">
          <form className="search" onSubmit={(e)=>e.preventDefault()}>
            <span className="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg></span>
            <input value={q} onChange={handleSearchChange} placeholder="Gezilecek yerleri arayın..." aria-label="Ara" onBlur={()=>setTimeout(()=>setSuggs([]), 200)} />
            <button type="button" className="go" onClick={() => document.getElementById("kategoriler").scrollIntoView({ behavior:"smooth" })}>Kategoriler</button>
          </form>
          {suggs.length > 0 && (
            <div className="search-dropdown">
              {suggs.map((s, idx) => (
                <div key={idx} className="sugg-item" onMouseDown={()=>handleSelect(s)}>
                  <div className="s-icon" style={{background: s.catColor}}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11Z"/></svg></div>
                  <div className="s-text"><span className="s-name">{s.name}</span><span className="s-cat">{s.catName}</span></div>
                </div>
              ))}
            </div>
          )}
        </div>
        <div className="search-tags">
          <button className="highlight-btn" onClick={() => document.getElementById("kategoriler").scrollIntoView({ behavior:"smooth" })}>Tüm Kategoriler</button>
          <button onClick={()=>onOpenCat("nobetci")}>Nöbetçi Eczane</button>
          <button onClick={()=>onOpenCat("gezilecek")}>Gezilecek Yerler</button>
          <button onClick={()=>onOpenCat("etkinlik")}>Etkinlikler</button>
        </div>
      </div>
    </header>
  );
}

function ImageMarquee() {
  // Temel seti birkaç kez tekrarlayıp dolgun bir şerit oluştur,
  // sonra bu şeridi birebir ikiye katla -> %50 kaydırma kusursuz/sonsuz döner.
  const base = [].concat(
    window.AGRI_STATIC_BANNERS,
    window.AGRI_STATIC_BANNERS,
    window.AGRI_STATIC_BANNERS,
    window.AGRI_STATIC_BANNERS
  );
  const loop = base.concat(base);
  return (
    <div className="banner-section">
      <div className="marquee">
        {loop.map((b, i) => {
          const hasImg = b && b.img && b.img.trim() !== "";
          if (hasImg) {
            return <img key={i} src={b.img} className="banner-img" alt="Görsel" />;
          }
          return (
            <div key={i} className="banner-img banner-placeholder">
              <span>{(b && b.text) ? b.text : "Çok yakında hizmetinizdeyiz"}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ===================== DİNAMİK NÖBETÇİ ECZANE WIDGETI ===================== */
function PharmacyWidget() {
  const [district, setDistrict] = useState("MERKEZ");
  const [currentDateText, setCurrentDateText] = useState("02.06.2026");

  useEffect(() => {
    const updatePharmacyDate = () => {
      const now = new Date();
      const d = now.getDate().toString().padStart(2, '0');
      const m = (now.getMonth() + 1).toString().padStart(2, '0');
      const y = now.getFullYear();
      const calculatedDate = `${d}.${m}.${y}`;
      
      const exists = window.AGRI.dutyPharmacies.some(p => p.date === calculatedDate);
      if (exists) {
        setCurrentDateText(calculatedDate);
      }
    };

    updatePharmacyDate();
    const interval = setInterval(updatePharmacyDate, 60000); 
    return () => clearInterval(interval);
  }, []);

  const activePharmacies = window.AGRI.dutyPharmacies.filter(
    p => p.date === currentDateText && p.district.toUpperCase() === district.toUpperCase()
  );

  const districtsList = ["MERKEZ", "DİYADİN", "DOĞUBAYAZIT", "ELEŞKİRT", "HAMUR", "PATNOS", "TAŞLIÇAY", "TUTAK"];

  return (
    <div className="widget-card pharmacy-widget">
      <div className="ph-header">
        <div className="ph-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF4B4B" strokeWidth="2.5"><path d="M12 2v20M2 12h20"/></svg>
          Nöbetçi Eczaneler
        </div>
        <select className="ph-select" value={district} onChange={(e) => setDistrict(e.target.value)}>
          {districtsList.map((d, i) => <option key={i} value={d}>{d}</option>)}
        </select>
      </div>

      <div className="ph-list-container">
        {activePharmacies.length > 0 ? (
          activePharmacies.map((ph, idx) => (
            <div className="ph-box" key={idx} style={{marginBottom: idx < activePharmacies.length - 1 ? '10px' : '0'}}>
              <div className="ph-name-row">
                <span className="ph-name">{ph.name}</span>
                <span className="ph-date-badge">{ph.date}</span>
              </div>
              <div className="ph-detail">{ph.address}</div>
              <div className="ph-landmark">📍 {ph.landmark}</div>
              <div className="ph-footer-actions">
                <span className="ph-phone">📞 {ph.phone}</span>
                <a className="ph-map-link" href={ph.url} target="_blank" rel="noopener noreferrer">Haritada Göster</a>
              </div>
            </div>
          ))
        ) : (
          <div className="ph-empty">Bu tarihte bu ilçe için nöbetçi listesi bulunamadı.</div>
        )}
      </div>
    </div>
  );
}

/* ===================== MASTER APP & NAZİK ONAY SİSTEMİ ===================== */
const { useEffect: useEffectA, useState: useStateA } = React;

function App(){
  const [openCat, setOpenCat] = useStateA(null);
  const [docView, setDocView] = useStateA(null); // 'privacy' | 'terms' | null
  
  const [tosStatus, setTosStatus] = useStateA(() => {
    return safeStore.get('agri_onay') || 'ask'; 
  });

  const handleAcceptTos = () => {
    safeStore.set('agri_onay', 'true');
    setTosStatus('true');
  };

  const handleDeclineTos = () => {
    setTosStatus('blocked');
  };

  // Site arka planda kaydırılmasın diye overflow kilidi
  useEffectA(() => {
    if (tosStatus !== 'true') {
      document.body.style.overflow = 'hidden';
    } else {
      document.body.style.overflow = 'auto';
    }
  }, [tosStatus]);

  // GİZLİLİK POLİTİKASI METNİ
  const privacyText = "Değerli Ziyaretçimiz, bu web sayfası Ağrı'ya hizmet eden; hiçbir verinizi işlemeyen, saklamayan veya üçüncü taraflarla paylaşmayan, hiçbir konum bilgisi veya kişisel bilgi talep etmeyen bir tanıtım platformudur. Sizden ad, soyad, telefon, e-posta veya konum gibi hiçbir kişisel veri istenmez ve toplanmaz. Amacımız yalnızca Ağrı'yı; restoranları, cafeleri, pastaneleri, sağlık hizmetlerini, nöbetçi eczaneleri, güzellik ve bakım merkezlerini, kuaförleri, eğitim kurumlarını, etkinlikleri ve gezilecek yerleri tek bir çatı altında, ücretsiz biçimde hem Ağrı halkına hem de değerli misafirlerimize tanıtmaktır. Tarayıcınızda yalnızca bu onay kutusunu bir daha göstermemek için küçük bir teknik kayıt (yerel depolama) tutulabilir; bu kayıt hiçbir şekilde tarafımıza iletilmez. Herhangi bir soru veya talebiniz için biagri0404@hotmail.com adresinden bize ulaşabilirsiniz.\n\nÜçüncü Taraf Verileri ve Kamuya Açık Bilgiler:\nPlatformumuz, işletmelerin ve kişilerin kendi rızalarıyla rehberimizde yer alması için tarafımıza sunduğu iletişim verilerini (telefon numarası, açık adres, işletme adı, vitrin görselleri) kamuya açık şekilde sergilemektedir. Bu verilerin toplanması, yayınlanması ve işlenmesi tamamen veri sahibinin (işletme/kişi) kendi talebi ve onayı ile gerçekleşmiştir. Tarafımıza iletilen bu işletme verilerinde hak ihlali, yanlış yönlendirme veya sahte beyan bulunması durumunda, sitemiz veri işleyen veya yayınlayan sıfatıyla sorumlu tutulamaz. Bilgilerini sitemizden kaldırtmak isteyen veya güncelleyen işletmeler, sitemiz üzerindeki iletişim kanallarından bizimle irtibata geçerek bu yöndeki taleplerini iletebilirler. İşlem en kısa sürede gerçekleştirilecektir, ancak geçmişe dönük yaşanmış mağduriyetlerden sitemiz sorumlu tutulamaz.";

  // KULLANIM ŞARTLARI METNİ
  const termsText = "Bu platformu kullanarak aşağıdaki şartları kabul etmiş olursunuz. Platformda yer alan tüm bilgiler (mekan, adres, telefon, nöbetçi eczane, vakitler vb.) tamamen bilgilendirme amaçlıdır ve resmî nitelik taşımaz. Bilgiler zamanla değişebileceğinden, olası hatalı, eksik veya güncel olmayan içeriklerden tarafımız sorumlu tutulamaz; önemli durumlarda ilgili kurumdan teyit almanız önerilir. Platformdaki içerikler izinsiz olarak ticari amaçla kopyalanamaz veya çoğaltılamaz. Bağlantı verilen üçüncü taraf hizmetlerin (ör. harita uygulamaları) içeriğinden ve gizlilik uygulamalarından o hizmet sağlayıcılar sorumludur. Bir bilgiyi düzeltmek, eklemek veya kaldırmak isterseniz biagri0404@hotmail.com adresi üzerinden bizimle iletişime geçebilirsiniz. Şartlar gerektiğinde güncellenebilir.\n\nMadde X – İçerik Sağlayıcılar, Üçüncü Taraf İşletmeler ve Sorumluluk Reddi\n\n1. Web sitemizde listelenen \"Gezilecek Yerler\" kategorisi hariç olmak üzere; diğer tüm kategorilerde (işletmeler, mekanlar, hizmet sağlayıcılar vb.) yer alan her türlü görsel, iletişim numarası, konum/adres bilgisi, hizmet tanımı ve fiyatlandırma gibi içerikler, bizzat ilgili kişi ve işletmelerin açık rızası ve kendi beyanları doğrultusunda tarafımıza iletilmiş ve sisteme eklenmiştir.\n\n2. Platformumuz yalnızca bir aracı, rehber ve vitrin görevi görmektedir. Sitemizde yer alan üçüncü şahıs veya işletmelere ait hiçbir bilginin kesin doğruluğunu, güncelliğini veya güvenilirliğini garanti etmiyoruz. Sitede yer alan bilgilerin yanlış, eksik veya yanıltıcı olmasından doğabilecek hiçbir hukuki, maddi veya manevi zarardan platformumuz, site yöneticilerimiz ve kurucularımız sorumlu tutulamaz. Tüm yasal sorumluluk, bu içeriklerin yayınlanmasını talep eden ve bilgileri tarafımıza ileten kişi ve işletmelerin şahsına/tüzel kişiliğine aittir.\n\n3. Hizmet Kalitesi ve Ticari İlişkiler: Kullanıcıların, sitemiz üzerinden iletişim kurduğu, ziyaret ettiği veya hizmet/ürün satın aldığı hiçbir işletme ile platformumuz arasında ticari bir bağ bulunmamaktadır. Bu kişi veya işletmelerden alınacak hizmetin kalitesi, ayıplı mal/hizmet süreçleri, müşteri memnuniyetsizliği veya yaşanabilecek herhangi bir ticari/hukuki uyuşmazlıkta sitemiz kesinlikle taraf değildir ve hiçbir sorumluluk kabul etmez.\n\n4. Yapay Zeka ile Üretilen İçerikler: Sitemizde yalnızca \"Gezilecek Yerler\" kategorisi altında sunulan görsel materyaller, tamamen tarafımızca yapay zeka (AI) teknolojileri kullanılarak üretilmiştir. Bu görseller temsilidir ve gerçeği ile birebir uyuşmama ihtimali barındırır. Kullanıcılar bu durumu bilerek sitemizi ziyaret ettiklerini kabul ederler.\n\nSorumluluk Reddi (Disclaimer): Verilen bilgiler bilgilendirme amaçlıdır, resmî nitelik taşımaz ve güncel olmayabilir.";

  const docData = {
    privacy: { title: "Gizlilik Politikası", body: privacyText },
    terms:   { title: "Kullanım Şartları",   body: termsText }
  };

  return (
    <div id="top" style={{ pointerEvents: tosStatus !== 'true' ? 'none' : 'auto' }}>
      
      {/* ANA SAYFA İÇERİĞİ KUSURSUZ YÜKLENİR (SADECE TIKLANAMAZ DURUMDADIR) */}
      <Topbar dark={false} />
      <Hero onOpenCat={(id) => setOpenCat(window.AGRI.categories.find(c=>c.id===id))} onSearchPlace={() => setOpenCat(window.AGRI.categories.find(c=>c.id==='gezilecek'))} />
      <ImageMarquee /> 
      <Stories />
      <AgendaDashboard />
      <Categories onOpen={setOpenCat} />
      
      <footer className="foot" id="iletisim">
        <div className="wrap">
          <div className="top">
            <div>
              <h3>Ağrı Dijital Rehberi</h3>
              <p className="lead">Ağrı'ya hizmet eden; hiçbir verinizi işlemeyen, saklamayan ve hiçbir konum bilgisi talep etmeyen ücretsiz bir tanıtım platformudur. Amacımız yalnızca şehrimizi en güzel şekilde tanıtmaktır. Sorumluluk Reddi (Disclaimer): Verilen bilgiler bilgilendirme amaçlıdır, resmî nitelik taşımaz ve güncel olmayabilir.</p>
            </div>
            <div className="cols">
              <div className="col">
                <h5>Kategoriler</h5>
                {window.AGRI.categories.map(c => (
                  <span key={c.id} onClick={()=>setOpenCat(window.AGRI.categories.find(x=>x.id===c.id))}>{c.name}</span>
                ))}
              </div>
              <div className="col">
                <h5>Yasal</h5>
                <span onClick={()=>setDocView('privacy')}>Gizlilik Politikası</span>
                <span onClick={()=>setDocView('terms')}>Kullanım Şartları</span>
              </div>
              <div className="col">
                <h5>İletişim</h5>
                <a href="mailto:biagri0404@hotmail.com">biagri0404@hotmail.com</a>
              </div>
            </div>
          </div>
          <div className="rule"></div>
          <div className="bottom">
            <span>Copyright © 2026 04agri.com — Tüm hakları saklıdır. Başarılar dileriz.</span>
          </div>
        </div>
      </footer>

      {openCat && <PlacesOverlay cat={openCat} onClose={() => setOpenCat(null)} />}

      {/* GİZLİLİK / KULLANIM ŞARTLARI DOKÜMAN MODALI (footer linklerinden açılır) */}
      {docView && (
        <div className="doc-modal-overlay" style={{ pointerEvents:'auto' }} onClick={(e)=>{ if(e.target.className==='doc-modal-overlay') setDocView(null); }}>
          <div className="doc-modal-card">
            <div className="doc-modal-head">
              <h2>{docData[docView].title}</h2>
              <button className="doc-modal-close" onClick={()=>setDocView(null)}>X</button>
            </div>
            <div className="doc-modal-body">
              <p>{docData[docView].body}</p>
            </div>
          </div>
        </div>
      )}

      {/* ŞEFFAF - BOTTOM SHEET MODAL (İLK GİRİŞTE ONAY) */}
      {tosStatus === 'ask' && (
        <div className="tos-overlay" style={{ pointerEvents: 'auto' }}>
          <div className="tos-modal">
            <h2>Hoş Geldiniz 🌿</h2>
            <p>Ağrı'nın dijital rehberine hoş geldiniz. Bu platform sizden hiçbir kişisel veri veya konum bilgisi talep etmez. Devam etmeden önce lütfen <strong onClick={()=>setDocView('privacy')} style={{cursor:'pointer', textDecoration:'underline'}}>Gizlilik Politikası</strong> ve <strong onClick={()=>setDocView('terms')} style={{cursor:'pointer', textDecoration:'underline'}}>Kullanım Şartları</strong> metinlerini onaylayın.</p>
            <p>Platformumuzda yer alan "Gezilecek Yerler" kategorisi dışındaki tüm işletme, kurum ve kişi profillerine ait bilgiler (görseller, adresler, iletişim numaraları ve sunulan hizmetler), ilgili tarafların kendi hür iradeleri ve rızaları ile sitemizde yayınlanmak üzere tarafımıza iletilmiştir. Bu bilgilerin (eksik, yanlış veya yanıltıcı olması dahil) doğruluğundan ve bu işletmelerden alacağınız mal/hizmetlerin kalitesinden platformumuz hiçbir şekilde sorumlu tutulamaz. Tüm hukuki sorumluluk, bu bilgileri sitemize gönderen kişi ve işletmelere aittir. Ek olarak, sitemizdeki "Gezilecek Yerler" kategorisinde yer alan görseller tamamen tarafımızca yapay zeka kullanılarak üretilmiş olup temsilidir. Sitemizi kullanmaya devam ederek ve "Okudum, Onaylıyorum" butonuna tıklayarak, Kullanım Şartları ve Gizlilik Politikamızı peşinen kabul etmiş olursunuz.</p>
            <p className="tos-disclaimer"><strong>Sorumluluk Reddi (Disclaimer):</strong> Verilen bilgiler bilgilendirme amaçlıdır, resmî nitelik taşımaz ve güncel olmayabilir.</p>
            <div className="tos-actions">
              <button className="tos-btn decline" onClick={handleDeclineTos}>Şimdilik Onaylamıyorum</button>
              <button className="tos-btn accept" onClick={handleAcceptTos}>Okudum, Onaylıyorum</button>
            </div>
          </div>
        </div>
      )}

      {/* REDDEDENLER İÇİN KİBAR VEDA EKRANI */}
      {tosStatus === 'blocked' && (
        <div className="tos-blocked-overlay" style={{ pointerEvents: 'auto' }}>
          <div className="tos-blocked-card">
            <h3>Görüşünüze Saygı Duyuyoruz</h3>
            <p>Sayfamızı inceleyebilmek ve kullanabilmek için Gizlilik Politikası ve Kullanım Şartları'nı onaylamanız gerekmektedir. Fikrinizi değiştirdiğinizde aramıza tekrar katılabilirsiniz.</p>
            <button className="tos-btn accept" style={{ width: '100%', padding: '16px' }} onClick={() => setTosStatus('ask')}>Şartları Tekrar İncele</button>
          </div>
        </div>
      )}

    </div>
  );
}

function pattern(color, variant) {
  return `linear-gradient(135deg, ${color} 0%, color-mix(in srgb, ${color}, #000 30%) 100%)`;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
