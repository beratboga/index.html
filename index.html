                </div>
              )}
            </div>

            {selectedPlace.mapsUrl && (
              <a className="pm-maps-btn" href={selectedPlace.mapsUrl} target="_blank" rel="noopener noreferrer" onClick={() => window.gtag && window.gtag('event', 'harita_tiklandi', { mekan_adi: selectedPlace.name })}>
                Google Haritalar'da Aç (Navigasyon)
              </a>
            )}
            <button className="pm-share-btn" onClick={handleShare}>
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="18" cy="5" r="3"></circle>
                <circle cx="6" cy="12" r="3"></circle>
                <circle cx="18" cy="19" r="3"></circle>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
              </svg>
              Bu Mekanı Paylaş
            </button>
          </div>
        </div>
        {fsImage && <FullscreenImage place={fsImage} onClose={() => setFsImage(null)} />}
        {fsVideo && <FullscreenVideo src={fsVideo} title={selectedPlace.name} onClose={() => setFsVideo(null)} />}
      </div>
    );
  }

  let content;
  if (isNobetci) {
    content = <PharmacyFullView />;
  } else if (hasSubCats && !selectedSubCat) {
    content = (
      <div className="grid animate-fade">
        {cat.subCategories.map((sub, i) => (
          <div key={i} className="card subcat-card" onClick={() => setSelectedSubCat(sub)} style={{background:`linear-gradient(150deg, ${cat.color} 0%, color-mix(in srgb, ${cat.color}, #000 45%) 100%)`}}>
            <div className="scrim"></div>
            <div className="subcat-ghost"><Icon name={sub.icon || 'pin'} size={150} stroke="#fff" sw={1} /></div>

            <div className="card-top-bar">
              <div className="card-icon"><Icon name={sub.icon || 'pin'} size={28} stroke="#fff" sw={1.7} /></div>
            </div>

            <div className="body">
              <h3>{sub.name}</h3>
              <div className="card-note">{sub.note || 'Tıklayıp içerikleri inceleyin'}</div>
            </div>
          </div>
        ))}
      </div>
    );
  } else {
    const activePlaces = hasSubCats ? (selectedSubCat ? selectedSubCat.places : []) : cat.places;
    
    if (activePlaces && activePlaces.length > 0) {
      content = (
        <div className="grid animate-fade">
          {activePlaces.map((p, i) => {
            const hasImg = p.img && p.img.trim() !== "";
            const hasVideo = p.video && p.video.trim() !== "";
            const cardStyle = hasImg
              ? { backgroundImage:`url(${p.img})`, backgroundPosition: p.bgPos || 'center 22%' }
              : { background:`linear-gradient(150deg, ${cat.color} 0%, color-mix(in srgb, ${cat.color}, #000 45%) 100%)` };

            const handleCardClick = () => { 
              setSelectedPlace(p); 
              // Mikro-Site Router Mantığı: Karta tıklayınca linki güncelle
              window.history.pushState(null, "", `/mekan/${p.slug}`);
            };
            const onTouchStart = hasVideo ? (e) => { touchStartX.current = e.touches[0].clientX; } : undefined;
            const onTouchEnd = hasVideo ? (e) => {
              if (touchStartX.current == null) return;
              const dx = e.changedTouches[0].clientX - touchStartX.current;
              touchStartX.current = null;
              if (Math.abs(dx) > 45) setFsVideo(p.video);
            } : undefined;

            return (
              <div
                key={i}
                className={"card" + (hasVideo ? " has-video" : "")}
                onClick={handleCardClick}
                onTouchStart={onTouchStart}
                onTouchEnd={onTouchEnd}
                style={cardStyle}
              >
                <div className="scrim"></div>
<button 
                  className={`fav-btn ${favorites.includes(p.slug) ? "is-fav" : ""}`} 
                  onClick={(e) => { 
                    e.stopPropagation(); 
                    toggleFav(p.slug); 
                    if(window.gtag) window.gtag('event', 'favoriye_eklendi', { mekan_adi: p.name });
                  }}
                >
                  <Icon name="heart" size={20} stroke="#fff" sw={2} />
                </button>
                {hasVideo && (
                  <div className="card-video-badge">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="#fff"><path d="M7 5.5v13a1 1 0 0 0 1.5.87l11-6.5a1 1 0 0 0 0-1.74l-11-6.5A1 1 0 0 0 7 5.5Z"/></svg>
                    Video
                  </div>
                )}

                <div className="card-top-bar">
                  <div className="card-icon"><Icon name={p.icon || 'pin'} size={28} stroke="#fff" sw={1.7} /></div>
                </div>

                <div className="body">
                  <h3>{p.name}</h3>
                  {p.subName && <div style={{fontSize:'13px', color:'rgba(255,255,255,0.85)', fontWeight:'700', marginTop:'4px'}}>{p.subName}</div>}
                  {p.area && <div className="card-area">📍 {p.area}</div>}
                  <div className="card-note">{hasVideo ? ' Müzik Hocası' : (p.note || 'Detayları görmek için tıklayın')}</div>
                </div>
              </div>
            );
          })}
          
          {cat.id === "gezilecek" && (
            <div style={{ gridColumn: '1 / -1', textAlign: 'center', padding: '20px 10px', marginTop: '10px', color: 'var(--ink-soft)', fontSize: '14px' }}>
              💡 <strong>Önemli Not:</strong> Bu bölümdeki görseller yapay zeka (AI) tarafından tasarlanmıştır. Detaylarda ufak hatalar barındırabilir ve mekanların birebir gerçek halini yansıtmayabilir.
            </div>
          )}

        </div>
      );
    } else {
      content = (
        <div className="coming-soon-container animate-fade">
          <h4>Çok yakında burada listelenecektir.</h4>
        </div>
      );
    }
  }

  return (
    <div className={`ov ${isClosing ? 'animate-out' : 'animate-in'}`} style={isClosing ? {opacity:0, transition:'opacity 0.2s'} : {}}>
      <div className="ov-head">
        <button className="ov-back" onClick={handleBack}>Geri Dön</button>
        <div className="ov-title"><h2>{selectedSubCat ? selectedSubCat.name : cat.name}</h2></div>
        <button className="ov-close" onClick={handleClose}>X</button>
      </div>
      <div className="ov-body">
        {content}
      </div>
    </div>
  );
}

function BottomNav({ activeTab, onTabChange, onOpenCat, onOpenFavorites }) {
  const tabs = [
    { id: 'home', label: 'Ana Sayfa', icon: 'home' },
    { id: 'cats', label: 'Keşfet', icon: 'grid' },
    { id: 'nobetci', label: 'Eczane', icon: 'cross', colorClass: 'active-red' },
    { id: 'gezilecek', label: 'Gezi', icon: 'compass' },
    { id: 'favs', label: 'Favoriler', icon: 'heart', colorClass: 'active-red' }
  ];

  const handlePress = (tab) => {
    onTabChange(tab.id);
    if (tab.id === 'home') {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      onOpenCat(null, 'home');
    } else if (tab.id === 'cats') {
      document.getElementById("kategoriler").scrollIntoView({ behavior:"smooth" });
      onOpenCat(null, 'cats');
    } else if (tab.id === 'nobetci') {
      onOpenCat(window.AGRI.categories.find(c => c.id === 'nobetci'));
    } else if (tab.id === 'gezilecek') {
      onOpenCat(window.AGRI.categories.find(c => c.id === 'gezilecek'));
    } else if (tab.id === 'favs') {
      onOpenFavorites();
    }
  };

  return (
    <nav className="bottom-nav" data-nosnippet="true">
      {tabs.map(tab => {
        const isActive = activeTab === tab.id;
        const activeClass = tab.colorClass || 'active';
        return (
          <button key={tab.id} className={`nav-item ${isActive ? activeClass : ''}`} onClick={() => handlePress(tab)}>
            <span className="nav-indicator"></span>
            <Icon name={tab.icon} size={24} stroke={isActive ? "currentColor" : "var(--ink-faint)"} sw={isActive ? 2.2 : 1.8} />
            <span>{tab.label}</span>
          </button>
        )
      })}
    </nav>
  );
}

/* ===================== MASTER APP ===================== */
const { useEffect: useEffectA, useState: useStateA } = React;

function App(){
  const [activeTab, setActiveTab] = useStateA('home');
  const [openCat, setOpenCat] = useStateA(null);
  const [directSub, setDirectSub] = useStateA(null);
  const [directPlace, setDirectPlace] = useStateA(null);
  const [docView, setDocView] = useStateA(null); 
  // FAVORİLER HAFIZASI (Yerel Depolama)
  const [favorites, setFavorites] = useStateA(() => {
    const saved = safeStore.get('agri_favs');
    return saved ? JSON.parse(saved) : [];
  });

  const toggleFav = (slug) => {
    let newFavs;
    if (favorites.includes(slug)) {
      newFavs = favorites.filter(id => id !== slug); // Favoriden çıkar
    } else {
      newFavs = [...favorites, slug]; // Favoriye ekle
    }
    setFavorites(newFavs);
    safeStore.set('agri_favs', JSON.stringify(newFavs));
  };

  const handleOpenFavorites = () => {
    let allPlaces = [];
    window.AGRI.categories.forEach(c => {
      if(c.places) allPlaces = [...allPlaces, ...c.places];
      if(c.hasSubCategories) {
        c.subCategories.forEach(sub => { if(sub.places) allPlaces = [...allPlaces, ...sub.places]; });
      }
    });
    const favPlaces = allPlaces.filter(p => favorites.includes(p.slug));
    
    const favCategory = {
      id: "favorilerim",
      name: "Favorilerim 💚",
      color: "#E84142",
      blurb: "Kendi cihazınıza kaydettiğiniz favori mekanlarınız.",
      places: favPlaces
    };
    setOpenCat(favCategory); setDirectSub(null); setDirectPlace(null);
    document.getElementById("kategoriler").scrollIntoView({ behavior:"smooth" });
    setActiveTab('favs');
  };
  
  const [tosStatus, setTosStatus] = useStateA(() => {
    return safeStore.get('agri_onay') || 'ask'; 
  });

  useEffectA(() => {
    const handleLocationRouting = () => {
      const pathParts = window.location.pathname.replace(/^\/|\/$/g, "").split("/");
      
      // Mikro site yönlendirmesi (Örn: /mekan/bahar-igan-bagan)
      if (pathParts[0] === "mekan" && pathParts[1]) {
        const slug = pathParts[1];
        let fCat = null, fSub = null, fPlace = null;
        
        window.AGRI.categories.forEach(c => {
          if (c.places) {
            const p = c.places.find(x => x.slug === slug);
            if (p) { fCat = c; fPlace = p; }
          }
          if (c.hasSubCategories) {
            c.subCategories.forEach(sub => {
              if (sub.places) {
                const p = sub.places.find(x => x.slug === slug);
                if (p) { fCat = c; fSub = sub; fPlace = p; }
              }
            });
          }
        });
        
        if (fCat && fPlace) {
          setOpenCat(fCat); setDirectSub(fSub); setDirectPlace(fPlace);
          setActiveTab(fCat.id === 'nobetci' ? 'nobetci' : (fCat.id === 'gezilecek' ? 'gezilecek' : 'cats'));
        } else {
          setOpenCat(null); setDirectSub(null); setDirectPlace(null);
          setActiveTab('home');
        }
      } 
      // Normal Kategori Yönlendirmesi (Örn: /gezilecek)
      else if (pathParts[0]) {
        const matchingCat = window.AGRI.categories.find(c => c.id === pathParts[0]);
        if (matchingCat) {
          setOpenCat(matchingCat); setDirectSub(null); setDirectPlace(null);
          setActiveTab(matchingCat.id === 'nobetci' ? 'nobetci' : (matchingCat.id === 'gezilecek' ? 'gezilecek' : 'cats'));
        } else {
          setOpenCat(null); setDirectSub(null); setDirectPlace(null);
          setActiveTab('home');
        }
      } else {
        setOpenCat(null); setDirectSub(null); setDirectPlace(null);
        setActiveTab('home');
        document.title = "04agri.com — Ağrı'nın Dijital Rehberi";
      }
    };

    handleLocationRouting(); 
    window.addEventListener("popstate", handleLocationRouting);
    return () => window.removeEventListener("popstate", handleLocationRouting);
  }, []);

  const handleUpdateCategoryView = (cat, intendedTab = null) => {
    if (cat) {
      window.history.pushState(null, "", `/${cat.id}`);
      setOpenCat(cat); setDirectSub(null); setDirectPlace(null);
      setActiveTab(cat.id === 'nobetci' ? 'nobetci' : (cat.id === 'gezilecek' ? 'gezilecek' : 'cats'));
    } else {
      window.history.pushState(null, "", "/"); 
      setOpenCat(null); setDirectSub(null); setDirectPlace(null);
      if (intendedTab) {
        setActiveTab(intendedTab);
      }
    }
  };

  const handleSearchSelect = (place) => {
    const cat = window.AGRI.categories.find(c => c.id === place.catId);
    if(cat) {
      window.history.pushState(null, "", `/mekan/${place.slug}`);
      setOpenCat(cat); setDirectSub(null); setDirectPlace(place);
    }
  };

  const handleAcceptTos = () => {
    safeStore.set('agri_onay', 'true');
    setTosStatus('true');
  };

  const handleDeclineTos = () => {
    setTosStatus('blocked');
  };

  useEffectA(() => {
    if (tosStatus !== 'true') {
      document.body.style.overflow = 'hidden';
    } else {
      document.body.style.overflow = 'auto';
    }
  }, [tosStatus]);

  // --- EKRAN KAYDIRMA (SWIPE) İLE SEKME DEĞİŞTİRME MOTORU ---
  const touchStartX = useRef(null);
  const touchStartY = useRef(null);
  const touchEndX = useRef(null);

  const handleTabSwitch = (tabId) => {
    setActiveTab(tabId);
    if (tabId === 'home') {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      handleUpdateCategoryView(null, 'home');
    } else if (tabId === 'cats') {
      document.getElementById("kategoriler").scrollIntoView({ behavior:"smooth" });
      handleUpdateCategoryView(null, 'cats');
    } else if (tabId === 'nobetci') {
      handleUpdateCategoryView(window.AGRI.categories.find(c => c.id === 'nobetci'));
    } else if (tabId === 'gezilecek') {
      handleUpdateCategoryView(window.AGRI.categories.find(c => c.id === 'gezilecek'));
    } else if (tabId === 'favs') {
      handleOpenFavorites();
    }
  };

  const onTouchStartGlobal = (e) => {
    touchStartX.current = e.targetTouches[0].clientX;
    touchStartY.current = e.targetTouches[0].clientY;
    touchEndX.current = null;
  };

  const onTouchMoveGlobal = (e) => { touchEndX.current = e.targetTouches[0].clientX; };

  const onTouchEndGlobal = (e) => {
    if (!touchStartX.current || !touchEndX.current) return;
    
    // Hikayeler veya kayan görseller (marquee) üzerinde kaydırma yapılıyorsa sekmeyi değiştirme
    if (e.target.closest('.stories-row') || e.target.closest('.marquee') || e.target.closest('.search-tags')) return;

    const distanceX = touchStartX.current - touchEndX.current;
    
    // Kaydırmanın bilerek yapıldığından emin ol (en az 90 piksel kaydırılmış olmalı)
    if (Math.abs(distanceX) > 90) {
      if (openCat && !['nobetci', 'gezilecek', 'favs'].includes(activeTab)) return; // Detay kartındayken sekme değiştirme
      if (docView || tosStatus !== 'true') return; // Sözleşme ekranındayken sekme değiştirme
      
      const tabsOrder = ['home', 'cats', 'nobetci', 'gezilecek', 'favs'];
      const currentIndex = tabsOrder.indexOf(activeTab);
      
      if (distanceX > 0 && currentIndex < tabsOrder.length - 1) {
        handleTabSwitch(tabsOrder[currentIndex + 1]); // Sola Kaydırdı -> Sonraki Sekme
      } else if (distanceX < 0 && currentIndex > 0) {
        handleTabSwitch(tabsOrder[currentIndex - 1]); // Sağa Kaydırdı -> Önceki Sekme
      }
    }
  };

  const privacyText = "Değerli Ziyaretçimiz, bu web sayfası Ağrı'ya hizmet eden; hiçbir verinizi işlemeyen, saklamayan veya üçüncü taraflarla paylaşmayan, hiçbir konum bilgisi veya kişisel bilgi talep etmeyen bir tanıtım platformudur. Sizden ad, soyad, telefon, e-posta veya konum gibi hiçbir kişisel veri istenmez ve toplanmaz. Amacımız yalnızca Ağrı'yı; restoranları, cafeleri, pastaneleri, sağlık hizmetlerini, nöbetçi eczaneleri, güzellik ve bakım merkezlerini, kuaförleri, eğitim kurumlarını, etkinlikleri ve gezilecek yerleri tek bir çatı altında, ücretsiz biçimde hem Ağrı halkına hem de değerli misafirlerimize tanıtmaktır. Tarayıcınızda yalnızca bu onay kutusunu bir daha göstermemek için küçük bir teknik kayıt (yerel depolama) tutulabilir; bu kayıt hiçbir şekilde tarafımıza iletilmez. Herhangi bir soru veya talebiniz için biagri0404@hotmail.com adresinden bize ulaşabilirsiniz.";
  const termsText = "Bu platformu kullanarak aşağıdaki şartları kabul etmiş olursunuz. Platformda yer alan tüm bilgiler (mekan, adres, telefon, nöbetçi eczane, vakitler vb.) tamamen bilgilendirme amaçlıdır ve resmî nitelik taşımaz. Bilgiler zamanla değişebileceğinden, olası hatalı, eksik veya güncel olmayan içeriklerden tarafımız sorumlu tutulamaz; önemli durumlarda ilgili kurumdan teyit almanız önerilir. Platformdaki içerikler izinsiz olarak ticari amaçla kopyalanamaz veya çoğaltılamaz. Bağlantı verilen üçüncü taraf hizmetlerin (ör. harita uygulamaları) içeriğinden ve gizlilik uygulamalarından o hizmet sağlayıcılar sorumludur. Bir bilgiyi düzeltmek, eklemek veya kaldırmak isterseniz biagri0404@hotmail.com adresi üzerinden bizimle iletişime geçebilirsiniz. Şartlar gerektiğinde güncellenebilir.\n\nSorumluluk Reddi (Disclaimer): Verilen bilgiler bilgilendirme amaçlıdır, resmî nitelik taşımaz ve güncel olmayabilir.";

  const docData = {
    privacy: { title: "Gizlilik Politikası", body: privacyText },
    terms:   { title: "Kullanım Şartları",   body: termsText }
  };

  return (
    <div id="top" 
      style={{ pointerEvents: tosStatus !== 'true' ? 'none' : 'auto', overflowX: 'hidden' }}
      onTouchStart={onTouchStartGlobal}
      onTouchMove={onTouchMoveGlobal}
      onTouchEnd={onTouchEndGlobal}
    >
      
      <Topbar />
      <Hero onOpenCat={handleUpdateCategoryView} onSearchPlace={handleSearchSelect} onOpenFavorites={handleOpenFavorites} />
      <ImageMarquee /> 
      <Stories />
      <AgendaDashboard />
      <Categories onOpen={handleUpdateCategoryView} />
      
      <footer className="foot" id="iletisim">
        <div className="wrap">
          <div className="top">
            <div>
              <h3>Ağrı Dijital Rehberi</h3>
              <p className="lead">Ağrı'ya hizmet eden; hiçbir verinizi işlemeyen, saklamayan ve hiçbir konum bilgisi talep etmeyen ücretsiz bir tanıtım platformudur. Amacımız yalnızca şehrimizi en güzel şekilde tanıtmaktır. Sorumluluk Reddi (Disclaimer): Verilen bilgiler bilgilendirme amaçlıdır, resmî nitelik taşımaz ve güncel olmayabilir.</p>
            </div>
            <div className="cols">
              <div className="col">
                <h5>Kategoriler</h5>
                {window.AGRI.categories.map(c => (
                  <span key={c.id} onClick={()=>handleUpdateCategoryView(window.AGRI.categories.find(x=>x.id===c.id))}>{c.name}</span>
                ))}
              </div>
              <div className="col">
                <h5>Yasal</h5>
                <span onClick={()=>setDocView('privacy')}>Gizlilik Politikası</span>
                <span onClick={()=>setDocView('terms')}>Kullanım Şartları</span>
              </div>
              <div className="col">
                <h5>İletişim</h5>
                <a href="mailto:biagri0404@hotmail.com">biagri0404@hotmail.com</a>
              </div>
            </div>
          </div>
          <div className="rule"></div>
          <div className="bottom">
            <span>Copyright © 2026 04agri.com — Tüm hakları saklıdır. Başarılar dileriz.</span>
          </div>
        </div>
      </footer>

      {openCat && <PlacesOverlay cat={openCat} initialSubCat={directSub} initialPlace={directPlace} onClose={() => handleUpdateCategoryView(null)} favorites={favorites} toggleFav={toggleFav} />}

      {docView && (

          <div className="doc-modal-card">

              <h2>{docData[docView].title}</h2>
              <button className="doc-modal-close" onClick={()=>setDocView(null)}>X</button>
            </div>
            <div className="doc-modal-body">
              <p>{docData[docView].body}</p>
            </div>
          </div>
        </div>
      )}

      {tosStatus === 'ask' && (

          <div className="tos-modal">
            <h2>Hoş Geldiniz 🌿</h2>
            <p>Ağrı'nın dijital rehberine hoş geldiniz. Bu platform sizden hiçbir kişisel veri veya konum bilgisi talep etmez. Devam etmeden önce lütfen <strong onClick={()=>setDocView('privacy')} style={{cursor:'pointer', textDecoration:'underline'}}>Gizlilik Politikası</strong> ve <strong onClick={()=>setDocView('terms')} style={{cursor:'pointer', textDecoration:'underline'}}>Kullanım Şartları</strong> metinlerini onaylayın.</p>
            <p className="tos-disclaimer"><strong>Sorumluluk Reddi (Disclaimer):</strong> Verilen bilgiler bilgilendirme amaçlıdır, resmî nitelik taşımaz ve güncel olmayabilir.</p>
            <div className="tos-actions">
              <button className="tos-btn decline" onClick={handleDeclineTos}>Şimdilik Onaylamıyorum</button>
              <button className="tos-btn accept" onClick={handleAcceptTos}>Okudum, Onaylıyorum</button>
            </div>
          </div>
        </div>
      )}

      {tosStatus === 'blocked' && (
        <div className="tos-blocked-overlay" style={{ pointerEvents: 'auto' }}>
          <div className="tos-blocked-card">
            <h3>Görüşünüze Saygı Duyuyoruz</h3>
            <p>Sayfamızı inceleyebilmek ve kullanabilmek için Gizlilik Politikası ve Kullanım Şartları'nı onaylamanız gerekmektedir. Fikrinizi değiştirdiğinizde aramıza tekrar katılabilirsiniz.</p>
            <button className="tos-btn accept" style={{ width: '100%', padding: '16px' }} onClick={() => setTosStatus('ask')}>Şartları Tekrar İncele</button>
          </div>
        </div>
      )}

      <BottomNav activeTab={activeTab} onTabChange={setActiveTab} onOpenCat={handleUpdateCategoryView} onOpenFavorites={handleOpenFavorites} />
    </div>
  );
}

function pattern(color, variant) {
  return `linear-gradient(135deg, ${color} 0%, color-mix(in srgb, ${color}, #000 30%) 100%)`;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
