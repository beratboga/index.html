<style>
:root{
  --bg:        #f6f4ef;
  --bg-2:      #efece4;
  --ink:       #17150f;
  --ink-soft:  #6a655a;
  --ink-faint: #a39d90;
  --line:      #e3ded3;
  --card:      #ffffff;
  --dark:   #0c1020;
  --dark-2: #131a31;
  --dawn-1: #1a2444;      
  --dawn-2: #5b6aa0;
  --dawn-3: #e6a071;      
  --dawn-4: #f3c9a0;
  --globe:  220, 232, 255;
  --accent: #44BD32;      
  --pin:    #E84142;
  --maxw: 1280px;
  --r-lg: 32px;
  --r-md: 24px;
  --r-sm: 14px;
  --shadow-1: 0 4px 12px rgba(20,18,12,.06), 0 1px 3px rgba(20,18,12,.04);
  --shadow-2: 0 20px 40px rgba(20,18,12,.12), 0 8px 16px rgba(20,18,12,.08);
  --shadow-3: 0 30px 90px rgba(8,10,24,.45);
  --display: "Bricolage Grotesque", "Plus Jakarta Sans", system-ui, sans-serif;
  --body:    "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --ease: cubic-bezier(.22,.61,.36,1);
  --ease-io: cubic-bezier(.83,0,.17,1);
}

*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
html, body{
  margin:0; padding:0; width: 100%; max-width: 100%;
  background:var(--bg); color:var(--ink);
  font-family:var(--body); font-size:17px; line-height:1.55;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; overflow-x:hidden;
}
h1,h2,h3,h4{ font-family:var(--display); font-weight:700; line-height:1.02; letter-spacing:-.02em; margin:0; }
button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; outline:none; }
input, select, textarea{ font-family:inherit; }
a{ color:inherit; text-decoration:none; cursor:pointer; }
.wrap{ max-width:var(--maxw); margin:0 auto; padding:0 28px; width:100%; }
::selection{ background:var(--accent); color:var(--ink); }

/* POLİTİKA ONAY MODALI */
.tos-overlay { position:fixed; inset:0; z-index:9999; background:rgba(12,16,32,0.45); backdrop-filter:blur(8px); display:flex; flex-direction:column; justify-content:flex-end; align-items:center; width:100%; height:100%; }
.tos-modal { background:#fff; color:var(--ink); padding:36px 36px 42px; border-radius:32px 32px 0 0; max-width:800px; width:100%; box-shadow:0 -10px 40px rgba(0,0,0,0.2); animation:slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; display:flex; flex-direction:column; gap:16px; }
@keyframes slideUp { from { transform:translateY(100%); opacity:0; } to { transform:translateY(0); opacity:1; } }
.tos-modal h2 { font-size:24px; font-weight:800; color:var(--dark); display:flex; align-items:center; gap:10px; margin:0; }
.tos-modal p { font-size:15px; color:var(--ink-soft); line-height:1.6; margin:0; text-align:justify; }
.tos-disclaimer { font-size:13px !important; color:var(--ink-faint) !important; background:var(--bg-2); padding:12px 14px; border-radius:12px; border-left:3px solid var(--accent); }
.tos-actions { display:flex; gap:12px; margin-top:12px; }
.tos-btn { flex:1; padding:16px; border-radius:100px; font-weight:800; font-size:15px; text-align:center; transition:all 0.2s; cursor:pointer; }
.tos-btn.accept { background:var(--accent); color:var(--ink); border:none; }
.tos-btn.accept:hover { filter:brightness(0.95); transform:translateY(-2px); }
.tos-btn.decline { background:transparent; color:var(--ink-soft); border:1px solid var(--line); }

/* GİZLİLİK MODALI */
.doc-modal-overlay { position:fixed; inset:0; z-index:10000; background:rgba(12,16,32,0.7); backdrop-filter:blur(10px); display:grid; place-items:center; padding:20px; }
.doc-modal-card { background:var(--card); color:var(--ink); border-radius:24px; max-width:640px; width:100%; max-height:85vh; display:flex; flex-direction:column; box-shadow:var(--shadow-3); overflow:hidden; animation:fadeIn .35s ease; }
.doc-modal-head { display:flex; align-items:center; justify-content:space-between; padding:24px 28px; border-bottom:1px solid var(--line); }
.doc-modal-head h2 { font-size:22px; font-weight:800; color:var(--dark); }
.doc-modal-close { width:38px; height:38px; border-radius:50%; background:var(--bg-2); font-weight:800; cursor:pointer; flex-shrink:0; }
.doc-modal-body { padding:24px 28px 30px; overflow-y:auto; }
.doc-modal-body p { font-size:15px; line-height:1.7; color:var(--ink-soft); text-align:justify; margin:0; }

.tos-blocked-overlay { position:fixed; inset:0; z-index:9999; background:rgba(12,16,32,0.65); backdrop-filter:blur(12px); display:grid; place-items:center; padding:20px; }
.tos-blocked-card { background:var(--card); color:var(--ink); padding:40px; border-radius:24px; max-width:480px; text-align:center; box-shadow:var(--shadow-3); animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }
.animate-fade { animation: fadeIn 0.4s var(--ease); }

/* KARANLIK MOD (DARK MODE) RENKLERİ ($0) */
[data-theme="dark"] {
  --bg:        #0a0d18;
  --bg-2:      #12182c;
  --ink:       #f6f4ef;
  --ink-soft:  #b0aab0;
  --ink-faint: #6c728a;
  --line:      #1c243f;
  --card:      #131a31;
}

/* TOP BAR */
.topbar{ position:fixed; inset:0 0 auto 0; z-index:60; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:18px 28px; transition:background .4s var(--ease), backdrop-filter .4s; pointer-events:none; width:100%; }

/* APPLE KARANLIK/AYDINLIK MOD BUTONU */
.theme-toggle-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: 100px;
  font-size: 13.5px; font-weight: 800; cursor: pointer;
  background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.25);
  color: #fff; backdrop-filter: blur(12px);
  transition: all 0.25s var(--ease);
}
.theme-toggle-btn:hover { transform: scale(1.06); background: rgba(255, 255, 255, 0.28); }
.topbar:not(.on-dark) .theme-toggle-btn {
  background: var(--bg-2); border-color: var(--line); color: var(--ink);
}
.topbar > *{ pointer-events:auto; }
.topbar.scrolled{ background:color-mix(in srgb, var(--bg), transparent 12%); backdrop-filter:saturate(140%) blur(14px); box-shadow:0 1px 0 var(--line); }
.logo{ justify-self:start; display:flex; align-items:center; gap:8px; font-family:var(--display); font-weight:800; font-size:22px; letter-spacing:-.03em; }
.logo .badge{ width:38px; height:38px; border-radius:11px; display:grid; place-items:center; background:var(--accent); color:var(--ink); font-size:18px; font-weight:800; box-shadow:0 6px 16px color-mix(in srgb,var(--accent),transparent 55%); }
.logo .txt{ display:flex; align-items:baseline; color:var(--ink); }
.logo .dim{ color:var(--ink-faint); font-weight:600; }
.topbar.on-dark .logo .txt{ color:#fff; }
.topbar.on-dark .logo .dim{ color:rgba(255,255,255,.55); }

.topbar-nav{ justify-self:center; display:flex; gap:24px; font-size:15px; font-weight:700; align-items:center; }
.topbar-nav a{ position:relative; color:var(--ink); transition:color .2s; }
.topbar.on-dark .topbar-nav a{ color:#fff; }
.topbar-nav a:hover{ color:var(--accent); }

/* Topbar Randevu Butonu */
.nav-book-btn { background: var(--accent); color: var(--ink) !important; font-weight: 800 !important; padding: 8px 18px; border-radius: 100px; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 4px 14px rgba(68,189,50,0.25); transition: transform 0.2s, filter 0.2s; }
.nav-book-btn:hover { transform: translateY(-1px) scale(1.02); filter: brightness(0.96); }

.topbar .loc{ justify-self:end; display:flex; align-items:center; gap:7px; font-size:14px; font-weight:600; color:var(--ink-soft); }
.topbar.on-dark .loc{ color:rgba(255,255,255,.7); }
.loc .dot{ width:8px;height:8px;border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb,var(--accent),transparent 70%); }

/* HERO & MOUNTAIN & 3D CANVAS */
.hero{ position:relative; height:100svh; min-height:680px; width:100%; overflow:hidden; background:linear-gradient(180deg, var(--dark) 0%, var(--dark-2) 100%); }
.hero .sky{ position:absolute; inset:0; transition:opacity 1.4s var(--ease); }
.hero .sky.dawn{ opacity:0; background: radial-gradient(120% 80% at 50% 120%, var(--dawn-3) 0%, transparent 55%), linear-gradient(180deg, var(--dawn-1) 0%, var(--dawn-2) 58%, var(--dawn-4) 100%); }
.hero.is-mountain .sky.dawn{ opacity:1; }
.hero .sun{ position:absolute; left:50%; top:62%; width:340px; height:340px; margin:-170px 0 0 -170px; border-radius:50%; opacity:0; background:radial-gradient(circle, rgba(255,228,190,.9) 0%, rgba(255,200,140,.35) 40%, transparent 70%); transition:opacity 1.6s var(--ease) .2s; filter:blur(2px); }
.hero.is-mountain .sun{ opacity:.9; }

.globe-stage{ position:absolute; inset:0; display:grid; place-items:center; transform-origin:50% 54%; transition:transform 1.5s var(--ease-io), opacity 1.1s var(--ease) .25s; }
.hero.is-zoom .globe-stage{ transform:scale(8); opacity:0; }
.globe-canvas{ display:block; }

.geo-label{ position:absolute; left:50%; top:54%; transform:translate(-50%,46px) scale(.9); z-index:6; text-align:center; opacity:0; transition:opacity .6s var(--ease), transform .6s var(--ease); pointer-events:none; }
.hero.is-locate .geo-label{ opacity:1; transform:translate(-50%,46px) scale(1); }
.hero.is-zoom .geo-label, .hero.is-mountain .geo-label{ opacity:0; }
.geo-label .pt{ font-family:var(--display); font-weight:700; font-size:15px; color:#fff; letter-spacing:.18em; text-transform:uppercase; }
.geo-label .sub{ font-size:12.5px; color:rgba(255,255,255,.6); margin-top:3px; letter-spacing:.05em; }

.mountain{ position:absolute; inset:0; z-index: 5; opacity:0; transform:translateY(40px); pointer-events:none; transition:opacity 1.3s var(--ease) .35s, transform 1.5s var(--ease) .35s; }
.hero.is-mountain .mountain{ opacity:1; transform:translateY(0); }
.mountain img { width: 100%; height: 100%; object-fit: cover; object-position: bottom center; display: block; }

.hero-content{ position:absolute; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:14vh; text-align:center; pointer-events:none; width:100%; }
.hero-content > *{ pointer-events:auto; }
.hero-eyebrow{ display:inline-flex; align-items:center; gap:9px; font-size:13px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.72); white-space:nowrap; padding:8px 16px; border:1px solid rgba(255,255,255,.18); border-radius:100px; background:rgba(255,255,255,.04); backdrop-filter:blur(6px); opacity:0; transform:translateY(12px); transition:all .7s var(--ease) .1s; }
.hero-title{ color:#fff; font-size:clamp(38px, 6.4vw, 78px); margin:20px 0 0; line-height:1.0; opacity:0; transform:translateY(18px); transition:all .8s var(--ease) .2s; white-space:nowrap; }
.hero-title em{ font-style:normal; color:var(--accent); -webkit-text-stroke:0; background:linear-gradient(120deg,var(--accent),#2dd86f); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.hero-sub{ color:rgba(255,255,255,.82); font-size:clamp(15px,1.6vw,19px); margin:20px auto 0; max-width:44ch; padding:0 20px; opacity:0; transform:translateY(16px); transition:all .8s var(--ease) .3s; text-wrap:pretty; }
.hero.is-mountain .hero-eyebrow, .hero.is-mountain .hero-title, .hero.is-mountain .hero-sub{ opacity:1; transform:none; }

.search-wrapper{ position:relative; margin-top:34px; width:min(680px, 90%); opacity:0; transform:translateY(20px) scale(.98); transition:all .8s var(--ease) .42s; }
.hero.is-mountain .search-wrapper{ opacity:1; transform:none; }
.search{ display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.96); border-radius:100px; padding:9px 9px 9px 22px; box-shadow:var(--shadow-3); border:1px solid rgba(255,255,255,.6); position:relative; z-index:2; width:100%; }
.search .ico{ color:var(--ink-faint); display:flex; flex-shrink:0; }
.search input{ flex:1; border:none; outline:none; background:none; font-size:17px; color:var(--ink); padding:12px 4px; min-width:0; }
.search input::placeholder{ color:var(--ink-faint); }
.search .go{ flex-shrink:0; background:var(--ink); color:#fff; font-weight:700; font-size:15px; padding:13px 26px; border-radius:100px; transition:transform .2s var(--ease), background .2s; }
.search .go:hover{ transform:translateY(-1px); background:#000; }

.search-dropdown{ position:absolute; top:calc(100% + 12px); left:0; right:0; background:#fff; border-radius:var(--r-md); box-shadow:var(--shadow-3); overflow:hidden; z-index:1; display:flex; flex-direction:column; text-align:left; }
.sugg-item{ display:flex; align-items:center; gap:12px; padding:14px 22px; border-bottom:1px solid var(--line); cursor:pointer; transition:background .2s; }
.sugg-item:last-child{ border-bottom:none; }
.sugg-item:hover{ background:var(--bg-2); }
.sugg-item .s-icon{ display:grid; place-items:center; width:34px; height:34px; border-radius:8px; color:#fff; flex-shrink:0; }
.sugg-item .s-text{ flex:1; display:flex; flex-direction:column; }
.sugg-item .s-name{ font-weight:700; color:var(--ink); font-size:15px; }
.sugg-item .s-cat{ font-size:12px; color:var(--ink-soft); font-weight:600; }

.search-tags{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:16px; opacity:0; transition:opacity .8s var(--ease) .6s; padding:0 16px; }
.hero.is-mountain .search-tags{ opacity:1; }
.search-tags button{ font-size:13px; font-weight:600; color:#fff; padding:7px 14px; border-radius:100px; border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.06); backdrop-filter:blur(6px); transition:all .2s var(--ease); cursor:pointer; }
.search-tags button:hover{ background:var(--accent); color:var(--ink); border-color:transparent; transform:translateY(-1px); }
.search-tags button.highlight-btn { background: var(--accent); color: var(--ink); border-color: transparent; box-shadow: 0 4px 14px rgba(68, 189, 50, 0.2); }

/* BANNER MARQUEE */
.banner-section{ padding:40px 0; background:var(--bg); overflow:hidden; width:100%; max-width:100%; }
.marquee{ display:flex; width:max-content; animation:scroll 40s linear infinite; will-change:transform; }
.marquee:hover{ animation-play-state:paused; }
@keyframes scroll{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }

.banner-item { width: 340px; height: 190px; border-radius: var(--r-md); box-shadow: var(--shadow-1); border: 1px solid rgba(255,255,255,0.4); margin-right: 20px; flex-shrink: 0; position: relative; overflow: hidden; background-size: cover; display: block; transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease); }
.banner-item:hover { transform: translateY(-4px); box-shadow: var(--shadow-2); }
.banner-scrim { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 20%, rgba(0,0,0,0.85) 100%); }
.banner-content { position: absolute; bottom: 16px; left: 16px; right: 16px; display: flex; flex-direction: column; z-index: 2; }
.banner-title { color: #fff; font-family: var(--display); font-size: 17px; font-weight: 800; line-height: 1.2; margin-bottom: 4px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
.banner-sub { color: var(--accent); font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }

/* HİKAYELER */
.stories-section{ padding:8px 0 24px; background:var(--bg); width:100%; }
.stories-row{ display:flex; gap:20px; flex-wrap:wrap; }
.story-bubble{ display:flex; flex-direction:column; align-items:center; gap:8px; background:none; cursor:pointer; width:84px; }
.story-ring{ width:82px; height:82px; border-radius:50%; padding:3px; display:grid; place-items:center;
  background:conic-gradient(from 140deg, var(--accent), var(--dawn-3), var(--dawn-2), var(--accent));
  box-shadow:0 6px 18px color-mix(in srgb, var(--accent), transparent 70%); transition:transform .2s var(--ease); }
.story-bubble:hover .story-ring{ transform:scale(1.05); }
.story-thumb{ width:100%; height:100%; border-radius:50%; background-color:var(--dark-2); background-size:cover; background-repeat:no-repeat;
  display:grid; place-items:center; color:rgba(255,255,255,.7); border:3px solid var(--bg); }
.story-label{ font-size:13px; font-weight:700; color:var(--ink-soft); text-align:center; line-height:1.1; max-width:84px; }

.story-viewer{ position:fixed; inset:0; z-index:300; background:rgba(8,10,24,.92); backdrop-filter:blur(6px); display:grid; place-items:center; padding:20px; animation:fadeIn .3s ease; }
.story-card{ position:relative; width:min(380px,92vw); aspect-ratio:9/16; max-height:84vh; border-radius:22px; overflow:hidden; box-shadow:var(--shadow-3); }
.story-card-img{ width:100%; height:100%; object-fit:cover; }
.story-card-overlay{ position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end; gap:14px; padding:30px; background:linear-gradient(180deg, transparent 45%, rgba(0,0,0,.55) 100%); }
.story-card-text{ color:#fff; font-family:var(--display); font-weight:700; font-size:24px; line-height:1.2; text-shadow:0 2px 10px rgba(0,0,0,.4); text-wrap:balance; }

/* GÜNDEM & WIDGETLAR */
#gundem{ padding:20px 0 40px; background:var(--bg); width:100%; max-width:100%; overflow-x:hidden; }
.gundem-layout{ display:grid; grid-template-columns: 1fr 360px; gap:32px; align-items:start; }

.widget-panel{ display:flex; flex-direction:column; gap:16px; width:100%; }
.widget-card{ background:var(--card); border-radius:var(--r-lg); padding:24px; box-shadow:var(--shadow-1); border:1px solid var(--line); position:relative; overflow:hidden; }
.widget-card.weather{ background:linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color:#fff; border:none; }
.w-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
.w-top .city{ font-family:var(--display); font-weight:700; font-size:20px; }
.w-top .date{ font-size:13px; font-weight:600; opacity:.8; }
.w-main{ display:flex; align-items:center; gap:16px; }
.w-main .temp{ font-size:42px; font-family:var(--display); font-weight:800; line-height:1; }
.w-main .desc{ font-size:14px; font-weight:600; opacity:.9; max-width:120px; line-height:1.2; }

/* NAMAZ VAKİTLERİ (CANLI SAYACLI & 00:00 GÜN DEĞİŞİMLİ) */
.widget-card.prayer{ background:var(--dark-2); color:#fff; border:none; padding:20px; }
.p-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center; }
.p-item{ background:rgba(255,255,255,.08); border-radius:10px; padding:8px 2px; border:1px solid rgba(255,255,255,.05); transition:all .2s; }
.p-item.active{ background:var(--accent); color:var(--ink); font-weight:800; border-color:transparent; transform:scale(1.02); box-shadow:0 4px 12px rgba(68,189,50,.25); }
.p-item span{ display:block; font-size:11px; font-weight:700; opacity:.75; text-transform:uppercase; margin-bottom:2px; }
.p-item strong{ display:block; font-family:var(--display); font-size:14.5px; }

/* DİNAMİK SEÇMELİ ECZANE WIDGETI */
.widget-card.pharmacy-widget { background: var(--card); border: 1px solid var(--line); padding: 20px; color: var(--ink); }
.ph-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; }
.ph-title { font-family: var(--display); font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
.ph-select { background: var(--bg-2); border: 1px solid var(--line); padding: 6px 12px; border-radius: 100px; font-size: 13px; font-weight: 700; outline: none; color: var(--ink); cursor: pointer; }
.ph-box { background: var(--bg); border-radius: var(--r-sm); padding: 14px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.ph-name-row { display: flex; justify-content: space-between; align-items: baseline; }
.ph-name { font-family: var(--display); font-size: 16px; font-weight: 800; color: var(--pin); }
.ph-date-badge { font-size: 11px; background: var(--ink); color: #fff; padding: 2px 8px; border-radius: 100px; font-weight: 700; }
.ph-detail { font-size: 13.5px; color: var(--ink-soft); line-height: 1.4; font-weight: 500; }
.ph-landmark { font-size: 12px; color: var(--ink); font-weight: 700; text-transform: uppercase; border-left: 2px solid var(--pin); padding-left: 6px; margin-top: 2px; }
.ph-footer-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; padding-top: 8px; border-top: 1px dashed var(--line); }
.ph-phone { font-size: 14px; font-weight: 800; color: var(--ink); display: flex; align-items: center; gap: 4px; }
.ph-map-link { font-size: 12.5px; font-weight: 700; color: #3498DB; text-decoration: underline; }
.ph-empty { font-size: 13.5px; color: var(--ink-faint); text-align: center; padding: 10px 0; font-weight: 600; }

.news-wrap{ grid-column: 1 / -1; margin-top:16px; width:100%; }
.news-header{ font-family:var(--display); font-size:26px; font-weight:700; margin-bottom:20px; display:flex; align-items:center; gap:10px; }
.news-header::before{ content:""; display:block; width:12px; height:12px; border-radius:50%; background:var(--pin); }
.news-list{ display:flex; flex-direction:column; gap:16px; width:100%; }
.news-item{ display:flex; gap:20px; background:var(--card); border-radius:var(--r-md); padding:16px; box-shadow:var(--shadow-1); border:1px solid var(--line); transition:transform .2s var(--ease), box-shadow .2s; cursor:pointer; }
.news-item:hover{ transform:translateY(-3px); box-shadow:var(--shadow-2); }
.news-content{ display:flex; flex-direction:column; justify-content:center; }
.news-content h4{ font-size:18px; margin-bottom:6px; color:var(--ink); }
.news-content p{ font-size:14px; color:var(--ink-soft); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.news-meta{ margin-bottom:6px; font-size:12px; font-weight:700; color:var(--accent); letter-spacing:.05em; }
/* GÜNDEM İLE KATEGORİLER ARASI APPLE CANLI RANDEVU MERKEZİ ($0) */
#randevu { padding: 0 0 24px; background: var(--bg); width: 100%; }
.book-sec-head { text-align: left; margin-bottom: 18px; }
.book-sec-head .kicker { font-size: 13px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
.book-sec-head h2 { font-size: clamp(26px, 3.8vw, 40px); margin: 4px 0 0; color: var(--ink); }
.book-sec-head p { color: var(--ink-soft); margin: 6px 0 0; font-size: 15.5px; max-width: 58ch; }

.book-layout { display: grid; grid-template-columns: 1.2fr 0.9fr; gap: 24px; align-items: start; width: 100%; }
@media (max-width: 900px) { .book-layout { grid-template-columns: 1fr; } }

.book-form-card { background: var(--card); border-radius: var(--r-lg); padding: 26px; box-shadow: var(--shadow-1); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
.book-tabs { display: flex; gap: 8px; background: var(--bg-2); padding: 5px; border-radius: 100px; }
.book-tab-btn { flex: 1; padding: 10px 16px; border-radius: 100px; font-weight: 800; font-size: 14px; cursor: pointer; transition: all 0.2s; color: var(--ink-soft); }
.book-tab-btn.active { background: #fff; color: var(--ink); box-shadow: var(--shadow-1); }
[data-theme="dark"] .book-tab-btn.active { background: var(--dark-2); color: #fff; }

.slots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; margin-top: 6px; }
.slot-chip { padding: 9px 4px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-2); color: var(--ink); font-size: 13px; font-weight: 700; text-align: center; cursor: pointer; transition: all 0.2s; }
.slot-chip:hover:not(.booked) { border-color: var(--accent); transform: scale(1.03); }
.slot-chip.active { background: var(--accent); color: var(--ink); border-color: transparent; font-weight: 800; box-shadow: 0 4px 12px rgba(68,189,50,0.28); }
.slot-chip.booked { opacity: 0.4; cursor: not-allowed; background: var(--bg); text-decoration: line-through; }

/* SAĞDAKİ CANLI İŞLETME BİLGİ KARTI */
.biz-card-preview { background: var(--card); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow-1); border: 1px solid var(--line); display: flex; flex-direction: column; position: sticky; top: 90px; }
.bcp-img-wrap { width: 100%; height: 200px; position: relative; background: #111; }
.bcp-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
.bcp-scrim { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, rgba(12,16,32,0.92) 100%); }
.bcp-badge { position: absolute; top: 14px; left: 14px; background: rgba(0,0,0,0.6); color: #fff; backdrop-filter: blur(10px); padding: 4px 12px; border-radius: 100px; font-size: 11.5px; font-weight: 700; border: 1px solid rgba(255,255,255,0.2); }
.bcp-title-wrap { position: absolute; bottom: 14px; left: 18px; right: 18px; color: #fff; }
.bcp-title { font-size: 20px; font-weight: 800; margin: 0; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
.bcp-sub { font-size: 13px; opacity: 0.9; font-weight: 600; color: var(--accent); }

.bcp-body { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.bcp-quote { background: var(--bg-2); padding: 12px 14px; border-radius: 14px; border-left: 3px solid var(--accent); font-size: 13px; color: var(--ink-soft); line-height: 1.5; margin: 0; font-weight: 600; }
.bcp-info-row { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: var(--ink); }
.bcp-info-row a { color: #0071e3; text-decoration: underline; font-weight: 700; }
/* KATEGORİLER */
#kategoriler { width:100%; max-width:100%; padding:40px 0 20px; background:var(--bg); }
.cats-intro{ padding-bottom: 24px; }
.cats-intro .kicker{ font-size:13px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); }
.cats-intro h2{ font-size:clamp(30px,4.6vw,56px); margin:14px 0 0; max-width:18ch; text-wrap:balance; }
.cats-intro p{ color:var(--ink-soft); max-width:52ch; margin:16px 0 0; font-size:17px; }

.cats-interactive-container { display:grid; grid-template-columns:360px 1fr; gap:40px; align-items:start; width:100%; margin-top:20px; }
.cat-list{ display:flex; flex-direction:column; gap:4px; }
.cat-item{ display:flex; align-items:center; gap:16px; padding:12px 16px; text-align:left; width:100%; border-radius:var(--r-sm); transition:all 0.3s var(--ease); position:relative; background:transparent; }
.cat-item .num{ font-family:var(--display); font-weight:600; font-size:14px; width:24px; color:var(--ink-faint); font-variant-numeric:tabular-nums; }
.cat-item .nm{ font-family:var(--display); font-weight:700; letter-spacing:-.02em; font-size:22px; color:var(--ink-soft); transition:all 0.3s var(--ease); line-height:1.05; }
.cat-item .swatch{ width:0; height:12px; border-radius:6px; transition:width 0.3s var(--ease); flex-shrink:0; }
.cat-item.active { background: var(--card); box-shadow: var(--shadow-1); border: 1px solid var(--line); }
.cat-item.active .nm{ color:var(--ink); font-size:25px; }
.cat-item.active .num{ color:var(--ink); }
.cat-item.active .swatch{ width:24px; }

.cat-stage{ position:relative; height:420px; border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--shadow-2); background:var(--bg-2); width:100%; }
.cat-panel{ position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end; padding:42px; color:#fff; height:100%; }
.cat-panel .ghost{ position:absolute; right:-10px; top:-30px; font-family:var(--display); font-weight:800; font-size:clamp(180px,24vw,260px); line-height:.8; color:rgba(255,255,255,.14); letter-spacing:-.04em; pointer-events:none; }
.cat-panel .scrim{ position:absolute; inset:0; background:linear-gradient(180deg, transparent 30%, rgba(0,0,0,.55) 100%); }
.cat-panel .body{ position:relative; z-index:2; }
.cat-panel h3{ font-size:clamp(34px,4vw,50px); color:#fff; text-wrap:balance; margin-bottom:8px; }
.cat-panel p{ margin:8px 0 0; font-size:16px; max-width:44ch; color:rgba(255,255,255,.95); text-wrap:pretty; }
.cat-cta{ align-self:flex-start; display:inline-flex; align-items:center; gap:9px; background:#fff; color:var(--ink); font-weight:700; font-size:15px; padding:14px 24px; border-radius:100px; box-shadow:0 10px 30px rgba(0,0,0,0.15); transition:transform .2s var(--ease); margin-top:24px; }

/* MEKANLAR OVERLAY */
.ov{ position:fixed; inset:0; z-index:100; background:var(--bg); display:flex; flex-direction:column; width:100%; overflow-x:hidden; }
.ov.animate-in { animation: ovPop 0.4s cubic-bezier(0.22, 0.61, 0.36, 1) forwards; }
@keyframes ovPop{ from{ opacity:0; transform:scale(0.98) translateY(10px); } to{ opacity:1; transform:none; } }

.ov-head{ display:flex; align-items:center; gap:16px; padding:18px 28px; border-bottom:1px solid var(--line); flex-shrink:0; background:var(--bg); z-index:3; width:100%; box-sizing:border-box; }
.ov-back{ display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:15px; padding:10px 16px; border-radius:100px; background:var(--bg-2); transition:background .2s; }
.ov-title{ display:flex; align-items:center; gap:12px; }
.ov-title h2{ font-size:26px; }
.ov-close{ margin-left:auto; width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:var(--bg-2); font-weight:800; cursor:pointer; }
.ov-body{ flex:1; overflow-y:auto; overflow-x:hidden; width:100%; display:flex; flex-direction:column; }
.grid{ max-width:var(--maxw); margin:0 auto; padding:40px 28px 80px; display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:32px; width:100%; }

/* APPLE PREMIUM KART */
.card { position: relative; height: 380px; border-radius: var(--r-lg); overflow: hidden; cursor: pointer; box-shadow: 0 12px 38px rgba(0,0,0,0.14); border: 1px solid rgba(255,255,255,0.18); transition: transform 0.45s cubic-bezier(0.22, 0.61, 0.36, 1), box-shadow 0.45s cubic-bezier(0.22, 0.61, 0.36, 1); display: flex; flex-direction: column; justify-content: space-between; padding: 24px; color: #fff; background-size: cover; }
.card:hover { transform: translateY(-10px) scale(1.015); box-shadow: 0 36px 70px rgba(0,0,0,0.3); }
.card .scrim { position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.35) 42%, rgba(0,0,0,0.92) 100%); z-index:1; pointer-events:none; }
.card .body { position:relative; z-index:2; display:flex; flex-direction:column; }
.card h3 { font-size:27px; color:#fff; text-wrap:balance; margin:0; font-weight:800; line-height: 1.08; text-shadow:0 2px 12px rgba(0,0,0,0.4); }
.card .card-area { display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:800; margin:10px 0 0; color:var(--accent); background:rgba(255,255,255,0.15); padding:6px 12px; border-radius:10px; align-self:flex-start; backdrop-filter:blur(8px); }
.card-note { font-size: 13px; color: rgba(255,255,255,0.78); margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.22); font-weight: 600; display: flex; align-items: center; gap: 6px; }

.subcat-card .body { justify-content:center; align-items:flex-start; height:100%; margin-top: auto; }
.subcat-card h3 { font-size:32px; line-height:1.15; }

/* APPLE TAM EKRAN İŞLETME DETAY SAYFASI */
.place-fullscreen { position:fixed; inset:0; z-index:250; background:var(--bg); overflow-y:auto; display:flex; flex-direction:column; animation:fadeIn .3s ease; }
.pf-hero { position:relative; width:100%; height:46vh; min-height:320px; max-height:480px; background:#111; overflow:hidden; }
.pf-hero img { width:100%; height:100%; object-fit:cover; }
.pf-hero-scrim { position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0.3) 0%, transparent 40%, rgba(12,16,32,0.92) 100%); }
.pf-nav-bar { position:absolute; top:20px; left:20px; right:20px; z-index:10; display:flex; justify-content:space-between; align-items:center; }
.pf-back-btn, .pf-close-btn { background:rgba(0,0,0,0.55); backdrop-filter:blur(12px); color:#fff; font-weight:800; font-size:14px; padding:10px 20px; border-radius:100px; border:1px solid rgba(255,255,255,0.2); cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:all .2s; }
.pf-back-btn:hover, .pf-close-btn:hover { transform:scale(1.05); background:rgba(0,0,0,0.75); }
.pf-hero-content { position:absolute; bottom:28px; left:24px; right:24px; color:#fff; z-index:5; max-width:860px; margin:0 auto; }
.pf-hero-badge { display:inline-block; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:0.08em; background:var(--accent); color:var(--ink); padding:4px 12px; border-radius:100px; margin-bottom:8px; }
.pf-hero-title { font-size:clamp(28px, 4.5vw, 44px); font-weight:800; margin:0 0 4px; text-shadow:0 2px 12px rgba(0,0,0,0.5); }
.pf-hero-sub { font-size:16.5px; opacity:0.9; font-weight:600; color:rgba(255,255,255,0.9); }

.pf-container { max-width:860px; margin:0 auto; padding:28px 20px 90px; width:100%; display:flex; flex-direction:column; gap:22px; box-sizing:border-box; }

/* APPLE HIZLI ETKİLEŞİM BUTONLARI (TELEFON, INSTAGRAM, HARİTA, RANDEVU) */
.pf-actions-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:12px; }
.pf-action-btn { display:flex; align-items:center; justify-content:center; gap:8px; padding:16px 18px; border-radius:18px; font-weight:800; font-size:14.5px; text-align:center; transition:all 0.25s var(--ease); box-shadow:var(--shadow-1); border:1px solid var(--line); cursor:pointer; text-decoration:none; }
.pf-action-btn:hover { transform:translateY(-3px); box-shadow:var(--shadow-2); }
.pf-btn-call { background:#fff; color:#0071e3; }
.pf-btn-insta { background:linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); color:#fff; border:none; }
.pf-btn-map { background:#fff; color:#E84142; }
.pf-btn-book { background:var(--accent); color:var(--ink); border:none; grid-column:1/-1; font-size:16.5px; padding:18px; box-shadow:0 8px 24px rgba(68,189,50,0.25); }

/* APPLE KARTLARI (HAKKINDA, HİZMETLER, İLETİŞİM) */
.pf-card { background:var(--card); border-radius:24px; padding:26px; box-shadow:var(--shadow-1); border:1px solid var(--line); display:flex; flex-direction:column; gap:12px; }
.pf-card-title { font-size:18px; font-weight:800; color:var(--ink); display:flex; align-items:center; gap:8px; }
.pf-card-desc { font-size:15.5px; line-height:1.7; color:var(--ink-soft); white-space:pre-wrap; margin:0; }

.pf-services-grid { display:flex; flex-wrap:wrap; gap:10px; margin-top:6px; }
.pf-service-tag { background:var(--bg-2); color:var(--ink); padding:9px 16px; border-radius:100px; font-size:13.5px; font-weight:700; border:1px solid var(--line); display:inline-flex; align-items:center; gap:6px; }

.pf-contact-list { display:flex; flex-direction:column; gap:10px; }
.pf-contact-row { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; background:var(--bg); border-radius:14px; border:1px solid var(--line); text-decoration:none; color:inherit; transition:background .2s; }
.pf-contact-row:hover { background:var(--bg-2); }
.pf-contact-lbl { font-size:12.5px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; }
.pf-contact-val { font-size:14.5px; font-weight:800; color:var(--ink); }

/* APPLE MINIMALIST MODAL (RANDEVU & BLOG) */
.app-modal-overlay { position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.5); backdrop-filter:blur(16px); display:grid; place-items:center; padding:16px; animation:fadeIn .2s ease; }
.app-modal-card { background:#fff; color:var(--ink); border-radius:28px; max-width:540px; width:100%; max-height:90vh; overflow-y:auto; box-shadow:var(--shadow-3); border:1px solid var(--line); padding:32px; position:relative; animation:slideUp .3s var(--ease); }
.app-modal-close { position:absolute; top:20px; right:20px; width:36px; height:36px; border-radius:50%; background:var(--bg-2); display:grid; place-items:center; font-weight:800; cursor:pointer; }
.m-form-group { margin-bottom:14px; }
.m-form-group label { display:block; font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
.m-form-input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--bg-2); color:var(--ink); outline:none; font-size:15px; }
.m-form-input:focus { border-color:#0071e3; background:#fff; }
.m-btn-primary { background:var(--ink); color:#fff; font-weight:800; padding:14px 20px; border-radius:100px; width:100%; font-size:15px; transition:all .2s; border:none; cursor:pointer; }
.m-btn-primary:hover { opacity:0.9; transform:scale(1.01); }

/* ECZANE TAM SAYFA */
.pharm-page { max-width:var(--maxw); margin:0 auto; padding:28px 28px 80px; width:100%; }
.pharm-page-bar { display:flex; flex-direction:column; gap:16px; margin-bottom:26px; }
.pharm-page-date { display:inline-flex; align-items:center; gap:8px; font-family:var(--display); font-weight:700; font-size:18px; color:var(--ink); }
.pharm-page-districts { display:flex; flex-wrap:wrap; gap:8px; }
.pharm-chip { font-size:14px; font-weight:700; padding:9px 18px; border-radius:100px; background:var(--bg-2); border:1px solid var(--line); color:var(--ink-soft); cursor:pointer; }
.pharm-chip.active { background:var(--ink); color:#fff; border-color:transparent; }
.pharm-page-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:20px; }
.pharm-card { background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:22px; box-shadow:var(--shadow-1); display:flex; flex-direction:column; gap:10px; }
.pharm-card-name { font-family:var(--display); font-size:19px; font-weight:800; color:var(--pin); }
.pharm-card-dist { font-size:11px; font-weight:800; background:var(--ink); color:#fff; padding:3px 10px; border-radius:100px; }
.pharm-card-foot { display:flex; justify-content:space-between; align-items:center; margin-top:4px; padding-top:12px; border-top:1px dashed var(--line); }

/* FOOTER */
.foot{ background:var(--dark); color:#fff; padding:60px 0 30px; margin-top:40px; width:100%; }
.foot .top{ display:flex; flex-wrap:wrap; gap:40px; justify-content:space-between; }
.foot h3{ font-size:clamp(28px,4vw,48px); color:#fff; }
.foot .lead { color:rgba(255,255,255,.6); font-size:14px; margin-top:12px; max-width:52ch; }
.foot .cols{ display:flex; gap:64px; flex-wrap:wrap; }
.foot .col a, .foot .col span{ display:block; color:rgba(255,255,255,.82); font-size:15px; padding:5px 0; }
.foot .rule{ height:1px; background:rgba(255,255,255,.1); margin:40px 0 20px; width:100%; }
.foot .bottom{ display:flex; justify-content:space-between; font-size:13.5px; color:rgba(255,255,255,.45); }

/* MOBİL ALT MENÜ */
.bottom-nav { display: none; }
@media (max-width: 680px) {
  .bottom-nav {
    display: flex; justify-content: space-around; align-items: center;
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 990;
    background: rgba(255, 255, 255, 0.85); backdrop-filter: saturate(180%) blur(20px);
    padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid rgba(0, 0, 0, 0.05); box-shadow: 0 -10px 40px rgba(0,0,0,0.04);
  }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--ink-faint); font-weight: 600; font-size: 11px; cursor: pointer; }
  .nav-item.active { color: var(--ink); font-weight: 800; transform: translateY(-2px); }
  .nav-item.active-red { color: var(--pin); font-weight: 800; transform: translateY(-2px); }
  body { padding-bottom: 84px; }
}
.fav-btn { position: absolute; top: 16px; right: 16px; z-index: 10; width: 40px; height: 40px; border-radius: 50%; background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(6px); display: grid; place-items: center; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; }
.fav-btn.is-fav svg { fill: #E84142; stroke: #E84142; }
</style>
</head>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>

<script type="text/babel">
(function(){
  "use strict";

  function slugify(text) {
    if(!text) return "";
    const trMap = { 'ç':'c', 'Ç':'c', 'ğ':'g', 'Ğ':'g', 'ş':'s', 'Ş':'s', 'ü':'u', 'Ü':'u', 'ı':'i', 'İ':'i', 'ö':'o', 'Ö':'o' };
    let str = text;
    for (let key in trMap) { str = str.replace(new RegExp(key, 'g'), trMap[key]); }
    return str.toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-');
  }

// 3D DÖNEN KÜRE MOTORU
const AGRI_LAT = 39.72, AGRI_LON = 43.05, RAD = Math.PI / 180, norm360 = a => ((a % 360) + 360) % 360;
function project(lat, lon, yaw, pitch){
  const lr = (lon + yaw) * RAD, fr = lat * RAD, b = pitch * RAD;
  return { x: Math.cos(fr) * Math.sin(lr), y: Math.sin(fr) * Math.cos(b) - Math.cos(fr) * Math.cos(lr) * Math.sin(b), z: Math.sin(fr) * Math.sin(b) + Math.cos(fr) * Math.cos(lr) * Math.cos(b) };
}

function GlobeCanvas({ phase }){
  const ref = useRef(null);
  const state = useRef({ yaw: -20, pitch: 8, targetYaw: null, targetPitch: 39.72, t: 0 });

  useEffect(() => {
    const canvas = ref.current; const ctx = canvas.getContext("2d");
    let raf, w, h, R, cx, cy, dpr = Math.min(devicePixelRatio || 1, 2);
    function size(){ w=canvas.getBoundingClientRect().width; h=canvas.getBoundingClientRect().height; canvas.width=w*dpr; canvas.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); R=Math.min(w,h)*0.27; cx=w/2; cy=h*0.54; }
    size(); window.addEventListener("resize", size);
    const GC = `220,232,255`;

    function drawArc(pts){
      ctx.beginPath(); let started = false;
      for (let i=0; i<pts.length; i++){
        if (pts[i].z > 0.02){ const sx = cx + R * pts[i].x, sy = cy - R * pts[i].y; if (!started){ ctx.moveTo(sx, sy); started = true; } else ctx.lineTo(sx, sy); } else started = false;
      }
      ctx.stroke();
    }

    function frame(ts){
      if (window.scrollY > 600) { raf = requestAnimationFrame(frame); return; }
      const s = state.current; if (!s.t) s.t = ts; const dt = Math.min(48, ts - s.t); s.t = ts;
      if (s.targetYaw == null) s.yaw -= dt * 0.024; else { s.yaw += (s.targetYaw - s.yaw) * 0.055; s.pitch += (s.targetPitch - s.pitch) * 0.06; }
      ctx.clearRect(0,0,w,h);
      const g = ctx.createRadialGradient(cx - R*0.3, cy - R*0.35, R*0.1, cx, cy, R*1.05); g.addColorStop(0, `rgba(${GC},0.10)`); g.addColorStop(0.7, `rgba(${GC},0.03)`); g.addColorStop(1, `rgba(${GC},0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fill();
      ctx.lineWidth=1.1; ctx.strokeStyle=`rgba(${GC},0.28)`; ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke();
      const yaw = s.yaw, pitch = s.pitch; ctx.lineWidth=1;
      for (let lat=-75; lat<=75; lat+=15){ ctx.strokeStyle=lat===0?`rgba(${GC},0.40)`:`rgba(${GC},0.16)`; const pts=[]; for(let lon=0; lon<=360; lon+=4) pts.push(project(lat,lon,yaw,pitch)); drawArc(pts); }
      for (let lon=0; lon<360; lon+=15){ ctx.strokeStyle=`rgba(${GC},0.16)`; const pts=[]; for(let lat=-90; lat<=90; lat+=4) pts.push(project(lat,lon,yaw,pitch)); drawArc(pts); }
      const m = project(AGRI_LAT, AGRI_LON, yaw, pitch);
      if (m.z > 0){
        const sx=cx+R*m.x, sy=cy-R*m.y, near=s.targetYaw!=null?1:0.35, pulse=(Math.sin(ts/420)+1)/2;
        ctx.strokeStyle=`rgba(68,189,50,${0.5*near})`; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(sx,sy,6+pulse*10*near,0,Math.PI*2); ctx.stroke();
        ctx.fillStyle=`rgba(68,189,50,${0.85*near+0.15})`; ctx.beginPath(); ctx.arc(sx,sy,4.5,0,Math.PI*2); ctx.fill();
      }
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    return () => { cancelAnimationFrame(raf); window.removeEventListener("resize", size); };
  }, []);

  useEffect(() => {
    const s = state.current;
    if (phase === "spin"){ s.targetYaw = null; s.targetPitch = 39.72; } else if (["locate","zoom","mountain","rest"].includes(phase)){
      if (s.targetYaw == null){ s.targetYaw = s.yaw + norm360(-AGRI_LON - s.yaw) + 360; s.targetPitch = AGRI_LAT; }
    }
  }, [phase]);

  return <canvas ref={ref} className="globe-canvas" style={{width:"100%", height:"100%"}} />;
}

function Topbar({ onOpenBooking }){
  const [scrolled, setScrolled] = useState(false);
  const [theme, setTheme] = useState(() => safeStore.get("agri_theme") || "light");

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    safeStore.set("agri_theme", theme);
  }, [theme]);

  const toggleTheme = () => {
    setTheme(prev => (prev === "dark" ? "light" : "dark"));
  };

  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 40);
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  const onDark = !scrolled;
  return (
    <div className={`topbar ${scrolled ? "scrolled" : ""} ${onDark ? "on-dark" : ""}`}>

function Hero({ onOpenCat, onOpenBooking, onSearchSelect }){
  const [phase, setPhase] = useState("spin");
  const timers = useRef([]);
  const [q, setQ] = useState("");
  const [suggs, setSuggs] = useState([]);

  useEffect(() => {
    timers.current.forEach(clearTimeout);
    [[2200, "locate"], [4000, "zoom"], [4800, "mountain"], [5600, "rest"]].forEach(([ms, p]) => timers.current.push(setTimeout(() => setPhase(p), ms)));
    return () => timers.current.forEach(clearTimeout);
  }, []);

  const handleSearch = (e) => {
    const v = e.target.value; setQ(v);
    if(v.length > 1) {
      let r = [];
      const query = v.toLowerCase();
      window.AGRI.categories.forEach(c => {
        if(c.places) c.places.forEach(p => { if(p.name.toLowerCase().includes(query)) r.push({ ...p, cat: c }); });
        if(c.subCategories) c.subCategories.forEach(sub => { if(sub.places) sub.places.forEach(p => { if(p.name.toLowerCase().includes(query)) r.push({ ...p, cat: c, subCat: sub }); }); });
      });
      setSuggs(r.slice(0, 6));
    } else setSuggs([]);
  };

  return (
    <header className={`hero ${phase==="locate"?"is-locate":""} ${phase==="zoom"?"is-zoom":""} ${["mountain","rest"].includes(phase)?"is-zoom is-mountain":""}`}>
      <div className="sky dawn"></div><div className="sun"></div>
      <div className="globe-stage"><GlobeCanvas phase={phase} /></div>
      <div className="geo-label"><div className="pt">AĞRI</div><div className="sub">39.72° K · 43.05° D</div></div>
      <div className="mountain"><img src="agridagi.png" alt="Ağrı Dağı" /></div>

      <div className="hero-content">
        <span className="hero-eyebrow">Ağrı'nın dijital kapısı</span>
        <h1 className="hero-title">Ağrı'yı <em>keşfet</em>.</h1>
        <div className="search-wrapper">
          <div className="search">
            <input value={q} onChange={handleSearch} placeholder="Mekan, doktor, diyetisyen, kurs ara..." />
            <button className="go" onClick={() => onOpenBooking()}>Randevu Al</button>
          </div>
          {suggs.length > 0 && (
            <div className="search-dropdown">
              {suggs.map((s, idx) => (
                <div key={idx} className="sugg-item" onClick={() => { setSuggs([]); onSearchSelect(s); }}>
                  <div className="s-text"><span className="s-name">{s.name}</span><span className="s-cat">{s.subName || s.cat.name}</span></div>
                </div>
              ))}
            </div>
          )}
        </div>
        <div className="search-tags">
          <button className="highlight-btn" onClick={() => onOpenBooking()}>Online Randevu Al 📅</button>
          <button onClick={() => onOpenCat(window.AGRI.categories.find(c => c.id === 'nobetci'))}>Nöbetçi Eczane</button>
          <button onClick={() => onOpenCat(window.AGRI.categories.find(c => c.id === 'gezilecek'))}>Gezilecek Yerler</button>
        </div>
      </div>
    </header>
  );
}

// 19 AĞUSTOS - 16 EYLÜL GERÇEK GÜNLÜK SAYACLI NAMAZ VAKİTLERİ (CANLI SANİYE GERİ SAYIMI & 00:00 GÜN DEĞİŞİMİ)
function PrayerTimesWidget() {
  const [currentTime, setCurrentTime] = useState(new Date());

  // Canlı Saniye Sayacı (Her saniye güncellenir)
  useEffect(() => {
    const timer = setInterval(() => {
      setCurrentTime(new Date());
    }, 1000);
    return () => clearInterval(timer);
  }, []);

  // Bugünün Tarihi
  const day = String(currentTime.getDate()).padStart(2, '0');
  const month = String(currentTime.getMonth() + 1).padStart(2, '0');
  const year = currentTime.getFullYear();
  const dateKey = `${day}.${month}.${year}`;

  // Yarının Tarihi (Gece Yatsıdan Sonraki İmsak İçin)
  const tomorrow = new Date(currentTime);
  tomorrow.setDate(tomorrow.getDate() + 1);
  const tDay = String(tomorrow.getDate()).padStart(2, '0');
  const tMonth = String(tomorrow.getMonth() + 1).padStart(2, '0');
  const tYear = tomorrow.getFullYear();
  const tDateKey = `${tDay}.${tMonth}.${tYear}`;

  const todayTimes = window.AGRI.prayerTimesData[dateKey] || window.AGRI.prayerTimesData["19.08.2026"];
  const tomorrowTimes = window.AGRI.prayerTimesData[tDateKey] || window.AGRI.prayerTimesData["20.08.2026"];

  const parseTime = (timeStr, baseDate) => {
    const [h, m] = timeStr.split(':').map(Number);
    const d = new Date(baseDate);
    d.setHours(h, m, 0, 0);
    return d;
  };

  const prayerList = [
    { key: "imsak", label: "İmsak", timeStr: todayTimes.imsak, dateObj: parseTime(todayTimes.imsak, currentTime) },
    { key: "gunes", label: "Güneş", timeStr: todayTimes.gunes, dateObj: parseTime(todayTimes.gunes, currentTime) },
    { key: "ogle", label: "Öğle", timeStr: todayTimes.ogle, dateObj: parseTime(todayTimes.ogle, currentTime) },
    { key: "ikindi", label: "İkindi", timeStr: todayTimes.ikindi, dateObj: parseTime(todayTimes.ikindi, currentTime) },
    { key: "aksam", label: "Akşam", timeStr: todayTimes.aksam, dateObj: parseTime(todayTimes.aksam, currentTime) },
    { key: "yatsi", label: "Yatsı", timeStr: todayTimes.yatsi, dateObj: parseTime(todayTimes.yatsi, currentTime) }
  ];

  let nextPrayer = null;
  let activeIndex = 5;

  if (currentTime < prayerList[0].dateObj) {
    nextPrayer = prayerList[0];
    activeIndex = 5;
  } else if (currentTime < prayerList[1].dateObj) {
    nextPrayer = prayerList[1];
    activeIndex = 0;
  } else if (currentTime < prayerList[2].dateObj) {
    nextPrayer = prayerList[2];
    activeIndex = 1;
  } else if (currentTime < prayerList[3].dateObj) {
    nextPrayer = prayerList[3];
    activeIndex = 2;
  } else if (currentTime < prayerList[4].dateObj) {
    nextPrayer = prayerList[4];
    activeIndex = 3;
  } else if (currentTime < prayerList[5].dateObj) {
    nextPrayer = prayerList[5];
    activeIndex = 4;
  } else {
    // Yatsıdan sonra ertesi günün İmsak vaktine geri sayım
    nextPrayer = {
      key: "imsak",
      label: "İmsak",
      timeStr: tomorrowTimes.imsak,
      dateObj: parseTime(tomorrowTimes.imsak, tomorrow)
    };
    activeIndex = 5;
  }

  // Saniye saniye hesaplama
  const diffMs = Math.max(0, nextPrayer.dateObj - currentTime);
  const totalSec = Math.floor(diffMs / 1000);
  const hours = Math.floor(totalSec / 3600);
  const mins = Math.floor((totalSec % 3600) / 60);
  const secs = totalSec % 60;
  const countdownStr = `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

  const dateOptions = { day: 'numeric', month: 'long', year: 'numeric', weekday: 'long' };
  const formattedDate = currentTime.toLocaleDateString('tr-TR', dateOptions);

  return (
    <div className="widget-card prayer">
      <div className="p-top">
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
          <span style={{fontSize:'16px', fontWeight:800}}>Ağrı Namaz Vakitleri</span>
        </div>
        
        {/* İmsakın üstündeki güncel canlı tarih */}
        <div style={{fontSize:'12.5px', color:'var(--accent)', fontWeight:700, margin:'4px 0 10px'}}>
          📅 {formattedDate}

// TÜM İŞLETMELERİN DÜZ LİSTESİ
function getAllBusinesses() {
  let list = [];
  window.AGRI.categories.forEach(c => {
    if (c.id === "gezilecek" || c.id === "nobetci") return;
    if (c.places && c.places.length > 0) list = list.concat(c.places);
    if (c.subCategories) {
      c.subCategories.forEach(sub => {
        if (sub.places && sub.places.length > 0) list = list.concat(sub.places);
      });
    }
  });
  return list;
}

// TÜRKÇE KARAKTERLERİN PDF'TE VE EXCELDE BOZULMASINI ÖNLEYEN DÖNÜŞTÜRÜCÜ ($0)
function fixTr(text) {
  if (!text) return "";
  const trMap = {
    'ç': 'c', 'Ç': 'C',
    'ğ': 'g', 'Ğ': 'G',
    'ş': 's', 'Ş': 'S',
    'ü': 'u', 'Ü': 'U',
    'ı': 'i', 'İ': 'I',
    'ö': 'o', 'Ö': 'O'
  };
  return String(text).replace(/[çÇğĞşŞüÜıİöÖ]/g, m => trMap[m]);
}

// EXCEL (CSV UTF-8) FORMATINDA İNDİRME ($0)
function exportToExcel(appointments, bizName, filterName) {
  const headers = ["PNR Kodu", "Musteri Adi", "Telefon", "E-Posta", "Randevu Tarihi", "Saat", "Durum", "Not"];
  const rows = appointments.map(a => [
    a.code,
    fixTr(a.name),
    a.phone,
    a.email || "-",
    a.date,
    a.time,
    a.status === 'approved' ? 'Onaylandi' : a.status === 'rejected' ? 'Reddedildi' : 'Beklemede',
    fixTr(a.note || "-")
  ]);

  let csvContent = "\uFEFF"; // Excel Türkçe karakter desteği için UTF-8 BOM
  csvContent += headers.join(";") + "\r\n";
  rows.forEach(r => {
    csvContent += r.map(field => `"${String(field).replace(/"/g, '""')}"`).join(";") + "\r\n";
  });

  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `04Agri_Randevular_${fixTr(bizName)}_${filterName}.csv`;
  link.click();
}

    doc.text(a.phone, 90, y);

    const st = a.status === 'approved' ? 'ONAYLANDI' : a.status === 'rejected' ? 'REDDEDILDI' : 'BEKLEMEDE';
