<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>04agri.com — Yönetim Paneli</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Ücretsiz PDF & Excel Kütüphaneleri (0 TL) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #86868b;
      --line: #e5e5ea;
      --accent: #0071e3;
      --success: #34c759;
      --danger: #ff3b30;
      --radius: 18px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Plus Jakarta Sans", -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased; }
    .container { max-width: 1080px; margin: 0 auto; padding: 24px 20px 80px; }
    
    /* Apple Minimalist Giriş Ekranı */
    .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    .login-card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); text-align: center; }
    .login-logo { width: 44px; height: 44px; background: #1d1d1f; color: #fff; border-radius: 12px; display: inline-grid; place-items: center; font-weight: 800; font-size: 20px; margin-bottom: 16px; }
    
    .form-group { text-align: left; margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
    .input-field { width: 100%; padding: 13px 16px; border-radius: 12px; border: 1px solid var(--line); background: #fafafa; font-size: 15px; color: var(--text); outline: none; transition: border .2s; }
    .input-field:focus { border-color: var(--accent); background: #fff; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; border: none; transition: all .2s; }
    .btn-primary { background: #1d1d1f; color: #fff; }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-sm { width: auto; padding: 8px 14px; font-size: 13px; border-radius: 8px; }
    
    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
    .header h1 { font-size: 24px; font-weight: 800; }
    .user-pill { font-size: 13px; font-weight: 700; background: var(--card); padding: 6px 14px; border-radius: 100px; border: 1px solid var(--line); color: var(--muted); }
    
    /* Tabs */
    .tabs { display: flex; gap: 8px; margin-bottom: 24px; overflow-x: auto; padding-bottom: 4px; }
    .tab-btn { padding: 10px 18px; border-radius: 100px; font-weight: 700; font-size: 14px; color: var(--muted); background: transparent; cursor: pointer; white-space: nowrap; transition: all .2s; }
    .tab-btn.active { background: #1d1d1f; color: #fff; }
    
    /* Kartlar */
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
    .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
    .card-title { font-size: 18px; font-weight: 800; }
    
    /* Tablo */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th { padding: 12px 14px; color: var(--muted); font-size: 12px; font-weight: 700; border-bottom: 1px solid var(--line); text-transform: uppercase; }
    td { padding: 16px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 100px; font-size: 12px; font-weight: 800; }
    .badge-success { background: rgba(52,199,89,0.12); color: var(--success); }
    .badge-danger { background: rgba(255,59,48,0.12); color: var(--danger); }
    .badge-warning { background: rgba(255,149,0,0.12); color: #ff9500; }
    
    /* Saat Seçici */
    .schedule-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 14px; }
    .schedule-chip { background: #fafafa; border: 1px solid var(--line); padding: 10px; border-radius: 10px; text-align: center; cursor: pointer; font-weight: 700; font-size: 13px; }
    .schedule-chip.active { background: #1d1d1f; color: #fff; border-color: #1d1d1f; }
  </style>
</head>
<body>

<div id="app"></div>

<script>
  let token = localStorage.getItem("04_token");
  let user = JSON.parse(localStorage.getItem("04_user") || "null");
  let activeTab = "appointments";
  let appointments = [];
  let blogs = [];
  let schedule = { working_days: ["Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"], slot_duration: 30 };
  let superData = null;

  function render() {
    const root = document.getElementById("app");
    if (!token || !user) {
      root.innerHTML = `
        <div class="login-wrap">
          <div class="login-card">
            <div class="login-logo">04</div>
            <h2 style="font-size:20px; font-weight:800; margin-bottom:6px;">Yönetici Girişi</h2>
            <p style="font-size:14px; color:var(--muted); margin-bottom:24px;">04agri.com İşletme Portalı</p>
            <form onsubmit="handleLogin(event)">
              <div class="form-group">
                <label>Kullanıcı Adı</label>
                <input class="input-field" id="u_name" required placeholder="" />
              </div>
              <div class="form-group">
                <label>Şifre</label>
                <input class="input-field" id="u_pass" type="password" required placeholder="" />
              </div>
              <button type="submit" class="btn btn-primary">Giriş Yap ➔</button>
            </form>
          </div>
        </div>
      `;
      return;
    }

    const isSuper = user.role === "superadmin";

    root.innerHTML = `
      <div class="container">
        <div class="header">
          <div>
            <h1>${user.name}</h1>
            <span class="user-pill">${isSuper ? '👑 Süper Admin (Tam Yetki)' : 'İşletme Hesabı'}</span>
          </div>
          <button class="btn btn-sm" style="background:#fff; border:1px solid var(--line);" onclick="logout()">Çıkış Yap</button>
        </div>

        <div class="tabs">
          <button class="tab-btn ${activeTab==='appointments'?'active':''}" onclick="setTab('appointments')">📅 Randevular (${appointments.length})</button>
          <button class="tab-btn ${activeTab==='schedule'?'active':''}" onclick="setTab('schedule')">⏰ Çalışma Saatleri & Aralıklar</button>
          <button class="tab-btn ${activeTab==='blogs'?'active':''}" onclick="setTab('blogs')">✍️ Duyuru & Blog</button>
          <button class="tab-btn ${activeTab==='profile'?'active':''}" onclick="setTab('profile')">🔑 Profil & Şifre</button>
          ${isSuper ? `<button class="tab-btn ${activeTab==='super'?'active':''}" onclick="setTab('super')">🛡️ Süper Admin Master Paneli</button>` : ''}
        </div>

        ${activeTab === 'appointments' ? renderAppointments() : ''}
        ${activeTab === 'schedule' ? renderSchedule() : ''}
        ${activeTab === 'blogs' ? renderBlogs() : ''}
        ${activeTab === 'profile' ? renderProfile() : ''}
        ${activeTab === 'super' && isSuper ? renderSuperAdmin() : ''}
      </div>
    `;
  }

  function renderAppointments() {
    return `
      <div class="card">
        <div class="card-head">
          <div class="card-title">Randevu Takip Listesi</div>
          <div style="display:flex; gap:8px;">
            <button class="btn btn-sm" style="background:#fff; border:1px solid var(--line);" onclick="exportExcel()">📊 Excel İndir</button>
            <button class="btn btn-sm btn-primary" onclick="exportAppointmentsPDF('all')">📄 Tümünü PDF İndir</button>
            <button class="btn btn-sm" style="background:rgba(255,59,48,0.1); color:var(--danger);" onclick="exportAppointmentsPDF('deleted')">Silinenleri PDF Al</button>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Kod / Tarih</th>
                <th>Müşteri Bilgisi</th>
                <th>Not</th>
                <th>Durum</th>
                <th>İşlemler</th>
              </tr>
            </thead>
            <tbody>
              ${appointments.length === 0 ? '<tr><td colspan="5" style="text-align:center; color:var(--muted); padding:30px;">Henüz randevu kaydı bulunmamaktadır.</td></tr>' : ''}
              ${appointments.map(a => `
                <tr style="${a.is_deleted ? 'background:#fff8f8; opacity:0.85;' : ''}">
                  <td>
                    <strong>${a.code || 'AGR-0000'}</strong><br>
                    <span style="font-size:13px; color:var(--muted);">${a.appointment_date} - ${a.appointment_time}</span>
                  </td>
                  <td>
                    <strong>${a.customer_name}</strong><br>
                    <span style="font-size:13px; color:var(--muted);">📞 ${a.customer_phone} | ✉️ ${a.customer_email || 'Yok'}</span>
                  </td>
                  <td style="max-width:200px; font-size:13px;">${a.customer_note || '-'}</td>
                  <td>
                    ${a.is_deleted ? `<span class="badge badge-danger">Silindi (${a.deleted_by || 'Müşteri'})</span><div style="font-size:11px; color:var(--muted); margin-top:2px;">${a.deleted_at || ''}</div>` : (a.status==='Onaylandı'?`<span class="badge badge-success">Onaylandı</span>`:`<span class="badge badge-warning">Bekliyor</span>`)}
                  </td>
                  <td>
                    <div style="display:flex; gap:6px;">
                      ${!a.is_deleted ? `
                        <button class="btn btn-sm" style="background:#e5f9e7; color:#2e7d32;" onclick="approveAppt(${a.id})">Onayla</button>
                        <button class="btn btn-sm" style="background:#ffebee; color:#c62828;" onclick="deleteAppt(${a.id})">Sil</button>
                      ` : ''}
                      <button class="btn btn-sm" style="background:#f0f0f0;" onclick="downloadSingleApptPDF(${JSON.stringify(a).replace(/"/g, '&quot;')})">PDF</button>
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  function renderSchedule() {
    const days = ["Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi", "Pazar"];
    return `
      <div class="card">
        <div class="card-title" style="margin-bottom:14px;">Çalışma Günleri & Seans Süreleri</div>
        <p style="font-size:14px; color:var(--muted); margin-bottom:20px;">Randevu alınabilecek günleri ve seans sürelerini belirleyin.</p>
        
        <div class="form-group">
          <label>Seans / Randevu Süresi</label>
          <select class="input-field" style="max-width:260px;" id="slot_dur" onchange="schedule.slot_duration = parseInt(this.value)">
            <option value="15" ${schedule.slot_duration===15?'selected':''}>15 Dakika</option>
            <option value="30" ${schedule.slot_duration===30?'selected':''}>30 Dakika</option>
            <option value="45" ${schedule.slot_duration===45?'selected':''}>45 Dakika</option>
            <option value="60" ${schedule.slot_duration===60?'selected':''}>1 Saat (60 Dk)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Açık Olduğunuz Günler (Tıklayıp Açın/Kapatın)</label>
          <div class="schedule-grid">
            ${days.map(d => {
              const active = schedule.working_days.includes(d);
              return `<div class="schedule-chip ${active?'active':''}" onclick="toggleDay('${d}')">${d} ${active?'✓':''}</div>`;
            }).join('')}
          </div>
        </div>

        <button class="btn btn-primary" style="max-width:200px; margin-top:16px;" onclick="saveSchedule()">Değişiklikleri Kaydet</button>
      </div>
    `;
  }

  function renderBlogs() {
    return `
      <div class="card">
        <div class="card-head">
          <div class="card-title">Yeni Duyuru / Blog Yazısı</div>
        </div>
        <form onsubmit="handleCreateBlog(event)">
          <div class="form-group"><label>Başlık</label><input class="input-field" id="b_title" required placeholder="Duyuru veya Blog Başlığı" /></div>
          <div class="form-group"><label>İçerik Metni</label><textarea class="input-field" id="b_content" rows="4" required placeholder="Yazınızı buraya yazın..."></textarea></div>
          <button type="submit" class="btn btn-primary" style="max-width:200px;">Süper Admin Onayına Gönder</button>
        </form>
      </div>

      <div class="card">
        <div class="card-title" style="margin-bottom:16px;">Yayınlanan / Onay Bekleyen Yazılarım</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Tarih</th><th>Başlık</th><th>Durum</th><th>İşlem</th></tr></thead>
            <tbody>
              ${blogs.length===0?'<tr><td colspan="4" style="text-align:center; color:var(--muted);">Henüz yazınız bulunmuyor.</td></tr>':''}
              ${blogs.map(b => `
                <tr>
                  <td>${b.created_at?.split('T')[0]}</td>
                  <td><strong>${b.title}</strong></td>
                  <td>
                    ${b.status==='approved'?'<span class="badge badge-success">Yayında</span>':(b.status==='rejected'?`<span class="badge badge-danger">Reddedildi (Gerekçe: ${b.rejection_reason || 'Yok'})</span>`:'<span class="badge badge-warning">Onay Bekliyor</span>')}
                  </td>
                  <td>
                    <button class="btn btn-sm" style="background:#ffebee; color:#c62828;" onclick="deleteBlog(${b.id})">Sil</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  function renderProfile() {
    return `
      <div class="card" style="max-width:500px;">
        <div class="card-title" style="margin-bottom:16px;">Profil & Şifre Güncelleme</div>
        <form onsubmit="handleUpdateProfile(event)">
          <div class="form-group"><label>Kullanıcı Adı</label><input class="input-field" id="p_user" value="${user.username}" required /></div>
          <div class="form-group"><label>Telefon</label><input class="input-field" id="p_phone" value="${user.phone || ''}" /></div>
          <div class="form-group"><label>E-Posta</label><input class="input-field" id="p_email" value="${user.email || ''}" /></div>
          <div class="form-group"><label>Yeni Şifre (Boş bırakırsanız değişmez)</label><input class="input-field" id="p_pass" type="password" placeholder="Yeni şifre belirleyin" /></div>
          <button type="submit" class="btn btn-primary">Bilgileri Güncelle</button>
        </form>
      </div>
    `;
  }

  function renderSuperAdmin() {
    if (!superData) return '<div class="card">Veriler yükleniyor...</div>';
    return `
      <div class="card">
        <div class="card-title" style="margin-bottom:16px;">📝 Blog Onay Havuzu</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>İşletme</th><th>Başlık</th><th>İçerik</th><th>İşlem</th></tr></thead>
            <tbody>
              ${superData.blogs.map(b => `
                <tr>
                  <td><strong>${b.business_name}</strong></td>
                  <td>${b.title}</td>
                  <td style="max-width:300px; font-size:13px;">${b.content}</td>
                  <td>
                    ${b.status==='pending'?`
                      <div style="display:flex; gap:6px;">
                        <button class="btn btn-sm" style="background:#e5f9e7; color:#2e7d32;" onclick="moderateBlog(${b.id}, 'approved')">Onayla</button>
                        <button class="btn btn-sm" style="background:#ffebee; color:#c62828;" onclick="rejectBlogPrompt(${b.id})">Reddet</button>
                      </div>
                    ` : `<span class="badge ${b.status==='approved'?'badge-success':'badge-danger'}">${b.status}</span>`}
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="card-title" style="margin-bottom:16px;">🏢 23 İşletme Yönetimi</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>İşletme Adı</th><th>Kullanıcı Adı</th><th>Durum</th><th>İşlem</th></tr></thead>
            <tbody>
              ${superData.businesses.map(bz => `
                <tr>
                  <td><strong>${bz.name}</strong></td>
                  <td>${bz.username}</td>
                  <td>${bz.is_frozen ? '<span class="badge badge-danger">Donduruldu</span>' : '<span class="badge badge-success">Aktif</span>'}</td>
                  <td>
                    <div style="display:flex; gap:6px;">
                      <button class="btn btn-sm" style="background:#f0f0f0;" onclick="adminChangeCreds('${bz.id}')">Şifre Değiştir</button>
                      <button class="btn btn-sm" style="background:${bz.is_frozen?'#e5f9e7':'#ffebee'}; color:${bz.is_frozen?'#2e7d32':'#c62828'};" onclick="adminToggleFreeze('${bz.id}', ${bz.is_frozen?0:1})">${bz.is_frozen?'Aktif Et':'Dondur'}</button>
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="card-title" style="margin-bottom:16px;">🛡️ Canlı Denetim Logları (Audit Trail)</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Tarih/Saat</th><th>Yapan</th><th>Eylem</th><th>Detay</th></tr></thead>
            <tbody>
              ${superData.logs.map(l => `
                <tr>
                  <td style="font-size:12px; color:var(--muted);">${l.created_at}</td>
                  <td><strong>${l.performed_by}</strong></td>
                  <td><span class="badge badge-warning">${l.action}</span></td>
                  <td style="font-size:13px;">${l.details}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  // Fonksiyonlar
  async function handleLogin(e) {
    e.preventDefault();
    const u = document.getElementById("u_name").value.trim();
    const p = document.getElementById("u_pass").value.trim();
    const res = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: u, password: p }) });
    const data = await res.json();
    if (data.success) {
      localStorage.setItem("04_token", data.token);
      localStorage.setItem("04_user", JSON.stringify(data.user));
      token = data.token; user = data.user;
      initData();
    } else alert(data.error || "Giriş başarısız.");
  }

  function logout() { localStorage.clear(); location.reload(); }
  function setTab(t) { activeTab = t; if (t==='super') loadSuper(); else render(); }

  async function initData() {
    if (!token) return;
    try {
      const aRes = await fetch("/api/appointments", { headers: { Authorization: "Bearer " + token } });
      appointments = await aRes.json();
      const bRes = await fetch("/api/my-blogs", { headers: { Authorization: "Bearer " + token } });
      blogs = await bRes.json();
      const sRes = await fetch("/api/get-schedule", { headers: { Authorization: "Bearer " + token } });
      const sData = await sRes.json();
      if (sData.working_days) schedule.working_days = JSON.parse(sData.working_days);
      if (sData.slot_duration) schedule.slot_duration = sData.slot_duration;
      render();
    } catch(e) {}
  }

  async function loadSuper() {
    const res = await fetch("/api/superadmin-data", { headers: { Authorization: "Bearer " + token } });
    superData = await res.json();
    render();
  }

  function toggleDay(d) {
    if (schedule.working_days.includes(d)) schedule.working_days = schedule.working_days.filter(x=>x!==d);
    else schedule.working_days.push(d);
    render();
  }

  async function saveSchedule() {
    await fetch("/api/save-schedule", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + token }, body: JSON.stringify(schedule) });
    alert("Çalışma saatleri güncellendi.");
  }

  async function approveAppt(id) {
    await fetch("/api/approve-appointment", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + token }, body: JSON.stringify({ id }) });
    initData();
  }
  async function deleteAppt(id) {
    if (confirm("Bu randevuyu silmek istediğinize emin misiniz?")) {
      await fetch("/api/delete-appointment", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + token }, body: JSON.stringify({ id }) });
      initData();
    }
  }

  async function handleCreateBlog(e) {
    e.preventDefault();
    const title = document.getElementById("b_title").value;
    const content = document.getElementById("b_content").value;
    await fetch("/api/create-blog", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + token }, body: JSON.stringify({ title, content }) });
    alert("Yazınız onaya iletildi.");
    initData();
  }

  async function deleteBlog(id) {
    if (confirm("Yazıyı silmek istiyor musunuz?")) {
      await fetch("/api/delete-blog", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + token }, body: JSON.stringify({ id }) });
      initData();
    }
  }

  async function moderateBlog(id, status, reason = "") {
    await fetch("/api/moderate-blog", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + token }, body: JSON.stringify({ id, status, rejection_reason: reason }) });
    loadSuper();
  }
  function rejectBlogPrompt(id) {
    const r = prompt("Lütfen ret gerekçenizi yazın:");
    if (r) moderateBlog(id, "rejected", r);
  }

  async function handleUpdateProfile(e) {
    e.preventDefault();
    const u = document.getElementById("p_user").value;
    const ph = document.getElementById("p_phone").value;
    const em = document.getElementById("p_email").value;
    const ps = document.getElementById("p_pass").value;
    const res = await fetch("/api/update-profile", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + token }, body: JSON.stringify({ username: u, phone: ph, email: em, password: ps }) });
    const data = await res.json();
    alert(data.message || "Güncellendi.");
  }

  function adminChangeCreds(tId) {
    const u = prompt("Yeni Kullanıcı Adı:");
    const p = prompt("Yeni Şifre:");
    if (u && p) {
      fetch("/api/superadmin-action", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + token }, body: JSON.stringify({ action: "change_creds", target_id: tId, value: u, value2: p }) }).then(()=>loadSuper());
    }
  }
  function adminToggleFreeze(tId, val) {
    fetch("/api/superadmin-action", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + token }, body: JSON.stringify({ action: "toggle_freeze", target_id: tId, value: val }) }).then(()=>loadSuper());
  }

  function downloadSingleApptPDF(a) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.text("04agri.com - Randevu Detay Fisi", 14, 20);
    doc.text(`Takip Kodu: ${a.code || 'Yok'}`, 14, 30);
    doc.text(`Musteri: ${a.customer_name}`, 14, 40);
    doc.text(`Telefon: ${a.customer_phone}`, 14, 50);
    doc.text(`Tarih/Saat: ${a.appointment_date} ${a.appointment_time}`, 14, 60);
    doc.text(`Not: ${a.customer_note || '-'}`, 14, 70);
    doc.save(`Randevu_${a.code || a.id}.pdf`);
  }

  function exportAppointmentsPDF(type) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.text(`04agri.com - Randevu Raporu (${type.toUpperCase()})`, 14, 20);
    let y = 35;
    const list = type==='deleted' ? appointments.filter(a=>a.is_deleted) : appointments;
    list.forEach((a, i) => {
      if (y > 270) { doc.addPage(); y = 20; }
      doc.text(`${i+1}. [${a.code}] ${a.customer_name} (${a.customer_phone}) - ${a.appointment_date} ${a.appointment_time} - Durum: ${a.is_deleted?'Silindi':a.status}`, 14, y);
      y += 10;
    });
    doc.save(`Randevular_${type}.pdf`);
  }

  function exportExcel() {
    const ws = XLSX.utils.json_to_sheet(appointments);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Randevular");
    XLSX.writeFile(wb, "04agri_randevular.xlsx");
  }

  if (token) initData();
  else render();
</script>
</body>
</html>
